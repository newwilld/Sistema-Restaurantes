<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>WA Sistema de Vendas</title>
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    colors: {
                        brand: {
                            50: '#fef2f2',
                            100: '#fee2e2',
                            500: '#ef4444', // Red
                            600: '#dc2626',
                            900: '#7f1d1d',
                            dark: '#0f172a', // Deep navy/black
                        }
                    }
                }
            }
        }
    </script>

    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8fafc;
            color: #0f172a;
            -webkit-tap-highlight-color: transparent;
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }

        /* Animations */
        .fade-in { animation: fadeIn 0.3s ease-in-out; }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .slide-in-right { animation: slideInRight 0.3s forwards; }
        @keyframes slideInRight {
            from { transform: translateX(100%); }
            to { transform: translateX(0); }
        }

        /* Modals & Overlays */
        .overlay {
            background: rgba(15, 23, 42, 0.7);
            backdrop-filter: blur(4px);
        }

        /* Product Image Aspect Ratio */
        .img-container {
            position: relative;
            width: 100%;
            padding-top: 75%; /* 4:3 Aspect Ratio */
            overflow: hidden;
            background-color: #f1f5f9;
        }
        .img-container img {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* Loading Spinner */
        .loader {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #ef4444;
            border-radius: 50%;
            width: 24px;
            height: 24px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        /* Utilities */
        .hide-scroll::-webkit-scrollbar { display: none; }
        .hide-scroll { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="antialiased h-screen overflow-hidden flex flex-col">

    <!-- Main Container for SPA Routing -->
    <div id="app" class="h-full w-full overflow-y-auto relative">
        <!-- Content injected here via JS -->
        <div class="flex items-center justify-center h-full w-full">
            <div class="loader w-12 h-12 border-4"></div>
        </div>
    </div>

    <!-- Global UI Elements -->
    <div id="toast-container" class="fixed bottom-4 right-4 z-[9999] flex flex-col gap-2"></div>
    <div id="modal-container"></div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut, onAuthStateChanged, updateProfile, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, getDoc, setDoc, collection, getDocs, updateDoc, deleteDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // Environment Variables Handling
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'wa-vendas-default';
        
        // Custom Firebase Config provided by user (willdalves1@gmail.com)
        const firebaseConfig = {
            apiKey: "AIzaSyCZyMVAn_F3me72l8N1PqKTfgnb0cQpUKA",
            authDomain: "sistema-restaurantes-6baf8.firebaseapp.com",
            projectId: "sistema-restaurantes-6baf8",
            storageBucket: "sistema-restaurantes-6baf8.firebasestorage.app",
            messagingSenderId: "753663577381",
            appId: "1:753663577381:web:9771b3c0004264b2745ecc",
            measurementId: "G-0B4Q7M2V5K"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);

        // Required Path Structure Strings
        const basePathPublic = `artifacts/${appId}/public/data`;
        const pathTenants = `${basePathPublic}/saas_tenants`;
        const pathProducts = `${basePathPublic}/saas_products`;
        const pathOrders = `${basePathPublic}/saas_orders`;

        // --- Application State ---
        const state = {
            currentUser: null,      // Firebase Auth User
            currentTenant: null,    // Admin data for logged in user
            
            // Public Menu State
            viewingSlug: null,      // URL slug currently being viewed
            publicTenant: null,     // Tenant data for the public menu
            publicProducts: [],     // Products for the public menu
            cart: [],
            cartTotal: 0,
            
            // Admin Dashboard State
            adminProducts: [],
            adminOrders: [],
            
            isAppLoaded: false
        };

        // --- Core Functions ---

        function generateId() {
            return Math.random().toString(36).substring(2, 15);
        }

        function showToast(message, type = 'success') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            const bgColor = type === 'success' ? 'bg-green-600' : (type === 'error' ? 'bg-red-600' : 'bg-gray-800');
            toast.className = `${bgColor} text-white px-6 py-3 rounded-lg shadow-lg fade-in flex items-center gap-2 transform transition-all duration-300 translate-y-0 opacity-100`;
            toast.innerHTML = `<i class="fas ${type === 'success' ? 'fa-check-circle' : 'fa-exclamation-circle'}"></i> ${message}`;
            container.appendChild(toast);
            setTimeout(() => {
                toast.classList.add('opacity-0', 'translate-y-2');
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }

        function openModal(htmlContent) {
            const container = document.getElementById('modal-container');
            container.innerHTML = htmlContent;
        }

        function closeModal() {
            document.getElementById('modal-container').innerHTML = '';
        }

        // --- Routing System ---
        
        function setupRouter() {
            window.addEventListener('hashchange', handleRoute);
            handleRoute();
        }

        async function handleRoute() {
            const hash = window.location.hash;
            const appDiv = document.getElementById('app');

            if (!state.isAppLoaded) return; // Wait for initial auth check

            if (hash === '' || hash === '#/') {
                renderLanding(appDiv);
            } 
            else if (hash === '#/login') {
                if (state.currentUser && state.currentTenant) {
                    window.location.hash = '#/admin';
                } else {
                    renderAuth(appDiv);
                }
            } 
            else if (hash.startsWith('#/admin')) {
                if (!state.currentUser || !state.currentTenant) {
                    window.location.hash = '#/login';
                } else {
                    renderAdmin(appDiv, hash);
                }
            } 
            else if (hash.startsWith('#/cardapio/')) {
                const slug = hash.split('/')[2];
                if (slug) {
                    await loadPublicMenuData(slug);
                    if (state.publicTenant) {
                        renderPublicMenu(appDiv);
                    } else {
                        appDiv.innerHTML = `<div class="h-full flex flex-col items-center justify-center bg-gray-50"><h1 class="text-2xl font-bold text-gray-800">Cardápio não encontrado</h1><p class="text-gray-500 mt-2">O link informado é inválido.</p><a href="#/" class="mt-6 px-6 py-2 bg-brand-500 text-white rounded-lg">Ir para a Home</a></div>`;
                    }
                }
            }
        }

        // --- Authentication & Initialization ---

        async function initializeAppAuth() {
            onAuthStateChanged(auth, async (user) => {
                state.currentUser = user;
                if (user) {
                    // Try to load tenant profile if it exists (meaning they are a registered admin)
                    try {
                        const docRef = doc(db, pathTenants, user.uid);
                        const docSnap = await getDoc(docRef);
                        if (docSnap.exists()) {
                            state.currentTenant = docSnap.data();
                        } else {
                            state.currentTenant = null;
                        }
                    } catch (e) {
                        console.error("Error loading tenant profile:", e);
                    }
                } else {
                    state.currentTenant = null;
                }
                
                if (!state.isAppLoaded) {
                    state.isAppLoaded = true;
                    handleRoute();
                } else {
                    // Re-evaluate route on auth change
                    handleRoute();
                }
            });
        }

        // --- Firebase Data Operations ---

        async function loadPublicMenuData(slug) {
            state.viewingSlug = slug;
            state.publicTenant = null;
            state.publicProducts = [];

            try {
                // Rule 2 states no complex queries. We fetch all tenants and filter in memory.
                // In a production environment outside these strict rules, we'd use where('slug', '==', slug)
                const tenantsSnap = await getDocs(collection(db, pathTenants));
                let foundTenant = null;
                tenantsSnap.forEach(doc => {
                    const data = doc.data();
                    if (data.slug === slug) {
                        foundTenant = { id: doc.id, ...data };
                    }
                });

                if (foundTenant) {
                    state.publicTenant = foundTenant;
                    
                    // Fetch all products and filter
                    const productsSnap = await getDocs(collection(db, pathProducts));
                    const products = [];
                    productsSnap.forEach(doc => {
                        const p = { id: doc.id, ...doc.data() };
                        if (p.tenantId === foundTenant.id && p.active !== false) {
                            products.push(p);
                        }
                    });
                    
                    // Group products by category
                    state.publicProducts = products;
                }
            } catch (error) {
                console.error("Error loading menu data:", error);
            }
        }

        async function createTenant(uid, name, slug) {
            const newTenant = {
                uid: uid,
                name: name,
                slug: slug,
                createdAt: new Date().toISOString(),
                status: 'active',
                plan: 'trial',
                settings: {
                    color: '#ef4444',
                    isOpen: true,
                    minOrder: 0,
                    deliveryFee: 5.00
                },
                categories: [
                    { id: generateId(), name: 'Destaques', order: 1 },
                    { id: generateId(), name: 'Bebidas', order: 2 }
                ]
            };
            await setDoc(doc(db, pathTenants, uid), newTenant);
            state.currentTenant = newTenant;
            
            // Add a demo product
            const demoProd = {
                tenantId: uid,
                categoryId: newTenant.categories[0].id,
                name: "Produto Demo",
                desc: "Esta é uma descrição de exemplo para o seu produto.",
                price: 19.90,
                image: "https://placehold.co/400x300/f8fafc/0f172a?text=Demo",
                active: true,
                createdAt: new Date().toISOString()
            };
            await setDoc(doc(db, pathProducts, generateId()), demoProd);
        }

        async function saveProduct(productData) {
            if (!state.currentUser || !state.currentTenant) return;
            const id = productData.id || generateId();
            const data = {
                ...productData,
                tenantId: state.currentUser.uid,
                updatedAt: new Date().toISOString()
            };
            if(!productData.id) data.createdAt = new Date().toISOString();
            
            await setDoc(doc(db, pathProducts, id), data);
            showToast('Produto salvo com sucesso!');
            loadAdminData(); // Refresh
        }

        async function placeOrder(orderData) {
            if (!state.publicTenant) return false;
            
            const orderId = 'ORD-' + Math.floor(1000 + Math.random() * 9000);
            const order = {
                id: orderId,
                tenantId: state.publicTenant.id,
                ...orderData,
                status: 'novo',
                createdAt: new Date().toISOString()
            };

            try {
                await setDoc(doc(db, pathOrders, orderId), order);
                state.cart = [];
                updateCartTotal();
                return orderId;
            } catch (error) {
                console.error("Error placing order:", error);
                return false;
            }
        }

        // Realtime Listener for Admin Orders
        let unsubOrders = null;
        function listenToAdminOrders() {
            if (!state.currentUser) return;
            if (unsubOrders) unsubOrders();

            const ordersRef = collection(db, pathOrders);
            // Fetch all and filter in JS due to Rule 2
            unsubOrders = onSnapshot(ordersRef, (snapshot) => {
                const orders = [];
                snapshot.forEach(doc => {
                    const data = doc.data();
                    if (data.tenantId === state.currentUser.uid) {
                        orders.push(data);
                    }
                });
                
                // Sort by date descending
                orders.sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt));
                
                state.adminOrders = orders;
                
                // If on orders view, re-render specific part
                const ordersListDiv = document.getElementById('admin-orders-list');
                if (ordersListDiv) {
                    ordersListDiv.innerHTML = renderAdminOrdersList(orders);
                }
                
                // Update Dashboard stats if present
                updateDashboardStats();
            }, (error) => {
                console.error("Error listening to orders:", error);
            });
        }

        async function loadAdminData() {
            if (!state.currentUser) return;
            
            // Load Products
            const productsSnap = await getDocs(collection(db, pathProducts));
            const products = [];
            productsSnap.forEach(doc => {
                const data = { id: doc.id, ...doc.data() };
                if (data.tenantId === state.currentUser.uid) {
                    products.push(data);
                }
            });
            state.adminProducts = products;
            
            // Re-render views if they exist
            const productListDiv = document.getElementById('admin-product-list');
            if(productListDiv) productListDiv.innerHTML = renderAdminProductList();
        }

        async function updateOrderStatus(orderId, newStatus) {
            try {
                await updateDoc(doc(db, pathOrders, orderId), { status: newStatus });
                showToast(`Pedido atualizado para ${newStatus}`);
            } catch (e) {
                showToast('Erro ao atualizar', 'error');
            }
        }


        // --- UI Rendering Functions ---

        window.renderLanding = function(container) {
            container.innerHTML = `
                <div class="min-h-screen flex flex-col bg-white fade-in">
                    <!-- Header -->
                    <header class="flex justify-between items-center p-6 lg:px-12 border-b">
                        <div class="font-bold text-2xl tracking-tighter">
                            <span class="text-brand-500">WA</span> Vendas
                        </div>
                        <nav>
                            <button onclick="window.location.hash='#/login'" class="font-medium text-gray-600 hover:text-brand-500 mr-6">Login</button>
                            <button onclick="window.location.hash='#/login?register=true'" class="bg-brand-dark text-white px-5 py-2.5 rounded-lg font-medium hover:bg-gray-800 transition">Começar Grátis</button>
                        </nav>
                    </header>

                    <!-- Hero -->
                    <main class="flex-grow flex flex-col items-center justify-center text-center px-4 py-20">
                        <div class="inline-block bg-red-50 text-brand-600 px-4 py-1.5 rounded-full text-sm font-semibold mb-6">
                            SaaS para Delivery e Restaurantes
                        </div>
                        <h1 class="text-5xl lg:text-7xl font-extrabold tracking-tight text-brand-dark max-w-4xl leading-tight mb-6">
                            Seu cardápio digital<br>e sistema de vendas.
                        </h1>
                        <p class="text-xl text-gray-500 mb-10 max-w-2xl">
                            Receba pedidos online, gerencie seu restaurante, receba via PIX e fidelize clientes. Tudo em uma única plataforma profissional.
                        </p>
                        <div class="flex flex-col sm:flex-row gap-4">
                            <button onclick="window.location.hash='#/login?register=true'" class="bg-brand-500 text-white px-8 py-4 rounded-xl font-bold text-lg hover:bg-brand-600 transition shadow-lg shadow-brand-500/30">
                                Criar meu Cardápio
                            </button>
                            <a href="#/cardapio/demo" class="bg-gray-100 text-brand-dark px-8 py-4 rounded-xl font-bold text-lg hover:bg-gray-200 transition">
                                Ver Demonstração
                            </a>
                        </div>
                        
                        <div class="mt-16 w-full max-w-5xl rounded-2xl overflow-hidden shadow-2xl border border-gray-100">
                            <img src="https://placehold.co/1200x600/0f172a/ffffff?text=Dashboard+Preview" alt="Dashboard" class="w-full h-auto">
                        </div>
                    </main>
                </div>
            `;
        }

        window.renderAuth = function(container) {
            const urlParams = new URLSearchParams(window.location.hash.split('?')[1]);
            const isRegister = urlParams.get('register') === 'true';

            container.innerHTML = `
                <div class="min-h-screen flex items-center justify-center bg-gray-50 p-4 fade-in">
                    <div class="bg-white p-8 sm:p-12 rounded-2xl shadow-xl w-full max-w-md border border-gray-100">
                        <div class="text-center mb-8">
                            <div class="font-bold text-3xl tracking-tighter mb-2">
                                <span class="text-brand-500">WA</span> Vendas
                            </div>
                            <h2 class="text-2xl font-bold text-gray-800">${isRegister ? 'Crie sua conta' : 'Acesse seu painel'}</h2>
                            <p class="text-gray-500 text-sm mt-1">${isRegister ? 'Inicie seu teste gratuito de 14 dias.' : 'Gerencie suas vendas.'}</p>
                        </div>

                        <form id="auth-form" class="space-y-5" onsubmit="handleAuthSubmit(event, ${isRegister})">
                            ${isRegister ? `
                                <div>
                                    <label class="block text-sm font-medium text-gray-700 mb-1">Nome do Estabelecimento</label>
                                    <input type="text" id="restaurant-name" required class="w-full px-4 py-3 rounded-xl border border-gray-300 focus:ring-2 focus:ring-brand-500 focus:border-brand-500 outline-none transition">
                                </div>
                                <div>
                                    <label class="block text-sm font-medium text-gray-700 mb-1">Link Desejado (ex: sua-loja)</label>
                                    <div class="flex">
                                        <span class="inline-flex items-center px-3 rounded-l-xl border border-r-0 border-gray-300 bg-gray-50 text-gray-500 sm:text-sm">wa.com/</span>
                                        <input type="text" id="restaurant-slug" required class="flex-1 min-w-0 block w-full px-4 py-3 rounded-none rounded-r-xl border border-gray-300 focus:ring-2 focus:ring-brand-500 focus:border-brand-500 outline-none transition" onkeyup="this.value = this.value.toLowerCase().replace(/[^a-z0-9-]/g, '')">
                                    </div>
                                </div>
                            ` : ''}
                            
                            <div>
                                <label class="block text-sm font-medium text-gray-700 mb-1">E-mail</label>
                                <input type="email" id="email" required class="w-full px-4 py-3 rounded-xl border border-gray-300 focus:ring-2 focus:ring-brand-500 focus:border-brand-500 outline-none transition">
                            </div>
                            
                            <div>
                                <label class="block text-sm font-medium text-gray-700 mb-1">Senha</label>
                                <input type="password" id="password" required class="w-full px-4 py-3 rounded-xl border border-gray-300 focus:ring-2 focus:ring-brand-500 focus:border-brand-500 outline-none transition">
                            </div>

                            <button type="submit" id="auth-btn" class="w-full bg-brand-dark text-white font-semibold py-3.5 rounded-xl hover:bg-gray-800 transition flex justify-center items-center">
                                ${isRegister ? 'Criar Conta e Começar' : 'Entrar no Sistema'}
                            </button>
                        </form>

                        <div class="mt-6 text-center text-sm text-gray-600">
                            ${isRegister ? 
                                `Já tem uma conta? <a href="#/login" class="text-brand-500 font-semibold hover:underline">Fazer Login</a>` : 
                                `Não tem uma conta? <a href="#/login?register=true" class="text-brand-500 font-semibold hover:underline">Criar agora</a>`
                            }
                        </div>
                    </div>
                </div>
            `;
        }

        window.handleAuthSubmit = async function(event, isRegister) {
            event.preventDefault();
            const btn = document.getElementById('auth-btn');
            btn.innerHTML = '<div class="loader w-5 h-5 border-2"></div>';
            btn.disabled = true;

            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            try {
                if (isRegister) {
                    const name = document.getElementById('restaurant-name').value;
                    const slug = document.getElementById('restaurant-slug').value;
                    
                    // Basic slug validation
                    if(slug.length < 3) throw new Error("Link deve ter pelo menos 3 caracteres.");

                    const userCreds = await createUserWithEmailAndPassword(auth, email, password);
                    await updateProfile(userCreds.user, { displayName: name });
                    
                    // Create Tenant data in Firestore
                    await createTenant(userCreds.user.uid, name, slug);
                    
                    showToast('Conta criada com sucesso!');
                } else {
                    await signInWithEmailAndPassword(auth, email, password);
                    showToast('Login realizado com sucesso!');
                }
                // Router will handle redirection based on state
            } catch (error) {
                console.error(error);
                let msg = "Ocorreu um erro.";
                if(error.code === 'auth/email-already-in-use') msg = "E-mail já cadastrado.";
                if(error.code === 'auth/invalid-credential') msg = "Credenciais inválidas.";
                showToast(msg, 'error');
                btn.innerHTML = isRegister ? 'Criar Conta e Começar' : 'Entrar no Sistema';
                btn.disabled = false;
            }
        }

        window.doLogout = async function() {
            await signOut(auth);
            state.currentUser = null;
            state.currentTenant = null;
            if (unsubOrders) { unsubOrders(); unsubOrders = null; }
            window.location.hash = '#/';
        }


        window.renderAdmin = function(container, hash) {
            // Initiate data loading
            loadAdminData();
            listenToAdminOrders();

            const subRoute = hash.split('/')[2] || 'dashboard';

            container.innerHTML = `
                <div class="flex h-screen bg-gray-50 fade-in">
                    <!-- Sidebar -->
                    <aside class="w-64 bg-brand-dark text-white flex flex-col hidden md:flex">
                        <div class="p-6">
                            <div class="font-bold text-2xl tracking-tighter mb-1">
                                <span class="text-brand-500">WA</span> Vendas
                            </div>
                            <div class="text-xs text-gray-400 truncate">${state.currentTenant?.name || 'Administrador'}</div>
                        </div>
                        <nav class="flex-grow px-4 space-y-1">
                            ${renderAdminMenuLinks(subRoute)}
                        </nav>
                        <div class="p-4 border-t border-gray-800">
                            <a href="#/cardapio/${state.currentTenant?.slug}" target="_blank" class="w-full flex items-center justify-center gap-2 bg-gray-800 hover:bg-gray-700 text-white px-4 py-2 rounded-lg text-sm transition mb-2">
                                <i class="fas fa-external-link-alt"></i> Ver Cardápio
                            </a>
                            <button onclick="doLogout()" class="w-full flex items-center gap-3 px-4 py-2 text-gray-400 hover:text-white rounded-lg transition text-sm">
                                <i class="fas fa-sign-out-alt w-5"></i> Sair
                            </button>
                        </div>
                    </aside>

                    <!-- Mobile Header -->
                    <div class="md:hidden fixed top-0 left-0 right-0 h-16 bg-brand-dark text-white flex items-center justify-between px-4 z-50">
                        <div class="font-bold text-xl"><span class="text-brand-500">WA</span> Vendas</div>
                        <button onclick="document.getElementById('mobile-menu').classList.toggle('hidden')">
                            <i class="fas fa-bars text-xl"></i>
                        </button>
                    </div>

                    <!-- Mobile Menu Overlay -->
                    <div id="mobile-menu" class="hidden fixed inset-0 bg-brand-dark z-40 pt-16 flex flex-col">
                         <nav class="flex-grow px-4 py-6 space-y-2">
                            ${renderAdminMenuLinks(subRoute, true)}
                        </nav>
                        <div class="p-6 border-t border-gray-800">

        window.updateDashboardStats = function() {
            const today = new Date().toISOString().split('T')[0];
            let vendasHoje = 0;
            let pedidosHoje = 0;
            let pendentes = 0;

            state.adminOrders.forEach(o => {
                if(o.createdAt.startsWith(today)) {
                    if(o.status !== 'cancelado') {
                        vendasHoje += o.total;
                        pedidosHoje++;
                    }
                }
                if(o.status === 'novo' || o.status === 'preparando') pendentes++;
            });

            const ticket = pedidosHoje > 0 ? (vendasHoje / pedidosHoje) : 0;

            const format = (v) => v.toLocaleString('pt-BR', {style: 'currency', currency: 'BRL'});

            const elVendas = document.getElementById('stat-vendas');
            if(elVendas) elVendas.innerText = format(vendasHoje);
            
            const elPedidos = document.getElementById('stat-pedidos');
            if(elPedidos) elPedidos.innerText = pedidosHoje;
            
            const elTicket = document.getElementById('stat-ticket');
            if(elTicket) elTicket.innerText = format(ticket);
            
            const elPendentes = document.getElementById('stat-pendentes');
            if(elPendentes) elPendentes.innerText = pendentes;
        }

        window.copyMenuLink = function() {
            const link = `${window.location.origin}${window.location.pathname}#/cardapio/${state.currentTenant.slug}`;
            navigator.clipboard.writeText(link).then(() => showToast('Link copiado!'));
        }

        window.toggleStoreStatus = async function() {
            if(!state.currentTenant) return;
            const newState = !state.currentTenant.settings.isOpen;
            try {
                const docRef = doc(db, pathTenants, state.currentUser.uid);
                await updateDoc(docRef, { 'settings.isOpen': newState });
                state.currentTenant.settings.isOpen = newState;
                document.getElementById('btn-toggle-store').innerText = newState ? 'Fechar Loja' : 'Abrir Loja';
                showToast(newState ? 'Loja Aberta!' : 'Loja Fechada!', newState ? 'success' : 'error');
            } catch(e) {
                console.error(e);
            }
        }

        window.submitProductForm = async function() {
            const id = document.getElementById('prod-id').value;
            const data = {
                id: id || null,
                name: document.getElementById('prod-name').value,
                price: parseFloat(document.getElementById('prod-price').value),
                categoryId: document.getElementById('prod-category').value,
                desc: document.getElementById('prod-desc').value,
                image: document.getElementById('prod-image').value,
                active: document.getElementById('prod-active').checked
            };

            if(!data.name || isNaN(data.price)) return showToast('Preencha os campos obrigatórios.', 'error');
            
            closeModal();
            await saveProduct(data);
        }

        window.saveAdminConfig = async function() {
            const name = document.getElementById('cfg-name').value;
            const minOrder = parseFloat(document.getElementById('cfg-min').value) || 0;
            const deliveryFee = parseFloat(document.getElementById('cfg-fee').value) || 0;

            try {
                await updateDoc(doc(db, pathTenants, state.currentUser.uid), {
                    name: name,
                    'settings.minOrder': minOrder,
                    'settings.deliveryFee': deliveryFee
                });
                
                state.currentTenant.name = name;
                state.currentTenant.settings.minOrder = minOrder;
                state.currentTenant.settings.deliveryFee = deliveryFee;
                
                showToast('Configurações salvas!');
                renderAdmin(document.getElementById('app'), window.location.hash); // re-render to update sidebar name
            } catch(e) {
                showToast('Erro ao salvar', 'error');
            }
        }

                            <div class="absolute bottom-4 left-4 right-4 flex items-end justify-between text-white">
                                <div>
                                    <h1 class="text-2xl sm:text-3xl font-bold mb-1 shadow-black drop-shadow-md">${tenant.name}</h1>
                                    <div class="flex items-center gap-2 text-sm font-medium">
                                        ${isOpen ? 
                                            `<span class="bg-green-500/20 text-green-400 px-2 py-0.5 rounded backdrop-blur-sm border border-green-500/30"><i class="fas fa-door-open mr-1"></i> Aberto</span>` : 
                                            `<span class="bg-red-500/20 text-red-400 px-2 py-0.5 rounded backdrop-blur-sm border border-red-500/30"><i class="fas fa-door-closed mr-1"></i> Fechado</span>`
                                        }
                                        <span class="text-gray-300">· Pedido Mín: R$ ${tenant.settings?.minOrder.toFixed(2).replace('.', ',')}</span>
                                    </div>
                                </div>
                            </div>
                        </div>
                        
                        <!-- Category Nav -->
                        <div class="overflow-x-auto hide-scroll border-t bg-white">
                            <div class="flex px-4 py-3 gap-2 w-max">
                                ${tenant.categories.map(c => `
                                    <a href="#cat-${c.id}" class="px-4 py-1.5 rounded-full bg-gray-100 text-gray-700 text-sm font-medium hover:bg-brand-50 hover:text-brand-600 transition whitespace-nowrap">
                                        ${c.name}
                                    </a>
                                `).join('')}
                            </div>
                        </div>
                    </header>

                    <!-- Main Content (Products) -->
                    <main class="max-w-4xl mx-auto px-4 py-6 space-y-10">
                        ${renderPublicCategoriesAndProducts()}
                    </main>

                    <!-- Sticky Bottom Cart Bar (Mobile First) -->
                    ${isOpen ? `
                    <div id="cart-bar" class="fixed bottom-0 left-0 right-0 bg-white border-t p-4 shadow-[0_-10px_20px_-10px_rgba(0,0,0,0.1)] z-40 transform transition-transform translate-y-full flex justify-center">
                        <div class="w-full max-w-4xl flex justify-between items-center">
                            <div class="flex flex-col">
                                <span class="text-xs text-gray-500 font-medium" id="cart-count-text">0 itens</span>
                                <span class="font-bold text-lg text-gray-800" id="cart-total-text">R$ 0,00</span>
                            </div>
                            <button onclick="openCartDrawer()" class="bg-brand-500 text-white px-6 py-3 rounded-xl font-bold shadow-lg shadow-brand-500/30 hover:bg-brand-600 transition flex items-center gap-2">
                                <i class="fas fa-shopping-cart"></i> Ver Carrinho
                            </button>
                        </div>
                    </div>
                    ` : `
                    <div class="fixed bottom-0 left-0 right-0 bg-gray-900 text-white text-center p-4 z-40 font-medium">
                        Estamos fechados no momento.
                    </div>
                    `}
                </div>
            `;
            
            // Initial cart UI update
            updateCartUI();
        }

        function renderPublicCategoriesAndProducts() {
            const categories = state.publicTenant.categories.sort((a,b) => a.order - b.order);
            const products = state.publicProducts;
            
            if (products.length === 0) {
                return `<div class="text-center py-20 text-gray-500">Nenhum produto disponível no momento.</div>`;
            }

            return categories.map(cat => {
                const catProducts = products.filter(p => p.categoryId === cat.id);
                if (catProducts.length === 0) return '';

                return `
                    <section id="cat-${cat.id}" class="scroll-mt-32">
                        <h2 class="text-xl font-bold text-gray-800 mb-4 flex items-center gap-2">
                            ${cat.name}
                            <div class="h-px bg-gray-200 flex-grow ml-4"></div>
                        </h2>
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                            ${catProducts.map(p => `
                                <div class="bg-white rounded-2xl p-3 border border-gray-100 shadow-sm flex gap-4 cursor-pointer hover:border-brand-300 hover:shadow-md transition group" onclick='openProductDetails(${JSON.stringify(p).replace(/'/g, "&apos;")})'>
                                    <div class="flex-grow flex flex-col justify-between">
                                        <div>
                                            <h3 class="font-semibold text-gray-800 group-hover:text-brand-600 transition leading-tight mb-1">${p.name}</h3>
                                            <p class="text-xs text-gray-500 line-clamp-2">${p.desc}</p>
                                        </div>
                                        <div class="mt-3 font-bold text-gray-900">
                                            R$ ${p.price.toFixed(2).replace('.', ',')}
                                        </div>
                                    </div>
                                    <div class="w-28 h-28 shrink-0 rounded-xl overflow-hidden bg-gray-50 relative">
                                        <img src="${p.image || 'https://placehold.co/200x200/f1f5f9/cbd5e1'}" class="w-full h-full object-cover">
                                        <div class="absolute bottom-1 right-1 w-8 h-8 bg-white rounded-full flex items-center justify-center shadow text-brand-500">
                                            <i class="fas fa-plus"></i>
                                        </div>
                                    </div>
                                </div>
                            `).join('')}
                        </div>
                    </section>
                `;
            }).join('');
        }

        window.openProductDetails = function(product) {
            if(!state.publicTenant.settings.isOpen) {
                return showToast('Loja fechada no momento.', 'error');
            }

            const html = `
                <div class="fixed inset-0 z-50 flex items-end sm:items-center justify-center overlay fade-in">
                    <div class="bg-white w-full sm:max-w-md h-[90vh] sm:h-auto sm:max-h-[90vh] rounded-t-3xl sm:rounded-3xl shadow-2xl flex flex-col slide-in-bottom sm:slide-in-none overflow-hidden">
                        
                        <div class="relative h-48 sm:h-64 shrink-0 bg-gray-100">
                            <img src="${product.image || 'https://placehold.co/400x300/f1f5f9/cbd5e1'}" class="w-full h-full object-cover">
                            <button onclick="closeModal()" class="absolute top-4 right-4 w-10 h-10 bg-white/80 backdrop-blur-md rounded-full flex items-center justify-center text-gray-800 hover:bg-white shadow">
                                <i class="fas fa-times text-lg"></i>
                            </button>
                        </div>
                        
                        <div class="p-6 overflow-y-auto hide-scroll flex-grow">
                            <h2 class="text-2xl font-bold text-gray-800 mb-2">${product.name}</h2>
                            <p class="text-gray-600 text-sm mb-4 leading-relaxed">${product.desc}</p>
                            <div class="text-xl font-bold text-brand-600 mb-6">R$ ${product.price.toFixed(2).replace('.', ',')}</div>
                            
                            <div>
                                <label class="block text-sm font-medium text-gray-800 mb-2">Alguma observação?</label>
                                <textarea id="item-obs" rows="2" class="w-full bg-gray-50 border border-gray-200 rounded-xl px-4 py-3 outline-none focus:border-brand-500 focus:bg-white transition text-sm resize-none" placeholder="Ex: Tirar cebola, maionese à parte..."></textarea>
                            </div>
                        </div>
                        
                        <div class="p-5 border-t bg-white shrink-0 flex items-center gap-4">
                            <div class="flex items-center bg-gray-100 rounded-xl border border-gray-200 p-1">
                                <button onclick="changeQtd(-1)" class="w-10 h-10 flex items-center justify-center text-gray-600 hover:bg-white rounded-lg transition"><i class="fas fa-minus"></i></button>
                                <span id="item-qtd" class="w-8 text-center font-bold">1</span>
                                <button onclick="changeQtd(1)" class="w-10 h-10 flex items-center justify-center text-gray-600 hover:bg-white rounded-lg transition"><i class="fas fa-plus"></i></button>
                            </div>
                            <button onclick='addToCart(${JSON.stringify(product).replace(/'/g, "&apos;")})' class="flex-grow bg-brand-500 text-white h-12 rounded-xl font-bold shadow-lg shadow-brand-500/30 hover:bg-brand-600 transition flex items-center justify-between px-6">
                                <span>Adicionar</span>
                                <span id="item-total-btn">R$ ${product.price.toFixed(2).replace('.', ',')}</span>
                            </button>
                        </div>
                    </div>
                </div>
            `;
            openModal(html);
            
            // Temporary state for the modal
            window.currentModalProduct = product;
            window.currentModalQtd = 1;
        }

        window.changeQtd = function(delta) {
            const newQtd = window.currentModalQtd + delta;
            if (newQtd >= 1 && newQtd <= 20) {
                window.currentModalQtd = newQtd;
                document.getElementById('item-qtd').innerText = newQtd;
                const total = window.currentModalProduct.price * newQtd;
                document.getElementById('item-total-btn').innerText = `R$ ${total.toFixed(2).replace('.', ',')}`;
            }
        }

        window.addToCart = function(product) {
            const obs = document.getElementById('item-obs').value;
            const item = {
                cartId: generateId(), // Unique ID for cart item
                productId: product.id,
                name: product.name,
                price: product.price,
                qtd: window.currentModalQtd,
                obs: obs
            };
            
            state.cart.push(item);
            updateCartTotal();
            closeModal();
            showToast('Adicionado ao carrinho!');
        }

        function updateCartTotal() {
            state.cartTotal = state.cart.reduce((sum, item) => sum + (item.price * item.qtd), 0);
            updateCartUI();
        }

        function updateCartUI() {
            const cartBar = document.getElementById('cart-bar');
            if (!cartBar) return;

            if (state.cart.length > 0) {
                cartBar.classList.remove('translate-y-full');
                document.getElementById('cart-count-text').innerText = `${state.cart.length} item${state.cart.length > 1 ? 's' : ''}`;
                document.getElementById('cart-total-text').innerText = `R$ ${state.cartTotal.toFixed(2).replace('.', ',')}`;
            } else {
                cartBar.classList.add('translate-y-full');
            }
        }

        window.openCartDrawer = function() {
            const deliveryFee = state.publicTenant.settings.deliveryFee || 0;
            const finalTotal = state.cartTotal + deliveryFee;

            const html = `
                <div class="fixed inset-0 z-50 flex justify-end overlay fade-in">
                    <div class="bg-white w-full sm:max-w-md h-full shadow-2xl flex flex-col slide-in-right">
                        
                        <div class="p-5 border-b flex justify-between items-center bg-white shrink-0">
                            <h2 class="text-xl font-bold text-gray-800 flex items-center gap-2"><i class="fas fa-shopping-cart text-brand-500"></i> Seu Pedido</h2>
                            <button onclick="closeModal()" class="w-8 h-8 flex items-center justify-center rounded-full bg-gray-100 text-gray-600 hover:bg-gray-200 transition">
                                <i class="fas fa-times"></i>
                            </button>
                        </div>
                        
                        <div class="flex-grow overflow-y-auto hide-scroll p-5 bg-gray-50">
                            <!-- Items List -->
                            <div class="space-y-3 mb-6">
                                ${state.cart.map(item => `
                                    <div class="bg-white p-3 rounded-xl border border-gray-200 flex justify-between items-start">
                                        <div>
                                            <div class="font-medium text-gray-800 text-sm"><span class="text-brand-500 font-bold mr-1">${item.qtd}x</span> ${item.name}</div>
                                            ${item.obs ? `<div class="text-xs text-gray-500 mt-1 italic">"${item.obs}"</div>` : ''}
                                            <button onclick="removeFromCart('${item.cartId}')" class="text-xs text-red-500 mt-2 font-medium hover:underline">Remover</button>
                                        </div>
                                        <div class="font-bold text-gray-800 text-sm">R$ ${(item.price * item.qtd).toFixed(2).replace('.', ',')}</div>
                                    </div>
                                `).join('')}
                            </div>

                            <!-- Checkout Form -->
                            <div class="bg-white p-5 rounded-2xl border border-gray-200 shadow-sm space-y-4">
                                <h3 class="font-bold text-gray-800 border-b pb-2">Seus Dados</h3>
                                <div>
                                    <input type="text" id="chk-name" placeholder="Nome Completo" required class="w-full px-4 py-2.5 bg-gray-50 border border-gray-200 rounded-xl text-sm outline-none focus:border-brand-500 transition">
                                </div>
                                <div>
                                    <input type="tel" id="chk-phone" placeholder="WhatsApp (DDD + Número)" required class="w-full px-4 py-2.5 bg-gray-50 border border-gray-200 rounded-xl text-sm outline-none focus:border-brand-500 transition">
                                </div>

                                <h3 class="font-bold text-gray-800 border-b pb-2 mt-6">Entrega</h3>
                                <div class="flex bg-gray-100 p-1 rounded-xl">
                                    <button id="btn-type-delivery" onclick="setOrderType('delivery')" class="flex-1 py-2 text-sm font-bold rounded-lg bg-white shadow text-gray-800 transition">Entrega</button>
                                    <button id="btn-type-pickup" onclick="setOrderType('pickup')" class="flex-1 py-2 text-sm font-bold rounded-lg text-gray-500 hover:text-gray-800 transition">Retirada</button>
                                </div>

                                <div id="address-fields" class="space-y-3 mt-3">
                                    <div class="grid grid-cols-3 gap-2">
                                        <input type="text" id="chk-street" placeholder="Rua" class="col-span-2 px-4 py-2.5 bg-gray-50 border border-gray-200 rounded-xl text-sm outline-none focus:border-brand-500 transition">
                                        <input type="text" id="chk-num" placeholder="Nº" class="px-4 py-2.5 bg-gray-50 border border-gray-200 rounded-xl text-sm outline-none focus:border-brand-500 transition">
                                    </div>
                                    <input type="text" id="chk-comp" placeholder="Complemento / Bairro" class="w-full px-4 py-2.5 bg-gray-50 border border-gray-200 rounded-xl text-sm outline-none focus:border-brand-500 transition">
                                </div>
                                
                                <h3 class="font-bold text-gray-800 border-b pb-2 mt-6">Pagamento</h3>
                                <select id="chk-payment" class="w-full px-4 py-2.5 bg-gray-50 border border-gray-200 rounded-xl text-sm outline-none focus:border-brand-500 transition appearance-none">
                                    <option value="pix">PIX (Chave na entrega)</option>
                                    <option value="cartao">Cartão na Entrega</option>
                                    <option value="dinheiro">Dinheiro</option>
                                </select>
                            </div>
                        </div>
                        
                        <div class="p-5 border-t bg-white shrink-0">
                            <div class="flex justify-between text-sm text-gray-600 mb-1">
                                <span>Subtotal</span>
                                <span>R$ ${state.cartTotal.toFixed(2).replace('.', ',')}</span>
                            </div>
                            <div class="flex justify-between text-sm text-gray-600 mb-3" id="fee-display">
                                <span>Taxa de Entrega</span>
                                <span>R$ ${deliveryFee.toFixed(2).replace('.', ',')}</span>
                            </div>
                            <div class="flex justify-between text-lg font-bold text-gray-900 mb-4 border-t pt-2">
                                <span>Total</span>
                                <span id="total-display">R$ ${finalTotal.toFixed(2).replace('.', ',')}</span>
                            </div>
                            
                            <button onclick="submitOrder()" id="btn-submit-order" class="w-full bg-brand-500 text-white h-14 rounded-xl font-bold shadow-lg shadow-brand-500/30 hover:bg-brand-600 transition flex items-center justify-center">
                                Finalizar Pedido
                            </button>
                        </div>
                    </div>
                </div>
            `;
            openModal(html);
            window.currentOrderType = 'delivery'; // Default
        }

        window.removeFromCart = function(cartId) {
            state.cart = state.cart.filter(i => i.cartId !== cartId);
            updateCartTotal();
            if(state.cart.length === 0) {
                closeModal();
            } else {
                openCartDrawer(); // Refresh drawer
            }
        }

        window.setOrderType = function(type) {
            window.currentOrderType = type;
            const btnDel = document.getElementById('btn-type-delivery');
            const btnPick = document.getElementById('btn-type-pickup');
            const addrDiv = document.getElementById('address-fields');
            const feeDisplay = document.getElementById('fee-display');
            const totalDisplay = document.getElementById('total-display');
            
            const deliveryFee = state.publicTenant.settings.deliveryFee || 0;

            if(type === 'delivery') {
                btnDel.className = "flex-1 py-2 text-sm font-bold rounded-lg bg-white shadow text-gray-800 transition";
                btnPick.className = "flex-1 py-2 text-sm font-bold rounded-lg text-gray-500 hover:text-gray-800 transition";
                addrDiv.style.display = 'block';
                feeDisplay.style.display = 'flex';
                totalDisplay.innerText = `R$ ${(state.cartTotal + deliveryFee).toFixed(2).replace('.', ',')}`;
            } else {
                btnPick.className = "flex-1 py-2 text-sm font-bold rounded-lg bg-white shadow text-gray-800 transition";
                btnDel.className = "flex-1 py-2 text-sm font-bold rounded-lg text-gray-500 hover:text-gray-800 transition";
                addrDiv.style.display = 'none';
                feeDisplay.style.display = 'none';
                totalDisplay.innerText = `R$ ${state.cartTotal.toFixed(2).replace('.', ',')}`;
            }
        }

        window.submitOrder = async function() {
            const btn = document.getElementById('btn-submit-order');
            const name = document.getElementById('chk-name').value;
            const phone = document.getElementById('chk-phone').value;
            const type = window.currentOrderType;
            const payment = document.getElementById('chk-payment').value;
            
            if(!name || !phone) return showToast('Preencha nome e WhatsApp', 'error');

            const address = {};
            if(type === 'delivery') {
                address.street = document.getElementById('chk-street').value;
                address.number = document.getElementById('chk-num').value;
                address.comp = document.getElementById('chk-comp').value;
                if(!address.street || !address.number) return showToast('Preencha rua e número para entrega', 'error');
            }

            const deliveryFee = type === 'delivery' ? (state.publicTenant.settings.deliveryFee || 0) : 0;
            const total = state.cartTotal + deliveryFee;

            if (state.cartTotal < (state.publicTenant.settings.minOrder || 0)) {
                return showToast(`Pedido mínimo de R$ ${state.publicTenant.settings.minOrder.toFixed(2).replace('.', ',')}`, 'error');
            }

            btn.innerHTML = '<div class="loader w-5 h-5 border-2"></div>';
            btn.disabled = true;

            const orderData = {
                customerName: name,
                customerPhone: phone,
                items: state.cart,
                type: type,
                address: address,
                paymentMethod: payment,
                subtotal: state.cartTotal,
                deliveryFee: deliveryFee,
                total: total
            };

            const orderId = await placeOrder(orderData);

            if(orderId) {
                renderOrderSuccess(orderId);
            } else {
                showToast('Erro ao criar pedido.', 'error');
                btn.innerHTML = 'Finalizar Pedido';
                btn.disabled = false;
            }
        }

        function renderOrderSuccess(orderId) {
            const html = `
                <div class="fixed inset-0 z-[60] flex items-center justify-center bg-brand-500 text-white fade-in p-4 text-center">
                    <div class="max-w-md w-full slide-in-bottom">
                        <div class="w-24 h-24 bg-white text-brand-500 rounded-full flex items-center justify-center text-5xl mx-auto mb-6 shadow-2xl">
                            <i class="fas fa-check"></i>
                        </div>
                        <h2 class="text-4xl font-extrabold tracking-tight mb-2">Pedido Recebido!</h2>
                        <p class="text-brand-100 text-lg mb-8">O restaurante já recebeu seu pedido e iniciará o preparo em breve.</p>
                        
                        <div class="bg-black/10 rounded-2xl p-6 backdrop-blur-sm border border-white/20 mb-8">
                            <div class="text-sm font-medium text-brand-100 uppercase tracking-wider mb-1">Número do Pedido</div>
                            <div class="text-3xl font-bold font-mono">#${orderId.split('-')[1]}</div>
                        </div>
                        
                        <button onclick="closeModal()" class="w-full bg-white text-brand-600 font-bold py-4 rounded-xl shadow-lg hover:bg-gray-50 transition">
                            Voltar ao Cardápio
                        </button>
                    </div>
                </div>
            `;
            openModal(html);
        }

        // --- Application Bootstrap ---
        
        document.addEventListener('DOMContentLoaded', () => {
            setupRouter();
            initializeAppAuth(); // Triggers first render based on auth state
        });

    </script>
</body>
</html>
