        window.updateCartItem = function(index, delta) {
            state.cart[index].quantity += delta;
            if(state.cart[index].quantity <= 0) state.cart.splice(index, 1);
            if(state.cart.length === 0) { closeModal(); document.getElementById('cart-badge').classList.add('hidden'); return; }
            openCart(); // refresh modal
            document.getElementById('cart-badge').innerText = state.cart.reduce((s, i) => s + i.quantity, 0);
        }

        window.processCheckout = async function() {
            const name = document.getElementById('c-name').value.trim();
            const phone = document.getElementById('c-phone').value.trim();
            const address = document.getElementById('c-address').value.trim();
            const obs = document.getElementById('checkout-obs').value.trim();
            
            if(!name || !phone || !address) return showToast('Preencha seus dados de entrega', 'error');
            
            const btn = document.getElementById('btn-checkout');
            btn.disabled = true; btn.innerHTML = '<div class="loader w-5 h-5 border-2 border-white border-t-transparent mx-auto"></div>';
            
            const total = state.cart.reduce((s, i) => s + (i.price * i.quantity), 0);
            
            const orderData = {
                tenantId: state.publicTenant.id,
                items: state.cart,
                total: total,
                customer: { name, phone, address },
                observations: obs,
                status: 'novo',
                createdAt: Date.now()
            };
            
            try {
                const docRef = await addDoc(collection(db, collections.orders), orderData);
                state.cart = []; // clear cart
                closeModal();
                
                // Redirect directly to Order Status Page without F5
                window.location.hash = `#/status-pedido?id=${docRef.id}`;
                
            } catch (err) {
                showToast('Erro ao processar pedido.', 'error');
                btn.disabled = false; btn.innerHTML = 'Confirmar Pedido <i class="fas fa-arrow-right"></i>';
            }
        }

        window.renderOrderStatus = function(container) {
            const urlParams = new URLSearchParams(window.location.hash.split('?')[1]);
            const orderId = urlParams.get('id');
            
            if (!orderId) { window.location.hash = '#/'; return; }

            container.innerHTML = `<div class="flex justify-center h-screen items-center"><div class="loader w-12 h-12 border-4 border-gray-200 border-t-brand-500"></div></div>`;

            if (state.unsubOrderListener) state.unsubOrderListener();

            state.unsubOrderListener = onSnapshot(doc(db, collections.orders, orderId), async (docSnap) => {
                if (!docSnap.exists()) {
                    container.innerHTML = `
                        <div class="min-h-screen flex flex-col items-center justify-center p-4 text-center bg-gray-50">
                            <div class="w-20 h-20 bg-gray-200 text-gray-400 rounded-full flex items-center justify-center text-3xl mb-4"><i class="fas fa-search"></i></div>
                            <h2 class="text-2xl font-black text-gray-800">Pedido não encontrado.</h2>
                            <a href="#/" class="mt-4 bg-brand-500 text-white font-bold px-6 py-2 rounded-xl">Voltar ao Início</a>
                        </div>`;
                    return;
                }

                const order = { id: docSnap.id, ...docSnap.data() };
                
                // Fetch tenant info for WhatsApp
                let tenantPhone = '';
                let tenantName = 'Restaurante';
                try {
                    const tenantSnap = await getDoc(doc(db, collections.tenants, order.tenantId));
                    if(tenantSnap.exists()) {
                        tenantPhone = tenantSnap.data().phone;
                        tenantName = tenantSnap.data().name;
                    }
                }catch(e){}

                let statusText = 'Enviado ao Restaurante';
                let statusColor = 'text-blue-500';
                let bgColor = 'bg-blue-50';
                let icon = 'fa-paper-plane';
                let isCancelled = false;
                
                switch(order.status) {
                    case 'novo':
                        statusText = 'Enviado ao Restaurante';
                        statusColor = 'text-blue-500'; bgColor = 'bg-blue-50'; icon = 'fa-paper-plane';
                        break;
                    case 'preparando':
                        statusText = 'Pedido Aceito / Preparando';
                        statusColor = 'text-yellow-500'; bgColor = 'bg-yellow-50'; icon = 'fa-fire-burner';
                        break;
                    case 'entrega':
                        statusText = 'Saiu para Entrega';
                        statusColor = 'text-purple-500'; bgColor = 'bg-purple-50'; icon = 'fa-motorcycle';
                        break;
                    case 'entregue':
                        statusText = 'Pedido Entregue';
                        statusColor = 'text-green-500'; bgColor = 'bg-green-50'; icon = 'fa-check-circle';
                        break;
                    case 'recusado':
                    case 'cancelado':
                        statusText = order.status === 'recusado' ? 'Pedido Recusado (Indisponível)' : 'Pedido Cancelado';
                        statusColor = 'text-red-500'; bgColor = 'bg-red-50'; icon = 'fa-times-circle';
                        isCancelled = true;
                        break;
                }

                const itemsText = order.items.map(i => `${i.quantity}x ${i.name}`).join('%0A');
                const wppMsg = `Olá *${tenantName}*!%0AFiz o pedido *#${order.id.substring(0,6)}* pelo cardápio digital.%0A%0A*Itens:*%0A${itemsText}%0A%0A*Total:* ${order.total.toLocaleString('pt-BR', {style: 'currency', currency: 'BRL'})}%0A*Endereço:* ${order.customer.address}%0A%0AGostaria de mais detalhes sobre o status.`;
                const wppLink = tenantPhone ? `https://wa.me/55${tenantPhone.replace(/\D/g, '')}?text=${wppMsg}` : '#';

                container.innerHTML = `
                    <div class="min-h-screen bg-gray-50 flex flex-col items-center p-4 fade-in pb-safe">
                        <div class="bg-white rounded-3xl shadow-xl w-full max-w-md overflow-hidden mt-6 md:mt-10 border border-gray-100 flex flex-col">
                            <div class="p-6 text-center border-b border-gray-100 bg-gray-50/50">
                                <h2 class="text-xl font-black text-gray-800">Acompanhe seu Pedido</h2>
                                <p class="text-xs text-gray-500 font-mono mt-1 uppercase tracking-wider">ID: #${order.id.substring(0,8)}</p>
                            </div>
                            
                            <div class="p-6 md:p-8 flex flex-col items-center text-center">
                                <div class="w-24 h-24 rounded-full ${bgColor} ${statusColor} flex items-center justify-center text-4xl mb-5 shadow-inner ${!isCancelled ? 'status-card' : ''}">
                                    <i class="fas ${icon} ${!isCancelled ? 'status-icon' : ''}"></i>
                                </div>
                                <h3 class="text-2xl font-black text-gray-800 mb-2 leading-tight">${statusText}</h3>
                                <p class="text-xs text-gray-500 mb-8 font-medium">
                                    ${!isCancelled ? '<i class="fas fa-sync-alt fa-spin mr-1 text-gray-400"></i> Atualizando em tempo real' : 'Este pedido não será entregue.'}
                                </p>
                                
                                <div class="w-full bg-gray-50 p-4 sm:p-5 rounded-2xl border border-gray-200 text-left mb-6 shadow-sm">
                                    <h4 class="font-black text-[10px] text-gray-400 uppercase tracking-wider mb-3"><i class="fas fa-receipt mr-1"></i> Resumo do Pedido</h4>
                                    <ul class="text-sm text-gray-700 space-y-2 mb-4 font-medium">
                                        ${order.items.map(i => `
                                            <li class="flex justify-between border-b border-gray-100 pb-2 last:border-0 last:pb-0">
                                                <span>${i.quantity}x ${i.name}</span>
                                            </li>
                                        `).join('')}
                                    </ul>
                                    <div class="font-black text-brand-600 text-xl border-t border-gray-200 pt-3 flex justify-between items-center">
                                        <span class="text-sm text-gray-500">Total</span>
                                        ${(order.total || 0).toLocaleString('pt-BR', {style: 'currency', currency: 'BRL'})}
                                    </div>
                                </div>

                                ${tenantPhone ? `
                                    <a href="${wppLink}" target="_blank" class="w-full bg-[#25D366] hover:bg-[#128C7E] text-white font-black py-4 rounded-xl transition shadow-lg shadow-[#25D366]/30 flex items-center justify-center gap-2 mb-2 text-sm sm:text-base">
                                        <i class="fab fa-whatsapp text-xl"></i> Enviar Detalhes no WhatsApp
                                    </a>
                                ` : ''}
                                
                                <button onclick="window.location.hash='#/'" class="mt-4 text-gray-400 hover:text-gray-800 text-sm font-bold transition flex items-center gap-1.5 p-2">
                                    <i class="fas fa-arrow-left"></i> Fazer outro pedido
                                </button>
                            </div>
                        </div>
                    </div>
                `;
            });
        }

        window.addEventListener('DOMContentLoaded', () => {
            initializeAppAuth();
        });
        
    </script>
</body>
</html>
