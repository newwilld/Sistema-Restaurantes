<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WA CRM - Azul Moderno</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <!-- Ícones Phosphor -->
  <script src="https://unpkg.com/@phosphor-icons/web"></script>

  <style>
    body { font-family: 'Inter', sans-serif; }
    
    /* --- CSS NOVO IMPLEMENTADO --- */

    /* Animações suaves */
    .card-animado {
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }
    .card-animado:hover {
      transform: translateY(-4px);
      box-shadow: 0 12px 24px rgba(0, 0, 0, 0.08);
    }

    /* Modal suave */
    #modalCliente {
      transition: opacity 0.3s ease, transform 0.3s ease;
      z-index: 50;
      opacity: 0;
      visibility: hidden; /* Mantém hidden para não bloquear cliques quando fechado */
    }
    #modalCliente.show {
      display: flex !important;
      opacity: 1;
      visibility: visible;
      transform: scale(1);
    }

    /* Botões */
    .action-btn {
      padding: 6px 10px;
      border-radius: 4px;
      font-size: 0.875rem;
      font-weight: 500;
      margin-right: 4px;
      cursor: pointer;
      border: none; /* Reset border */
      display: inline-flex; /* Alinhamento icone */
      align-items: center;
      gap: 4px;
      transition: background 0.2s ease;
    }
    .btn-edit {
      background-color: #6366f1;
      color: white;
    }
    .btn-edit:hover {
      background-color: #4f46e5;
    }
    .btn-whatsapp {
      background-color: #22c55e;
      color: white;
    }
    .btn-whatsapp:hover {
      background-color: #16a34a;
    }
    .btn-delete {
      background-color: #ef4444;
      color: white;
    }
    .btn-delete:hover {
      background-color: #dc2626;
    }

    /* Tags de status e prioridade */
    .status-realizando {
      background-color: #3b82f6;
      color: white;
      padding: 4px 8px;
      border-radius: 999px;
      font-size: 0.75rem;
      font-weight: bold;
      text-transform: uppercase;
    }
    .status-entregue {
      background-color: #10b981;
      color: white;
      padding: 4px 8px;
      border-radius: 999px;
      font-size: 0.75rem;
      font-weight: bold;
      text-transform: uppercase;
    }
    
    /* Badges de Prioridade (Visualização em Texto) */
    .prioridade-alta {
      color: #ef4444;
      font-weight: 600;
    }
    .prioridade-média {
      color: #f59e0b;
      font-weight: 600;
    }
    .prioridade-baixa {
      color: #3b82f6;
      font-weight: 600;
    }

    /* Cores de fundo pelo status (Aplicado aos Cards) */
    .bg-entregue {
      background-color: #beffd1 !important;
    }
    .bg-realizando {
      background-color: #fee2e2 !important; /* Nota: user pediu esta cor (vermelho claro) para realizando */
    }

    /* Cores de borda esquerda por prioridade */
    /* Nota: Adicionado border-left-width/style para garantir que a cor apareça */
    .borda-alta {
      border-left: 4px solid #dc2626 !important;
    }
    .borda-media, .borda-média { /* Suporte para ambos os casos */
      border-left: 4px solid #f59e0b !important;
    }
    .borda-baixa {
      border-left: 4px solid #3b82f6 !important;
    }

    /* Estilo da tabela para mobile (Preservado conforme pedido, caso use tabelas futuramente) */
    table {
      overflow-x: auto;
    }
    td {
      word-break: break-word;
    }
    @media (max-width: 640px) {
      table thead {
        display: none;
      }
      table tbody td {
        display: block;
        width: 100%;
      }
      table tbody tr {
        display: block;
        margin-bottom: 1rem;
        border-bottom: 1px solid #e2e8f0;
      }
      table tbody td::before {
        content: attr(data-label);
        font-weight: bold;
        display: block;
        margin-bottom: 0.25rem;
      }
    }

    /* Scrollbar Personalizada */
    ::-webkit-scrollbar { width: 8px; }
    ::-webkit-scrollbar-track { background: #f1f1f1; }
    ::-webkit-scrollbar-thumb { background: #bfdbfe; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #60a5fa; }
  </style>
</head>
<body class="bg-gray-50 text-gray-800">
  <div id="layoutContainer" class="flex flex-col lg:flex-row min-h-screen">
    <!-- Sidebar -->
    <aside class="lg:block w-full lg:w-72 bg-blue-900 text-white p-6 flex flex-col shadow-xl z-10">
      <div class="mb-8">
          <h1 class="text-3xl font-bold tracking-tight">WA CRM</h1>
          <div class="h-1 w-12 bg-blue-500 mt-2 rounded-full"></div>
      </div>
      
      <p class="text-xs uppercase tracking-wider text-blue-300 font-semibold mb-1">Faturamento Total</p>
      <p id="totalValor" class="text-3xl font-extrabold mb-8 tracking-tight">R$ 0,00</p>

      <div class="space-y-3">
        <button id="addClienteBtn" class="w-full bg-white text-blue-900 px-4 py-3 rounded-xl font-bold shadow hover:bg-blue-50 transition flex items-center justify-center gap-2 transform active:scale-95 duration-200">
          <i class="ph ph-plus-circle text-xl"></i> Novo Cliente
        </button>
        
        <button id="exportarBtn" class="w-full bg-blue-800 text-white border border-blue-700 px-4 py-3 rounded-xl font-semibold shadow hover:bg-blue-700 transition flex items-center justify-center gap-2">
          <i class="ph ph-download-simple text-xl"></i> Exportar
        </button>
        
        <label for="importarInput" class="block w-full">
          <div class="w-full bg-blue-800 text-white border border-blue-700 px-4 py-3 rounded-xl font-semibold shadow text-center cursor-pointer hover:bg-blue-700 transition flex items-center justify-center gap-2">
            <i class="ph ph-upload-simple text-xl"></i> Importar
          </div>
          <input type="file" id="importarInput" accept=".json" class="hidden" />
        </label>
      </div>

      <!-- BOTÃO LIMPAR TUDO -->
      <div class="mt-auto pt-6 border-t border-blue-800">
        <button id="limparTudoBtn" class="w-full bg-red-500/10 border border-red-500/30 text-red-200 hover:bg-red-500 hover:text-white px-4 py-3 rounded-xl font-semibold transition flex items-center justify-center gap-2 group">
          <i class="ph ph-trash text-xl group-hover:animate-bounce"></i> Limpar Tudo
        </button>
      </div>
    </aside>

    <!-- Conteúdo principal -->
    <main class="flex-1 p-4 sm:p-8 overflow-x-hidden bg-gray-50">
      <!-- Dashboard Resumo -->
      <div class="grid grid-cols-1 sm:grid-cols-3 gap-4 mb-8">
        <div class="bg-white p-5 rounded-2xl shadow-sm border border-gray-100 flex flex-col justify-center">
          <h3 class="text-xs uppercase font-semibold text-gray-400 mb-1">Em Andamento</h3>
          <div class="flex items-center gap-2">
             <div class="w-2 h-2 rounded-full bg-blue-500"></div>
             <p id="totalRealizando" class="text-2xl font-bold text-gray-800">0</p>
          </div>
        </div>
        <div class="bg-white p-5 rounded-2xl shadow-sm border border-gray-100 flex flex-col justify-center">
          <h3 class="text-xs uppercase font-semibold text-gray-400 mb-1">Finalizados</h3>
          <div class="flex items-center gap-2">
             <div class="w-2 h-2 rounded-full bg-green-500"></div>
             <p id="totalEntregue" class="text-2xl font-bold text-gray-800">0</p>
          </div>
        </div>
        <div class="bg-white p-5 rounded-2xl shadow-sm border border-gray-100 flex flex-col justify-center">
          <h3 class="text-xs uppercase font-semibold text-gray-400 mb-1">Total Clientes</h3>
          <div class="flex items-center gap-2">
             <div class="w-2 h-2 rounded-full bg-gray-500"></div>
             <p id="totalClientes" class="text-2xl font-bold text-gray-800">0</p>
          </div>
        </div>
      </div>

      <!-- Barra de Ferramentas -->
      <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-100 mb-8 flex flex-col md:flex-row gap-4 justify-between items-center">
        <div class="relative w-full md:w-96">
            <i class="ph ph-magnifying-glass absolute left-3 top-1/2 transform -translate-y-1/2 text-gray-400"></i>
            <input type="text" id="buscarCliente" placeholder="Buscar por nome ou empresa..." class="pl-10 pr-4 py-2.5 w-full border border-gray-200 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent outline-none transition" />
        </div>
        
        <div class="flex gap-2 w-full md:w-auto overflow-x-auto pb-2 md:pb-0">
            <select id="filtroStatus" class="px-3 py-2 border border-gray-200 rounded-lg text-sm focus:ring-2 focus:ring-blue-500 outline-none cursor-pointer bg-white">
                <option value="">Status</option>
                <option value="realizando">Realizando</option>
                <option value="entregue">Entregue</option>
            </select>
            <select id="filtroPrioridade" class="px-3 py-2 border border-gray-200 rounded-lg text-sm focus:ring-2 focus:ring-blue-500 outline-none cursor-pointer bg-white">
                <option value="">Prioridade</option>
                <option value="baixa">Baixa</option>
                <option value="média">Média</option>
                <option value="alta">Alta</option>
            </select>
        </div>
      </div>

      <!-- Grid de Cards -->
      <div id="listaClientes" class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-6">
        <!-- Cards gerados via JS -->
      </div>
    </main>
  </div>

  <!-- Modal com Overlay -->
  <div id="modalCliente" class="fixed inset-0 bg-gray-900/60 backdrop-blur-sm flex items-center justify-center p-4">
    <div class="bg-white w-full max-w-2xl rounded-2xl shadow-2xl transform transition-all flex flex-col max-h-[90vh]">
      
      <!-- Modal Header -->
      <div class="p-6 border-b border-gray-100 flex justify-between items-center">
        <h2 class="text-xl font-bold text-gray-800 flex items-center gap-2">
            <span class="w-1 h-6 bg-blue-600 rounded-full block"></span>
            <span id="tituloModal">Novo Cliente</span>
        </h2>
        <button id="fecharModalX" class="text-gray-400 hover:text-red-500 hover:bg-red-50 p-2 rounded-full transition">
            <i class="ph ph-x text-lg"></i>
        </button>
      </div>

      <!-- Modal Body (Scrollable) -->
      <div class="p-6 overflow-y-auto">
          <form id="formCliente" class="grid grid-cols-1 md:grid-cols-2 gap-5">
            <input type="hidden" id="idCliente">
            
            <div class="col-span-1 md:col-span-2">
                <label class="block text-xs font-semibold text-gray-500 uppercase mb-1">Nome Completo</label>
                <input id="nomeCliente" class="w-full border border-gray-200 p-3 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none transition" type="text" placeholder="Ex: João da Silva" required>
            </div>

            <div>
                <label class="block text-xs font-semibold text-gray-500 uppercase mb-1">Empresa</label>
                <input id="empresaCliente" class="w-full border border-gray-200 p-3 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none transition" type="text" placeholder="Ex: Tech Solutions">
            </div>

            <div>
                <label class="block text-xs font-semibold text-gray-500 uppercase mb-1">Contato (WhatsApp/Email)</label>
                <input id="contatoCliente" class="w-full border border-gray-200 p-3 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none transition" type="text" placeholder="(00) 00000-0000">
            </div>

            <div>
                <label class="block text-xs font-semibold text-gray-500 uppercase mb-1">Valor do Projeto</label>
                <div class="relative">
                    <span class="absolute left-3 top-1/2 -translate-y-1/2 text-gray-400">R$</span>
                    <input id="valorCliente" class="w-full border border-gray-200 p-3 pl-10 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none transition" type="number" step="0.01" placeholder="0,00">
                </div>
            </div>

            <div>
                <label class="block text-xs font-semibold text-gray-500 uppercase mb-1">Data Início</label>
                <input id="dataCriacao" class="w-full border border-gray-200 p-3 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none transition" type="date">
            </div>

            <div>
                <label class="block text-xs font-semibold text-gray-500 uppercase mb-1">Serviço</label>
                <select id="tipoServico" class="w-full border border-gray-200 p-3 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none transition bg-white">
                    <option value="logotipo">Logotipo</option>
                    <option value="site">Site Institucional</option>
                    <option value="anuncio">Gestão de Tráfego</option>
                    <option value="identidade">Identidade Visual</option>
                    <option value="outro">Outro</option>
                </select>
            </div>

            <div>
                <label class="block text-xs font-semibold text-gray-500 uppercase mb-1">Prioridade</label>
                <select id="prioridadeCliente" class="w-full border border-gray-200 p-3 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none transition bg-white">
                    <option value="baixa">Baixa</option>
                    <option value="média">Média</option>
                    <option value="alta">Alta</option>
                </select>
            </div>

            <div>
                <label class="block text-xs font-semibold text-gray-500 uppercase mb-1">Status Atual</label>
                <select id="statusCliente" class="w-full border border-gray-200 p-3 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none transition bg-white">
                    <option value="realizando">Realizando</option>
                    <option value="entregue">Entregue</option>
                </select>
            </div>

            <div class="col-span-1 md:col-span-2">
                <label class="block text-xs font-semibold text-gray-500 uppercase mb-1">Observações</label>
                <textarea id="obsCliente" class="w-full border border-gray-200 p-3 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none transition" rows="3" placeholder="Detalhes adicionais..."></textarea>
            </div>
          </form>
      </div>

      <!-- Modal Footer -->
      <div class="p-6 border-t border-gray-100 flex justify-end gap-3 bg-gray-50 rounded-b-2xl">
          <button id="cancelarBtn" class="px-6 py-2.5 rounded-lg border border-gray-300 text-gray-700 font-medium hover:bg-gray-100 transition">Cancelar</button>
          <button type="button" id="salvarClienteBtn" class="px-6 py-2.5 rounded-lg bg-blue-600 text-white font-medium hover:bg-blue-700 shadow-lg shadow-blue-500/30 transition">Salvar Cliente</button>
      </div>
    </div>
  </div>

  <!-- SCRIPT FIREBASE + LÓGICA -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, push, onValue, update, remove, set } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    // Configuração do Firebase
    const firebaseConfig = {
      apiKey: "AIzaSyBnKmIAnR80BzMv9oVeKWgF_ZQVZbdAfew",
      authDomain: "crm23-7beb7.firebaseapp.com",
      databaseURL: "https://crm23-7beb7-default-rtdb.firebaseio.com",
      projectId: "crm23-7beb7",
      storageBucket: "crm23-7beb7.appspot.com",
      messagingSenderId: "219795920284",
      appId: "1:219795920284:web:9817ab18b0f098e8f4e459",
      measurementId: "G-ZLELD4MVLF"
    };

    // Inicialização
    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const clientesRef = ref(db, 'clientes');

    // Elementos do DOM
    const listaClientes = document.getElementById('listaClientes');
    const modalCliente = document.getElementById('modalCliente');
    const formCliente = document.getElementById('formCliente');
    const addClienteBtn = document.getElementById('addClienteBtn');
    const cancelarBtn = document.getElementById('cancelarBtn');
    const fecharModalX = document.getElementById('fecharModalX');
    const salvarBtn = document.getElementById('salvarClienteBtn');
    
    // Filtros e Dashboard
    const buscarClienteInput = document.getElementById('buscarCliente');
    const filtroStatus = document.getElementById('filtroStatus');
    const filtroPrioridade = document.getElementById('filtroPrioridade');
    const totalValorEl = document.getElementById('totalValor');
    const totalRealizandoEl = document.getElementById('totalRealizando');
    const totalEntregueEl = document.getElementById('totalEntregue');
    const totalClientesEl = document.getElementById('totalClientes');

    // Botões de Ação
    const exportarBtn = document.getElementById('exportarBtn');
    const importarInput = document.getElementById('importarInput');
    const limparTudoBtn = document.getElementById('limparTudoBtn');

    // Estado Local
    let clientes = [];
    let editando = false;
    let clienteIdAtual = null;

    // --- Carregamento de Dados (Firebase) ---
    onValue(clientesRef, (snapshot) => {
      const data = snapshot.val();
      clientes = data ? Object.entries(data).map(([id, cliente]) => ({ id, ...cliente })) : [];
      renderizarClientes();
    });

    // --- Funções Principais ---

    function formatarMoeda(valor) {
      return new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL' }).format(valor || 0);
    }

    function renderizarClientes() {
      listaClientes.innerHTML = '';
      let totalValor = 0;
      let totalRealizando = 0;
      let totalEntregue = 0;

      // Filtros
      const termo = buscarClienteInput.value.toLowerCase().trim();
      const statusFiltro = filtroStatus.value;
      const prioridadeFiltro = filtroPrioridade.value;

      let clientesFiltrados = clientes.filter(c => {
        const matchNome = (c.nome || '').toLowerCase().includes(termo) || (c.empresa || '').toLowerCase().includes(termo);
        const matchStatus = statusFiltro ? c.status === statusFiltro : true;
        const matchPrioridade = prioridadeFiltro ? c.prioridade === prioridadeFiltro : true;
        return matchNome && matchStatus && matchPrioridade;
      });

      // Ordenação
      if (prioridadeFiltro) {
        const prioridadeOrdem = { 'alta': 1, 'média': 2, 'baixa': 3 };
        clientesFiltrados.sort((a, b) => (prioridadeOrdem[a.prioridade] || 4) - (prioridadeOrdem[b.prioridade] || 4));
      }

      if (clientesFiltrados.length === 0) {
        listaClientes.innerHTML = `
          <div class="col-span-full flex flex-col items-center justify-center py-16 text-gray-400">
            <i class="ph ph-magnifying-glass text-4xl mb-3"></i>
            <p class="text-lg font-medium">Nenhum cliente encontrado.</p>
            <p class="text-sm">Tente ajustar seus filtros ou adicione um novo.</p>
          </div>
        `;
      } else {
        clientesFiltrados.forEach(cliente => {
          totalValor += cliente.valor || 0;
          if (cliente.status === 'realizando') totalRealizando++;
          if (cliente.status === 'entregue') totalEntregue++;

          const card = document.createElement('div');
          
          // Estilização com novas classes
          // Normaliza 'média' para 'media' para usar na classe CSS se necessário, mas CSS suporta 'média' com o seletor .borda-média
          const prioridadeNormalizada = (cliente.prioridade || 'baixa').replace('é', 'e'); 
          const bordaClass = `borda-${prioridadeNormalizada}`; // gera borda-media, borda-alta, borda-baixa
          const bgClass = cliente.status === 'entregue' ? 'bg-entregue' : 'bg-realizando';
          const zapLink = `https://wa.me/55${(cliente.contato || '').replace(/\D/g, '')}`;

          card.className = `card-animado p-6 rounded-xl shadow-sm border border-gray-100 relative group flex flex-col ${bordaClass} ${bgClass}`;

          card.innerHTML = `
            <!-- Header do Card -->
            <div class="flex justify-between items-start mb-4">
              <div>
                <h3 class="font-bold text-lg text-gray-800 leading-tight">${cliente.nome}</h3>
                <p class="text-sm text-gray-500 font-medium">${cliente.empresa || 'Particular'}</p>
              </div>
              <span class="status-${cliente.status}">${cliente.status}</span>
            </div>
            
            <!-- Corpo do Card -->
            <div class="space-y-3 mb-6 flex-1">
              <div class="flex items-center justify-between text-sm">
                  <span class="text-gray-600 flex items-center gap-2 font-medium"><i class="ph ph-briefcase"></i> ${cliente.servico}</span>
                  <span class="prioridade-${cliente.prioridade}">${cliente.prioridade}</span>
              </div>
              <div class="flex items-center gap-2 text-sm text-gray-600 font-mono bg-white/50 p-2 rounded border border-gray-200/50">
                 <span class="text-gray-500">R$</span> <span class="font-bold text-gray-800 text-base">${parseFloat(cliente.valor || 0).toFixed(2)}</span>
              </div>
               ${cliente.obs ? `<p class="text-xs text-gray-500 italic line-clamp-2 mt-2">"${cliente.obs}"</p>` : ''}
            </div>

            <!-- Footer Ações -->
            <div class="pt-4 border-t border-gray-200/50 flex flex-wrap gap-2 mt-auto">
               <button onclick="window.abrirZap('${zapLink}')" class="action-btn btn-whatsapp" title="Chamar no WhatsApp">
                  <i class="ph ph-whatsapp-logo text-lg"></i> WhatsApp
               </button>
               <div class="ml-auto flex gap-2">
                  <button onclick="window.editarCliente('${cliente.id}')" class="action-btn btn-edit" title="Editar">
                      <i class="ph ph-pencil-simple text-lg"></i>
                  </button>
                  <button onclick="window.deletarCliente('${cliente.id}')" class="action-btn btn-delete" title="Excluir">
                      <i class="ph ph-trash text-lg"></i>
                  </button>
               </div>
            </div>
          `;
          listaClientes.appendChild(card);
        });
      }

      // Atualiza Totais
      totalValorEl.textContent = formatarMoeda(totalValor);
      totalRealizandoEl.textContent = totalRealizando;
      totalEntregueEl.textContent = totalEntregue;
      totalClientesEl.textContent = clientes.length;
    }

    // --- Funções Globais ---
    
    window.abrirZap = (url) => window.open(url, '_blank');

    window.editarCliente = (id) => {
      const cliente = clientes.find(c => c.id === id);
      if (cliente) {
        preencherFormulario(cliente);
        editando = true;
        clienteIdAtual = id;
        document.getElementById('tituloModal').textContent = 'Editar Cliente';
        modalCliente.classList.add('show');
      }
    };

    window.deletarCliente = (id) => {
      if(confirm('Tem certeza que deseja excluir este cliente do banco de dados?')) {
        remove(ref(db, `clientes/${id}`));
      }
    };

    // --- Funções CRUD e UI ---

    function abrirModal() {
      limparFormulario();
      editando = false;
      clienteIdAtual = null;
      document.getElementById('tituloModal').textContent = 'Novo Cliente';
      document.getElementById('dataCriacao').valueAsDate = new Date();
      modalCliente.classList.add('show');
    }

    function fecharModal() {
      modalCliente.classList.remove('show');
    }

    function obterDadosFormulario() {
      return {
        nome: document.getElementById('nomeCliente').value,
        empresa: document.getElementById('empresaCliente').value,
        contato: document.getElementById('contatoCliente').value,
        valor: parseFloat(document.getElementById('valorCliente').value) || 0,
        servico: document.getElementById('tipoServico').value,
        prioridade: document.getElementById('prioridadeCliente').value,
        status: document.getElementById('statusCliente').value,
        data: document.getElementById('dataCriacao').value,
        obs: document.getElementById('obsCliente').value
      };
    }

    function preencherFormulario(cliente) {
      document.getElementById('nomeCliente').value = cliente.nome || '';
      document.getElementById('empresaCliente').value = cliente.empresa || '';
      document.getElementById('contatoCliente').value = cliente.contato || '';
      document.getElementById('valorCliente').value = cliente.valor || '';
      document.getElementById('tipoServico').value = cliente.servico || '';
      document.getElementById('prioridadeCliente').value = cliente.prioridade || 'baixa';
      document.getElementById('statusCliente').value = cliente.status || 'realizando';
      document.getElementById('dataCriacao').value = cliente.data || '';
      document.getElementById('obsCliente').value = cliente.obs || '';
    }

    function limparFormulario() {
      document.getElementById('formCliente').reset();
    }

    function salvarCliente() {
      const cliente = obterDadosFormulario();
      if (!cliente.nome) {
        alert("O nome é obrigatório!");
        return;
      }

      if (editando) {
        update(ref(db, `clientes/${clienteIdAtual}`), cliente)
          .then(() => fecharModal())
          .catch((err) => alert("Erro ao atualizar: " + err));
      } else {
        push(clientesRef, cliente)
          .then(() => fecharModal())
          .catch((err) => alert("Erro ao salvar: " + err));
      }
    }

    // --- Event Listeners ---
    
    addClienteBtn.addEventListener('click', abrirModal);
    cancelarBtn.addEventListener('click', fecharModal);
    fecharModalX.addEventListener('click', fecharModal);
    salvarBtn.addEventListener('click', salvarCliente); 
    
    modalCliente.addEventListener('click', (e) => {
        if (e.target === modalCliente) fecharModal();
    });

    [buscarClienteInput, filtroStatus, filtroPrioridade].forEach(el => {
        el.addEventListener('input', renderizarClientes);
    });

    limparTudoBtn.addEventListener('click', () => {
      if (confirm("⚠️ ATENÇÃO: Isso apagará TODOS os clientes do banco de dados PERMANENTEMENTE.\n\nDeseja continuar?")) {
        if (confirm("Última chance: Tem certeza absoluta?")) {
            set(clientesRef, null);
        }
      }
    });

    exportarBtn.addEventListener('click', () => {
      const blob = new Blob([JSON.stringify(clientes, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `backup_crm_firebase_${new Date().toISOString().split('T')[0]}.json`;
      a.click();
    });

    importarInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = (event) => {
        try {
          const dados = JSON.parse(event.target.result);
          if (Array.isArray(dados)) {
            if(confirm(`Deseja importar ${dados.length} clientes para o banco de dados?`)) {
                dados.forEach(c => {
                    const { id, ...semId } = c;
                    push(clientesRef, semId);
                });
            }
          } else {
             alert('Formato JSON inválido.');
          }
        } catch (err) {
          alert('Erro ao ler arquivo: ' + err.message);
        }
        e.target.value = '';
      };
      reader.readAsText(file);
    });

  </script>
</body>
</html>
