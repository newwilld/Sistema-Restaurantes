<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WA Sistema de Vendas</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.css" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.2/Sortable.min.js"></script>
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: {
                        brand: {
                            50: '#fef2f2',
                            100: '#fee2e2',
                            500: '#ef4444',
                            600: '#dc2626',
                            900: '#7f1d1d',
                            dark: '#111827'
                        }
                    }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Inter', sans-serif; -webkit-font-smoothing: antialiased; background-color: #f9fafb; }
        .fade-in { animation: fadeIn 0.3s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
        .hide-scroll::-webkit-scrollbar { display: none; }
        .hide-scroll { -ms-overflow-style: none; scrollbar-width: none; }
        .glass-panel { background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(10px); }
        .loader { border-radius: 50%; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .overlay { background-color: rgba(0, 0, 0, 0.5); backdrop-filter: blur(4px); }
        
        @media (max-width: 768px) {
            .product-image-mobile { height: 130px !important; }
        }
        
        .cropper-container { max-height: 400px; }
        .cropper-modal { background-color: #000; opacity: 0.5; }
        .cropper-view-box { border-radius: 8px; outline: 2px solid #ef4444; }
        .cropper-face { border-radius: 8px; }

        .sortable-ghost { opacity: 0.35 !important; transform: scale(0.97); border: 2px dashed #ef4444 !important; background-color: #fef2f2 !important; }
        .sortable-chosen { box-shadow: 0 12px 25px -5px rgba(0, 0, 0, 0.15), 0 8px 10px -6px rgba(0, 0, 0, 0.1); }
        .sortable-drag { cursor: grabbing !important; opacity: 0.95; transform: rotate(1deg); }
        .drag-handle { touch-action: none; user-select: none; -webkit-user-select: none; }

        .status-icon {
            animation: iconBounce 1.5s ease-in-out infinite;
        }
        @keyframes iconBounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }
    </style>
</head>
<body class="text-gray-800 antialiased overflow-x-hidden">

    <div id="app" class="min-h-screen w-full flex flex-col">
        <div class="flex-grow flex items-center justify-center">
            <div class="loader w-12 h-12 border-4 border-gray-200 border-t-brand-500"></div>
        </div>
    </div>
    
    <div id="modal-container"></div>
    <div id="toast-container" class="fixed top-4 right-4 z-[9999] flex flex-col gap-2 pointer-events-none"></div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut, onAuthStateChanged, updateProfile, updatePassword, updateEmail } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, getDoc, setDoc, collection, getDocs, updateDoc, deleteDoc, onSnapshot, query, where, serverTimestamp, writeBatch } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCZyMVAn_F3me72l8N1PqKTfgnb0cQpUKA",
            authDomain: "sistema-restaurantes-6baf8.firebaseapp.com",
            projectId: "sistema-restaurantes-6baf8",
            storageBucket: "sistema-restaurantes-6baf8.firebasestorage.app",
            messagingSenderId: "753663577381",
            appId: "1:753663577381:web:9771b3c0004264b2745ecc",
            measurementId: "G-0B4Q7M2V5K"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);

        const secondaryApp = initializeApp(firebaseConfig, "SecondaryApp");
        const secondaryAuth = getAuth(secondaryApp);

        const collections = {
            tenants: "saas_tenants",
            products: "saas_products",
            orders: "saas_orders",
            notifications: "saas_notifications",
            adminNotifications: "saas_admin_notifications"
        };

        const state = {
            currentUser: null,
            isSuperAdmin: false,
            currentTenant: null,
            
            viewingSlug: null,
            publicTenant: null,
            publicProducts: [],
            cart: [],
            
            adminProducts: [],
            adminOrders: [],
            adminNotifications: [],

            superAdminTenants: [],
            superAdminOrders: [],
            superAdminNotifications: [],
            
            isAppLoaded: false,
            isNavigating: false,
            
            currentOrderId: null,
            currentOrder: null,
            unsubOrderListener: null
        };

        function generateId() { return Math.random().toString(36).substring(2, 15); }

        window.showToast = function(message, type = 'success') {
            const toast = document.createElement('div');
            const bgColor = type === 'success' ? 'bg-gray-900' : 'bg-red-500';
            const icon = type === 'success' ? 'fa-check-circle text-green-400' : 'fa-exclamation-circle text-white';
            
            toast.className = `${bgColor} text-white px-6 py-3 rounded-xl shadow-2xl flex items-center gap-3 fade-in transform transition-all duration-300`;
            toast.innerHTML = `<i class="fas ${icon} text-xl"></i><span class="font-medium">${message}</span>`;
            
            document.getElementById('toast-container').appendChild(toast);
            setTimeout(() => {
                toast.style.opacity = '0';
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }

        window.openModal = function(htmlContent) { document.getElementById('modal-container').innerHTML = htmlContent; }
        window.closeModal = function() { document.getElementById('modal-container').innerHTML = ''; }

        // --- Realtime Listeners Variables ---
        window.unsubAdminProducts = null;
        window.unsubAdminOrders = null;
        window.unsubAdminTenant = null;
        window.unsubPublicTenant = null;

        async function setupAdminListeners() {
            if (!state.currentTenant) return;

            if(!window.unsubAdminProducts) {
                window.unsubAdminProducts = onSnapshot(query(collection(db, collections.products), where("tenantId", "==", state.currentTenant.id)), (snap) => {
                    state.adminProducts = snap.docs.map(d => ({ id: d.id, ...d.data() })).sort((a,b) => (a.order||0) - (b.order||0));
                    if (window.location.hash.startsWith('#/admin')) refreshAdminContent(window.location.hash.split('/')[2] || 'dashboard');
                });
            }

            if(!window.unsubAdminOrders) {
                window.unsubAdminOrders = onSnapshot(query(collection(db, collections.orders), where("tenantId", "==", state.currentTenant.id)), (snap) => {
                    state.adminOrders = snap.docs.map(d => ({ id: d.id, ...d.data() })).sort((a,b) => b.createdAt - a.createdAt);
                    
                    snap.docChanges().forEach(change => {
                        if(change.type === 'added') {
                            const o = {id: change.doc.id, ...change.doc.data()};
                            // Notifica apenas pedidos novos e criados nos ultimos 30 segundos
                            if(o.status === 'novo' && (Date.now() - o.createdAt) < 30000) { 
                                showOrderNotification(o);
                            }
                        }
                    });
                    
                    if (window.location.hash.startsWith('#/admin')) refreshAdminContent(window.location.hash.split('/')[2] || 'dashboard');
                });
            }

            if(!window.unsubAdminTenant) {
                window.unsubAdminTenant = onSnapshot(doc(db, collections.tenants, state.currentTenant.id), (docSnap) => {
                    if(docSnap.exists()){
                        state.currentTenant = { id: docSnap.id, ...docSnap.data() };
                        if (window.location.hash.startsWith('#/admin')) refreshAdminContent(window.location.hash.split('/')[2] || 'dashboard');
                        
                        // Atualiza botão no header imediatamente
                        const headerBtns = document.querySelectorAll('.status-toggle-btn');
                        headerBtns.forEach(btn => {
                            const isOpen = state.currentTenant.settings?.open !== false;
                            btn.className = `status-toggle-btn flex items-center gap-2 px-4 py-2 rounded-xl font-bold text-sm transition shadow-sm ${isOpen ? 'bg-green-50 text-green-700 border border-green-200 hover:bg-green-100' : 'bg-red-50 text-red-700 border border-red-200 hover:bg-red-100'}`;
                            btn.innerHTML = `<i class="fas ${isOpen ? 'fa-check-circle text-green-500' : 'fa-times-circle text-red-500'}"></i> <span>Cardápio ${isOpen ? 'Aberto' : 'Fechado'}</span>`;
                        });
                    }
                });
            }
        }

        function refreshAdminContent(route) {
            const el = document.getElementById('admin-content');
            if (el) {
                el.innerHTML = getAdminContent(route);
                if (route === 'cardapio') initAdminSortable();
            }
        }

        window.showOrderNotification = function(order) {
            const notifId = 'order-notif-' + order.id;
            if(document.getElementById(notifId)) return;
            
            const div = document.createElement('div');
            div.id = notifId;
            div.className = "fixed inset-0 z-[100] flex items-center justify-center p-4 overlay fade-in bg-black/80 backdrop-blur-sm";
            div.innerHTML = `
                <div class="bg-white rounded-3xl shadow-2xl w-full max-w-sm overflow-hidden flex flex-col transform scale-100 animate-[bounce_0.5s_ease-out]">
                    <div class="bg-brand-500 p-6 text-center text-white relative">
                        <div class="w-16 h-16 bg-white/20 rounded-full flex items-center justify-center text-3xl mx-auto mb-3 animate-pulse">
                            <i class="fas fa-bell"></i>
                        </div>
                        <h3 class="font-black text-2xl mb-1">NOVO PEDIDO!</h3>
                        <p class="font-medium opacity-90 text-sm">Recebido agora mesmo</p>
                    </div>
                    <div class="p-6 text-left">
                        <div class="mb-4">
                            <p class="text-xs font-bold text-gray-500 uppercase tracking-wider mb-1">Cliente</p>
                            <p class="font-black text-gray-900 text-lg">${order.customer?.name || 'Cliente'}</p>
                        </div>
                        <div class="mb-4">
                            <p class="text-xs font-bold text-gray-500 uppercase tracking-wider mb-1">Resumo dos Itens</p>
                            <p class="font-medium text-gray-700 text-sm line-clamp-2">${order.items.map(i=>`${i.quantity}x ${i.name}`).join(', ')}</p>
                        </div>
                        <div class="mb-6 bg-gray-50 p-3 rounded-xl border border-gray-100 flex justify-between items-center">
                            <span class="font-bold text-gray-600">Valor Total:</span>
                            <span class="font-black text-brand-600 text-xl">R$ ${(order.total || 0).toFixed(2)}</span>
                        </div>
                        <button onclick="closeOrderNotification('${notifId}', '${order.id}')" class="w-full bg-gray-900 hover:bg-black text-white font-black py-4 rounded-xl transition shadow-xl flex justify-center items-center gap-2">
                            <i class="fas fa-check"></i> FECHAR AVISO E VER PEDIDO
                        </button>
                    </div>
                </div>
            `;
            document.body.appendChild(div);
            
            try {
                const audio = new Audio('https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3');
                audio.play().catch(e=>{});
            } catch(e){}
        }

        window.closeOrderNotification = function(notifId, orderId) {
            const el = document.getElementById(notifId);
            if(el) el.remove();
            window.location.hash = '#/admin/pedidos';
            setTimeout(() => { openOrderDetailsModal(orderId); }, 200);
        }

        async function navigateToDashboard(user, isSuperAdmin, tenantData) {
            state.currentUser = user;
            state.isSuperAdmin = isSuperAdmin;
            
            if (tenantData) {
                state.currentTenant = { id: user.uid, ...tenantData };
            } else if (!isSuperAdmin && user) {
                const docRef = doc(db, collections.tenants, user.uid);
                const docSnap = await getDoc(docRef);
                if (docSnap.exists()) {
                    state.currentTenant = { id: docSnap.id, ...docSnap.data() };
                }
            }

            if (isSuperAdmin) {
                await loadSuperAdminNotifications();
            } else {
                await setupAdminListeners();
            }

            const targetHash = isSuperAdmin ? '#/superadmin' : '#/admin';
            window.location.hash = targetHash;
            handleRoute();
        }

        function setupRouter() {
            window.addEventListener('hashchange', handleRoute);
            handleRoute();
        }

        async function handleRoute() {
            const hash = window.location.hash;
            const appDiv = document.getElementById('app');

            if (!state.isAppLoaded) return;

            if (hash === '' || hash === '#/') {
                renderLanding(appDiv);
            } 
            else if (hash.startsWith('#/login')) {
                if (state.currentUser) {
                    window.location.hash = state.isSuperAdmin ? '#/superadmin' : '#/admin';
                } else {
                    renderAuth(appDiv);
                }
            } 
            else if (hash.startsWith('#/superadmin')) {
                if (!state.currentUser || !state.isSuperAdmin) {
                    window.location.hash = '#/login';
                } else {
                    renderSuperAdmin(appDiv, hash);
                }
            }
            else if (hash.startsWith('#/admin')) {
                if (!state.currentUser) {
                    window.location.hash = '#/login';
                } else if (state.isSuperAdmin) {
                    window.location.hash = '#/superadmin';
                } else {
                    renderAdmin(appDiv, hash);
                }
            } 
            else if (hash.startsWith('#/cardapio/')) {
                const slug = hash.split('/')[2];
                if (slug) {
                    state.viewingSlug = slug;
                    await loadPublicMenuData(slug);
                    renderPublicMenu(appDiv);
                } else {
                    window.location.hash = '#/';
                }
            }
            else if (hash.startsWith('#/status-pedido')) {
                renderOrderStatus(appDiv);
            }
            else {
                window.location.hash = '#/';
            }
        }

        async function initializeAppAuth() {
            onAuthStateChanged(auth, async (user) => {
                state.currentUser = user;
                if (user) {
                    state.isSuperAdmin = (user.email === 'willdalves1@gmail.com');

                    if (!state.isSuperAdmin) {
                        try {
                            const docRef = doc(db, collections.tenants, user.uid);
                            const docSnap = await getDoc(docRef);
                            if (docSnap.exists()) {
                                state.currentTenant = { id: docSnap.id, ...docSnap.data() };
                            } else {
                                state.currentTenant = null;
                            }
                        } catch (e) {
                            console.error("Erro ao carregar perfil da loja:", e);
                        }
                    } else {
                        try {
                            await loadSuperAdminNotifications();
                        } catch (err) {
                            state.superAdminNotifications = [];
                        }
                    }
                } else {
                    state.currentTenant = null;
                    state.isSuperAdmin = false;
                }
                
                if (!state.isAppLoaded) {
                    state.isAppLoaded = true;
                    handleRoute();
                } else {
                    handleRoute();
                }
            });
        }

        window.unsubSuperAdminNotifs = null;
        window.unsubSuperAdminTenantDeletions = null;

        function refreshSuperAdminContent() {
            if (window.location.hash.startsWith('#/superadmin') && document.getElementById('superadmin-content')) {
                const route = window.location.hash.split('/')[2] || 'dashboard';
                document.getElementById('superadmin-content').innerHTML = getSuperAdminContent(route);
                
                const unreadCount = state.superAdminNotifications.filter(n => !n.read).length;
                
                const badgeHTML = unreadCount > 0 ? `<span class="absolute top-1 right-1 w-2.5 h-2.5 bg-red-500 rounded-full ring-2 ring-white"></span>` : '';
                const headerBell = document.querySelector('header a[title="Notificações"]');
                if (headerBell) headerBell.innerHTML = `<i class="fas fa-bell text-lg"></i>${badgeHTML}`;
                
                const sidebarBadgeHTML = unreadCount > 0 ? `<span class="bg-red-500 text-white text-[10px] font-black px-2 py-0.5 rounded-full animate-pulse">${unreadCount}</span>` : '';
                const sidebarLink = document.querySelector('aside nav a[href="#/superadmin/notificacoes"]');
                if (sidebarLink) sidebarLink.innerHTML = `<div class="flex items-center gap-3"><i class="fas fa-bell w-5"></i> Notificações</div>${sidebarBadgeHTML}`;
            }
        }

        async function loadSuperAdminNotifications() {
            if (!state.isSuperAdmin || !state.currentUser) {
                state.superAdminNotifications = [];
                return;
            }
            return new Promise((resolve) => {
                if (window.unsubSuperAdminNotifs) { resolve(); return; }
                try {
                    const nq = query(collection(db, collections.adminNotifications), where("type", "==", "admin_master"));
                    window.unsubSuperAdminNotifs = onSnapshot(nq, (nsnap) => {
                        const oldCount = state.superAdminNotifications.length;
                        state.superAdminNotifications = nsnap.docs.map(d => ({ id: d.id, ...d.data() })).sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
                        const newCount = state.superAdminNotifications.length;
                        refreshSuperAdminContent();
                        if (newCount > oldCount) showToast('Nova notificação recebida!', 'success');
                        resolve();
                    }, () => { window.unsubSuperAdminNotifs = null; state.superAdminNotifications = []; resolve(); });
                } catch (err) { window.unsubSuperAdminNotifs = null; state.superAdminNotifications = []; resolve(); }
            });
        }

        window.renderLanding = function(container) {
            container.innerHTML = `
                <div class="min-h-screen flex flex-col bg-white fade-in">
                    <header class="flex justify-between items-center p-6 lg:px-12 border-b border-gray-100 bg-white sticky top-0 z-50">
                        <div class="font-black text-2xl tracking-tighter flex items-center gap-2">
                            <div class="w-8 h-8 bg-brand-500 rounded-lg flex items-center justify-center text-white text-sm shadow-md shadow-brand-500/30">
                                <i class="fas fa-bolt"></i>
                            </div>
                            <span><span class="text-brand-500">WA</span> Vendas</span>
                        </div>
                        <nav>
                            <button onclick="window.location.hash='#/login'" class="font-semibold text-gray-600 hover:text-brand-500 mr-6 transition">Entrar</button>
                            <button onclick="window.location.hash='#/login?type=cliente&register=true'" class="bg-brand-dark text-white px-5 py-2.5 rounded-xl font-bold hover:bg-gray-800 transition shadow-lg">Começar Grátis</button>
                        </nav>
                    </header>

                    <main class="flex-grow flex flex-col items-center justify-center text-center px-4 py-20 bg-gradient-to-b from-gray-50 to-white">
                        <div class="inline-flex items-center gap-2 px-4 py-2 rounded-full bg-brand-50 text-brand-600 font-bold text-sm mb-8 border border-brand-100">
                            <span class="relative flex h-2.5 w-2.5">
                              <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-brand-400 opacity-75"></span>
                              <span class="relative inline-flex rounded-full h-2.5 w-2.5 bg-brand-500"></span>
                            </span>
                            Plataforma SaaS Completa
                        </div>
                        <h1 class="text-5xl md:text-7xl font-black text-gray-900 tracking-tight mb-6 max-w-4xl leading-tight">
                            O sistema de vendas do seu <span class="text-transparent bg-clip-text bg-gradient-to-r from-brand-500 to-orange-500">Restaurante</span>
                        </h1>
                        <p class="text-xl text-gray-500 mb-10 max-w-2xl font-medium">Cardápio digital, gestão de pedidos em tempo real via PIX e Cartão. Tudo em uma única plataforma.</p>
                        
                        <div class="flex flex-col sm:flex-row gap-4">
                            <button onclick="window.location.hash='#/login?type=cliente&register=true'" class="bg-brand-500 text-white px-8 py-4 rounded-xl font-bold text-lg hover:bg-brand-600 transition shadow-xl shadow-brand-500/30 flex items-center justify-center gap-2">
                                Criar minha Loja Agora <i class="fas fa-arrow-right"></i>
                            </button>
                        </div>

                        <div class="mt-20 w-full max-w-5xl">
                            <div class="grid grid-cols-1 md:grid-cols-3 gap-8 text-left">
                                <div class="bg-white p-8 rounded-2xl shadow-sm border border-gray-100">
                                    <div class="w-12 h-12 bg-red-50 text-brand-500 rounded-xl flex items-center justify-center text-xl mb-6"><i class="fas fa-hamburger"></i></div>
                                    <h3 class="text-xl font-bold mb-3">Cardápio Lindo</h3>
                                    <p class="text-gray-500 text-sm leading-relaxed">Mostre seus produtos com fotos incríveis e gere vendas automáticas.</p>
                                </div>
                                <div class="bg-white p-8 rounded-2xl shadow-sm border border-gray-100">
                                    <div class="w-12 h-12 bg-green-50 text-green-500 rounded-xl flex items-center justify-center text-xl mb-6"><i class="fas fa-motorcycle"></i></div>
                                    <h3 class="text-xl font-bold mb-3">Gestão de Pedidos</h3>
                                    <p class="text-gray-500 text-sm leading-relaxed">Receba os pedidos direto no painel com alertas e atualizações em tempo real.</p>
                                </div>
                                <div class="bg-white p-8 rounded-2xl shadow-sm border border-gray-100">
                                    <div class="w-12 h-12 bg-blue-50 text-blue-500 rounded-xl flex items-center justify-center text-xl mb-6"><i class="fas fa-bolt"></i></div>
                                    <h3 class="text-xl font-bold mb-3">Totalmente Realtime</h3>
                                    <p class="text-gray-500 text-sm leading-relaxed">Pedidos, notificações e status aberto/fechado se atualizam sem recarregar a página.</p>
                                </div>
                            </div>
                        </div>
                    </main>
                </div>
            `;
        }

        window.renderAuth = function(container) {
            const urlParams = new URLSearchParams(window.location.hash.split('?')[1]);
            const isRegister = urlParams.get('register') === 'true';
            window.authTab = urlParams.get('type') === 'admin' ? 'admin' : 'cliente'; 
            renderAuthUI(container, isRegister);
        }

        window.renderAuthUI = function(container, isRegister) {
            const isAdmin = window.authTab === 'admin';

            container.innerHTML = `
                <div class="min-h-screen flex items-center justify-center bg-gray-50 p-4 fade-in">
                    <div class="bg-white p-8 sm:p-12 rounded-3xl shadow-2xl w-full max-w-md border border-gray-100 relative overflow-hidden">
                        <div class="absolute top-0 left-0 w-full h-2 bg-gradient-to-r ${isAdmin ? 'from-purple-600 to-blue-600' : 'from-brand-500 to-orange-500'}"></div>
                        <div class="text-center mb-8">
                            <div class="inline-flex items-center justify-center w-16 h-16 rounded-2xl ${isAdmin ? 'bg-purple-50 text-purple-600' : 'bg-red-50 text-brand-600'} mb-4 shadow-inner">
                                <i class="fas ${isAdmin ? 'fa-shield-alt' : 'fa-store'} text-2xl"></i>
                            </div>
                            <h2 class="text-2xl font-bold text-gray-800">${isAdmin ? 'Acesso Administrativo' : (isRegister ? 'Crie seu Restaurante' : 'Painel do Restaurante')}</h2>
                            <p class="text-gray-500 text-sm mt-1">${isAdmin ? 'Gestão da Plataforma WA Vendas.' : (isRegister ? 'Inicie seu teste gratuito e monte seu cardápio.' : 'Gerencie suas vendas e cardápio.')}</p>
                        </div>

                        <div class="flex p-1 bg-gray-100 rounded-xl mb-8">
                            <button onclick="window.authTab='cliente'; renderAuthUI(document.getElementById('app'), false)" class="flex-1 py-2 text-sm font-bold rounded-lg transition ${!isAdmin ? 'bg-white shadow-sm text-brand-600' : 'text-gray-500 hover:text-gray-800'}">Sou Lojista</button>

        window.handleAuthSubmit = async function(event, isRegister, isAdmin) {
            event.preventDefault();
            const btn = document.getElementById('auth-btn');
            const originalText = btn.innerHTML;
            btn.innerHTML = '<div class="loader w-5 h-5 border-2 border-white border-t-transparent mx-auto"></div>';
            btn.disabled = true;

            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            try {
                if (isRegister && !isAdmin) {
                    const name = document.getElementById('restaurant-name').value;
                    const slug = document.getElementById('restaurant-slug').value;
                    const phone = document.getElementById('restaurant-phone').value.trim();
                    
                    if(slug.length < 3) throw new Error("Link deve ter pelo menos 3 caracteres.");

                    const userCreds = await createUserWithEmailAndPassword(auth, email, password);
                    await updateProfile(userCreds.user, { displayName: name });
                    
                    const tenantData = {
                        name: name,
                        slug: slug,
                        phone: phone,
                        email: email,
                        password: password,
                        status: 'active',
                        plan: 'trial',
                        createdAt: serverTimestamp(),
                        settings: { open: true, minOrder: 0, primaryColor: '#ef4444', coverImage: '', profileImage: '' }
                    };

                    await setDoc(doc(db, collections.tenants, userCreds.user.uid), tenantData);

                    createAdminNotification({
                        type: 'admin_master',
                        title: `Novo Cadastro @${name}`,
                        message: `${name} cadastrou-se na plataforma`,
                        customerName: name,
                        customerEmail: email,
                        action: 'novo_cliente'
                    }).catch(e=>{});

                    showToast('Restaurante criado com sucesso! Bem-vindo(a).');
                    await navigateToDashboard(userCreds.user, false, tenantData);

                } else {
                    const userCreds = await signInWithEmailAndPassword(auth, email, password);
                    if (isAdmin && email !== 'willdalves1@gmail.com') {
                        throw new Error("Acesso administrativo negado.");
                    }
                    
                    const isSuperAdmin = (email === 'willdalves1@gmail.com');
                    
                    if (!isSuperAdmin) {
                        const docRef = doc(db, collections.tenants, userCreds.user.uid);
                        const docSnap = await getDoc(docRef);
                        if (docSnap.exists()) {
                            await navigateToDashboard(userCreds.user, false, { id: docSnap.id, ...docSnap.data() });
                        } else {
                            await navigateToDashboard(userCreds.user, false, null);
                        }
                    } else {
                        await navigateToDashboard(userCreds.user, true, null);
                    }
                    
                    showToast('Acesso liberado.');
                }
            } catch (error) {
                let msg = error.message;
                if(error.code === 'auth/email-already-in-use') msg = "E-mail já cadastrado.";
                if(error.code === 'auth/invalid-credential') msg = "E-mail ou senha incorretos.";
                showToast(msg, 'error');
                btn.innerHTML = originalText;
                btn.disabled = false;
            }
        }

        async function createAdminNotification(notificationData) {
            const notifObj = {
                id: generateId(),
                ...notificationData,
                createdAt: Date.now(),
                read: false
            };

            if (state.isSuperAdmin) {
                state.superAdminNotifications.unshift(notifObj);
                refreshSuperAdminContent();
            }

            try {
                const notifRef = doc(collection(db, collections.adminNotifications));
                await setDoc(notifRef, { ...notificationData, createdAt: Date.now(), read: false });
                notifObj.id = notifRef.id;
            } catch (err) {}
        }

        async function cleanupTenantData(tenantId) {
            try {
                const productsQuery = query(collection(db, collections.products), where("tenantId", "==", tenantId));
                const productsSnap = await getDocs(productsQuery);
                const productsBatch = writeBatch(db);
                productsSnap.docs.forEach(doc => productsBatch.delete(doc.ref));
                
                const ordersQuery = query(collection(db, collections.orders), where("tenantId", "==", tenantId));
                const ordersSnap = await getDocs(ordersQuery);
                const ordersBatch = writeBatch(db);
                ordersSnap.docs.forEach(doc => ordersBatch.delete(doc.ref));
                
                const notifsQuery = query(collection(db, collections.notifications), where("tenantId", "==", tenantId));
                const notifsSnap = await getDocs(notifsQuery);
                const notifsBatch = writeBatch(db);
                notifsSnap.docs.forEach(doc => notifsBatch.delete(doc.ref));
                
                await Promise.all([
                    productsSnap.docs.length > 0 ? productsBatch.commit() : Promise.resolve(),
                    ordersSnap.docs.length > 0 ? ordersBatch.commit() : Promise.resolve(),
                    notifsSnap.docs.length > 0 ? notifsBatch.commit() : Promise.resolve()
                ]);
                
                state.superAdminTenants = state.superAdminTenants.filter(t => t.id !== tenantId);
            } catch (err) { }
        }

        async function loadSuperAdminData() {
            if (!state.isSuperAdmin) return;
            
            const tenantsPromise = new Promise((resolve) => {
                if (window.unsubSuperAdminTenants) { resolve(); return; }
                window.unsubSuperAdminTenants = onSnapshot(collection(db, collections.tenants), (snap) => {
                    state.superAdminTenants = snap.docs.map(d => ({ id: d.id, ...d.data() }));
                    if (window.location.hash.startsWith('#/superadmin') && document.getElementById('superadmin-content')) {
                        const route = window.location.hash.split('/')[2] || 'dashboard';
                        document.getElementById('superadmin-content').innerHTML = getSuperAdminContent(route);
                    }
                    resolve();
                });
            });

            const deletionsPromise = new Promise((resolve) => {
                if (window.unsubSuperAdminTenantDeletions) { resolve(); return; }
                window.unsubSuperAdminTenantDeletions = onSnapshot(collection(db, collections.tenants), (snap) => {
                    const currentIds = new Set(snap.docs.map(d => d.id));
                    const existingIds = new Set(state.superAdminTenants.map(t => t.id));
                    const removedIds = [...existingIds].filter(id => !currentIds.has(id));
                    
                    if (removedIds.length > 0) {
                        state.superAdminTenants = state.superAdminTenants.filter(t => !removedIds.includes(t.id));
                        removedIds.forEach(async (tenantId) => { await cleanupTenantData(tenantId); });
                        if (window.location.hash.startsWith('#/superadmin') && document.getElementById('superadmin-content')) {
                            const route = window.location.hash.split('/')[2] || 'dashboard';
                            document.getElementById('superadmin-content').innerHTML = getSuperAdminContent(route);
                        }
                        showToast('Cliente removido do sistema!', 'error');
                    }
                    resolve();
                });
            });

            await Promise.all([tenantsPromise, deletionsPromise]);
            try { await loadSuperAdminNotifications(); } catch (err) {}
            await checkPlanExpirations(); 
            
            const contentDiv = document.getElementById('superadmin-content');
            if (contentDiv) {
                contentDiv.innerHTML = getSuperAdminContent(window.location.hash.split('/')[2] || 'dashboard');
            }
        }
        
        async function checkPlanExpirations() {
            if (!state.isSuperAdmin) return;
            const batch = writeBatch(db);
            let hasUpdates = false;

            for (let t of state.superAdminTenants) {
                if (!t.renewalDate || t.status === 'canceled') continue;
                const today = new Date(); today.setHours(0,0,0,0);
                const renewalParts = t.renewalDate.split('-');
                const renewal = new Date(renewalParts[0], renewalParts[1] - 1, renewalParts[2]); 
                
                const diffTime = renewal - today;
                const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));
                
                let notifType = null; let msg = ''; let updateFields = {};

                if (diffDays === 5 && t.lastNotif !== '5d') { notifType = '5d'; msg = `O plano de @${t.name} vai vencer em 5 dias`; }
                else if (diffDays === 3 && t.lastNotif !== '3d') { notifType = '3d'; msg = `O plano de @${t.name} vai vencer em 3 dias`; }
                else if (diffDays === 0 && t.lastNotif !== '0d') { notifType = '0d'; msg = `O plano de @${t.name} vai vencer hoje`; }
                else if (diffDays === -3 && t.lastNotif !== '-3d') { notifType = '-3d'; msg = `@${t.name} venceu a 3 dias após 5 dias será congelado`; }
                else if (diffDays <= -5 && t.status !== 'suspended') {
                    notifType = 'suspended_auto'; 
                    msg = `O plano de @${t.name} venceu há 5 dias. Foi atualizado para Suspenso.`;
                    updateFields.status = 'suspended';
                }

                if (notifType) {
                    updateFields.lastNotif = notifType;
                    const tRef = doc(db, collections.tenants, t.id);
                    batch.update(tRef, updateFields);
                    hasUpdates = true;
                    
                    t.status = updateFields.status || t.status;
                    t.lastNotif = notifType;

                    createAdminNotification({
                        type: 'admin_master',
                        title: 'Aviso de Vencimento',
                        message: msg,
                        customerName: t.name,
                        action: 'vencimento'
                    }).catch(e=>{});
                }
            }
            if (hasUpdates) await batch.commit();
        }

        }

        let sortableInstance = null;
        window.initAdminSortable = function() {
            const container = document.getElementById('admin-products-list');
            if (!container) return;
            if (typeof Sortable === 'undefined') { setTimeout(initAdminSortable, 150); return; }
            if (sortableInstance) { try { sortableInstance.destroy(); } catch(e) {} sortableInstance = null; }

            const cards = container.querySelectorAll('.admin-product-card');
            if (cards.length <= 1) return;

            sortableInstance = new Sortable(container, {
                animation: 200, handle: '.drag-handle', ghostClass: 'sortable-ghost', chosenClass: 'sortable-chosen', dragClass: 'sortable-drag',
                onEnd: async function(evt) {
                    if (evt.oldIndex === evt.newIndex) return;
                    const itemEls = container.querySelectorAll('.admin-product-card');
                    const newOrderedIds = Array.from(itemEls).map(el => el.getAttribute('data-id'));
                    await saveProductsOrder(newOrderedIds);
                }
            });
        };

        window.saveProductsOrder = async function(newOrderedIds) {
            try {
                const batch = writeBatch(db);
                newOrderedIds.forEach((id, index) => {
                    const productRef = doc(db, collections.products, id);
                    batch.update(productRef, { order: index });
                });
                await batch.commit();
                showToast('Ordem do cardápio salva com sucesso!');
            } catch (error) { showToast('Erro ao salvar nova ordem.', 'error'); }
        };

        window.toggleRestaurantStatus = async function() {

            try {
                const tenantRef = doc(db, collections.tenants, state.currentTenant.id);
                await updateDoc(tenantRef, { 'settings.open': newStatus });
                state.currentTenant.settings.open = newStatus;
                showToast(`Cardápio ${newStatus ? 'Aberto' : 'Fechado'} com sucesso!`);
                // Listener will auto-update UI

        };

            const faturamento = state.adminOrders.reduce((sum, o) => sum + (o.status !== 'cancelado' && o.status !== 'recusado' ? o.total : 0), 0);

            try {

                state.currentTenant.phone = newPhone;
                showToast("Contato atualizado com sucesso!");
                btn.disabled = false; btn.innerHTML = 'Salvar Contato';
            } catch(err) { showToast("Erro: " + err.message, "error"); btn.disabled = false; btn.innerHTML = 'Salvar Contato'; }
        };

        window.saveTenantPassword = async function(e) {
            e.preventDefault();
            const btn = document.getElementById('btn-save-pass');
            btn.disabled = true; btn.innerHTML = 'Salvando...';
            const newPass = document.getElementById('cfg-password').value;
            try {
                if(state.currentUser) await updatePassword(state.currentUser, newPass);
                await updateDoc(doc(db, collections.tenants, state.currentTenant.id), { password: newPass });
                showToast("Senha alterada com sucesso!");
                document.getElementById('cfg-password').value = '';
                btn.disabled = false; btn.innerHTML = 'Editar Senha';
            } catch(err) {
                let msg = err.message;
                if(err.code === 'auth/requires-recent-login') msg = "Faça login novamente para alterar a senha.";
                showToast("Erro: " + msg, "error");
                btn.disabled = false; btn.innerHTML = 'Editar Senha';

        };

        };

        window.saveSlug = async function(e) {
            e.preventDefault();
            const newSlug = document.getElementById('tenant-slug-input').value.trim().toLowerCase().replace(/[^a-z0-9-]/g, '');
            if (newSlug.length < 2) { showToast("Mínimo 2 caracteres.", "error"); return; }
            if (newSlug === state.currentTenant?.slug) { closeModal(); return; }
            try {
                const q = query(collection(db, collections.tenants), where("slug", "==", newSlug));
                const snap = await getDocs(q);
                if (snap.docs.some(d => d.id !== state.currentTenant.id)) { showToast("Este link já está em uso.", "error"); return; }
                await setDoc(doc(db, collections.tenants, state.currentTenant.id), { slug: newSlug }, { merge: true });
                showToast("Link atualizado!"); closeModal(); refreshAdminContent('cardapio');
            } catch (err) { showToast("Erro: " + err.message, "error"); }
        };

        window.saveOrderEdits = async function(e, orderId) {
            e.preventDefault();
            const btn = document.getElementById('btn-save-order');
            btn.disabled = true; btn.innerHTML = '<div class="loader w-4 h-4 border-2 border-white border-t-transparent mx-auto"></div>';
            
            const newName = document.getElementById('modal-order-name').value;
            const newPhone = document.getElementById('modal-order-phone').value;
            const newAddress = document.getElementById('modal-order-address').value;
            const newStatus = document.getElementById('modal-order-status').value;
            const newTotal = parseFloat(document.getElementById('modal-order-total').value);

            try {
                await updateDoc(doc(db, collections.orders, orderId), {
                    'customer.name': newName,
                    'customer.phone': newPhone,
                    'customer.address': newAddress,
                    status: newStatus,
                    total: newTotal
                });
                showToast('Pedido atualizado em tempo real!');
                closeModal();
            } catch(err) {
                showToast('Erro ao atualizar', 'error');
                btn.disabled = false; btn.innerHTML = '<i class="fas fa-save"></i> Salvar Alterações';
            }
        }

        async function loadPublicMenuData(slug) {
            const q = query(collection(db, collections.tenants), where("slug", "==", slug));
            const snap = await getDocs(q);
            if (snap.empty) { state.publicTenant = null; return; }
            state.publicTenant = { id: snap.docs[0].id, ...snap.docs[0].data() };
            
            if(window.unsubPublicTenant) window.unsubPublicTenant();
            window.unsubPublicTenant = onSnapshot(doc(db, collections.tenants, state.publicTenant.id), (d) => {
                if(d.exists()){
                    state.publicTenant = { id: d.id, ...d.data() };
                    const statusEl = document.getElementById('public-status-badge');
                    if(statusEl) {
                        const isOpen = state.publicTenant.settings?.open !== false;
                        statusEl.className = `inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-xs font-bold ${isOpen ? 'bg-green-100 text-green-700' : 'bg-red-100 text-red-700'} mb-3 transition-colors`;
                        statusEl.innerHTML = `<span class="relative flex h-2 w-2"><span class="${isOpen ? 'animate-ping' : ''} absolute inline-flex h-full w-full rounded-full ${isOpen ? 'bg-green-400' : 'bg-red-400'} opacity-75"></span><span class="relative inline-flex rounded-full h-2 w-2 ${isOpen ? 'bg-green-500' : 'bg-red-500'}"></span></span> ${isOpen ? 'Aberto Agora' : 'Fechado'}`;
                    }
                }
            });

            const pq = query(collection(db, collections.products), where("tenantId", "==", state.publicTenant.id));
            const psnap = await getDocs(pq);
            state.publicProducts = psnap.docs.map(d => ({ id: d.id, ...d.data() })).filter(p => p.active !== false).sort((a,b) => (a.order || 0) - (b.order || 0));
        }

                            ${state.publicProducts.length === 0 ? `<div class="col-span-full p-8 text-center text-gray-500">Nenhum produto disponível no momento.</div>` : ''}
                        </div>
                    </div>
                    
                    <div id="cart-bar" class="fixed bottom-0 left-0 w-full bg-white border-t border-gray-200 p-4 shadow-[0_-10px_20px_-10px_rgba(0,0,0,0.1)] transform transition-transform duration-300 ${cartCount > 0 ? 'translate-y-0' : 'translate-y-full'} z-40">
                        <div class="max-w-4xl mx-auto flex items-center justify-between gap-4">
                            <div class="flex flex-col">
                                <span class="text-xs font-bold text-gray-500">Carrinho (${cartCount})</span>
                                <span class="text-lg font-black text-brand-600">R$ ${cartTotal.toFixed(2)}</span>
                            </div>
                            <button onclick="openCartModal()" class="bg-brand-500 text-white px-6 py-3 rounded-xl font-black shadow-lg shadow-brand-500/30 flex items-center gap-2">
                                Ver Carrinho <i class="fas fa-arrow-right"></i>
                            </button>
                        </div>
                    </div>
                </div>
            `;
        }

        window.addToCart = function(id) {
            const p = state.publicProducts.find(x=>x.id === id);
            if(!p) return;
            const exist = state.cart.find(x=>x.id === id);
            if(exist) exist.quantity++;
            else state.cart.push({...p, quantity: 1});
            showToast(`${p.name} adicionado ao carrinho!`);
            renderPublicMenu(document.getElementById('app'));
        }

        window.openCartModal = function() {
            const total = state.cart.reduce((s,i)=>s+(i.price*i.quantity), 0);
            const html = `
                <div class="fixed inset-0 z-50 flex items-center justify-center p-4 overlay fade-in">
                    <div class="bg-white rounded-3xl shadow-2xl w-full max-w-md overflow-hidden flex flex-col max-h-[90vh]">
                        <div class="p-6 border-b flex justify-between items-center bg-gray-50">
                            <h3 class="font-bold text-gray-800 text-lg"><i class="fas fa-shopping-cart text-brand-500"></i> Seu Pedido</h3>
                            <button onclick="closeModal()" class="text-gray-400 hover:text-gray-800 text-xl leading-none">&times;</button>
                        </div>
                        <div class="p-6 overflow-y-auto flex-grow space-y-4">
                            <div class="space-y-3">
                                ${state.cart.map((item, idx) => `
                                    <div class="flex justify-between items-center bg-gray-50 p-3 rounded-xl border border-gray-100">
                                        <div>
                                            <p class="font-bold text-gray-800 text-sm">${item.name}</p>
                                            <p class="text-xs text-gray-500 font-mono">${item.quantity}x R$ ${item.price.toFixed(2)}</p>
                                        </div>
                                        <div class="flex items-center gap-3">
                                            <p class="font-black text-brand-600 text-sm">R$ ${(item.price*item.quantity).toFixed(2)}</p>
                                            <button onclick="removeFromCart(${idx})" class="text-red-500 p-1 hover:bg-red-50 rounded"><i class="fas fa-trash-alt"></i></button>
                                        </div>
                                    </div>
                                `).join('')}
                            </div>
                            
                            <form id="checkout-form" onsubmit="submitOrder(event)" class="space-y-4 pt-4 border-t border-gray-200">
                                <h4 class="font-black text-xs uppercase text-gray-500">Dados da Entrega</h4>
                                <div><input type="text" id="c-name" required placeholder="Seu Nome Completo" class="w-full px-4 py-3 bg-gray-50 border border-gray-300 rounded-xl outline-none focus:border-brand-500 text-sm font-medium"></div>
                                <div><input type="text" id="c-phone" required placeholder="Seu WhatsApp" class="w-full px-4 py-3 bg-gray-50 border border-gray-300 rounded-xl outline-none focus:border-brand-500 text-sm font-medium"></div>
                                <div><input type="text" id="c-address" required placeholder="Endereço Completo (Rua, Nº, Bairro)" class="w-full px-4 py-3 bg-gray-50 border border-gray-300 rounded-xl outline-none focus:border-brand-500 text-sm font-medium"></div>
                                <div><textarea id="c-obs" placeholder="Alguma observação? (Opcional)" rows="2" class="w-full px-4 py-3 bg-gray-50 border border-gray-300 rounded-xl outline-none focus:border-brand-500 text-sm font-medium resize-none"></textarea></div>
                                
                                <div class="bg-brand-50 p-4 rounded-xl border border-brand-100 flex justify-between items-center mb-4">
                                    <span class="font-bold text-brand-900">Total a Pagar</span>
                                    <span class="font-black text-brand-600 text-xl">R$ ${total.toFixed(2)}</span>
                                </div>
                                
                                <button type="submit" id="btn-checkout" class="w-full bg-brand-500 text-white font-black py-4 rounded-xl shadow-lg shadow-brand-500/30 hover:bg-brand-600 transition flex items-center justify-center gap-2">
                                    CONFIRMAR PEDIDO <i class="fas fa-check-circle"></i>
                                </button>
                            </form>
                        </div>
                    </div>
                </div>
            `;
            openModal(html);
        }

        window.removeFromCart = function(idx) {
            state.cart.splice(idx, 1);
            if(state.cart.length === 0) closeModal();
            else openCartModal();
            renderPublicMenu(document.getElementById('app'));
        }

        window.submitOrder = async function(e) {
            e.preventDefault();
            const btn = document.getElementById('btn-checkout');
            btn.disabled = true; btn.innerHTML = '<div class="loader w-5 h-5 border-2 border-white border-t-transparent mx-auto"></div>';
            
            const orderData = {
                tenantId: state.publicTenant.id,
                customer: {
                    name: document.getElementById('c-name').value,
                    phone: document.getElementById('c-phone').value,
                    address: document.getElementById('c-address').value
                },
                observations: document.getElementById('c-obs').value,
                items: state.cart,
                total: state.cart.reduce((s,i)=>s+(i.price*i.quantity), 0),
                status: 'novo',
                createdAt: Date.now()
            };
            
            try {
                const docRef = doc(collection(db, collections.orders));
                await setDoc(docRef, orderData);
                state.cart = [];
                state.currentOrderId = docRef.id;
                closeModal();
                window.location.hash = '#/status-pedido';
            } catch(err) {
                showToast("Erro ao enviar pedido.", "error");
                btn.disabled = false; btn.innerHTML = 'CONFIRMAR PEDIDO';
            }
        }

        window.renderOrderStatus = function(container) {
            if (!state.currentOrderId) {
                window.location.hash = '#/';
                return;
            }
            
            container.innerHTML = `<div class="min-h-screen flex items-center justify-center bg-gray-50"><div class="text-center"><div class="loader w-10 h-10 border-4 border-gray-200 border-t-brand-500 mx-auto mb-4"></div><p class="font-bold text-gray-500">Conectando em tempo real...</p></div></div>`;

            if (state.unsubOrderListener) state.unsubOrderListener();

            state.unsubOrderListener = onSnapshot(doc(db, collections.orders, state.currentOrderId), (docSnap) => {
                if (!docSnap.exists()) return;
                const order = docSnap.data();
                state.currentOrder = order;
                
                let statusText = ""; let statusColor = ""; let statusIcon = "";
                
                switch(order.status) {
                    case 'novo':
                    case 'analisando':
                        statusText = "ENVIADO AO RESTAURANTE: Analisando Pedido";
                        statusColor = "text-blue-600 bg-blue-50 border-blue-200";
                        statusIcon = "fa-clock";
                        break;
                    case 'aceito':
                    case 'preparando':
                        statusText = "PEDIDO ACEITO: Preparando";
                        statusColor = "text-yellow-600 bg-yellow-50 border-yellow-200";
                        statusIcon = "fa-fire-burner";
                        break;
                    case 'entrega':
                        statusText = "SAIU PARA ENTREGA";
                        statusColor = "text-purple-600 bg-purple-50 border-purple-200";
                        statusIcon = "fa-motorcycle";
                        break;
                    case 'entregue':
                        statusText = "PEDIDO ENTREGUE";
                        statusColor = "text-green-600 bg-green-50 border-green-200";
                        statusIcon = "fa-check-circle";
                        break;
                    case 'recusado':
                    case 'cancelado':
                        statusText = "PEDIDO RECUSADO, RESTAURANTE FECHADO OU ITEM INDISPONÍVEL";
                        statusColor = "text-red-600 bg-red-50 border-red-200";
                        statusIcon = "fa-times-circle";
                        break;
                    default:
                        statusText = "AGUARDANDO ATUALIZAÇÃO";
                        statusColor = "text-gray-600 bg-gray-50 border-gray-200";
                        statusIcon = "fa-spinner fa-spin";
                }
                
                let itemsText = order.items.map(i => `${i.quantity}x ${i.name}`).join('%0A');
                let wppMsg = `Olá! Acabei de fazer o pedido #${docSnap.id.substring(0,6)} pelo cardápio.%0A*Itens:*%0A${itemsText}%0A*Endereço:* ${order.customer?.address}%0A*Total:* R$ ${(order.total||0).toFixed(2)}`;
                let wppLink = `https://wa.me/55${(state.publicTenant?.phone || '').replace(/\D/g,'')}?text=${wppMsg}`;

                container.innerHTML = `
                    <div class="min-h-screen bg-gray-50 flex flex-col items-center p-4 pt-10 fade-in">
                        <div class="w-full max-w-md bg-white rounded-3xl shadow-xl overflow-hidden border border-gray-100">
                            <div class="p-6 text-center border-b border-gray-100">
                                <h2 class="text-xl font-black text-gray-800">Status do Pedido</h2>
                                <p class="text-sm text-gray-500 font-mono mt-1">#${docSnap.id}</p>
                            </div>
                            
                            <div class="p-8 text-center flex flex-col items-center">
                                <div class="w-24 h-24 rounded-full flex items-center justify-center mb-6 text-5xl shadow-inner border-4 border-white ${statusColor.split(' ')[1]} ${statusColor.split(' ')[0]} status-icon">
                                    <i class="fas ${statusIcon}"></i>
                                </div>
                                <h3 class="text-lg font-black text-center mb-2 uppercase tracking-wide leading-tight ${statusColor.split(' ')[0]}">${statusText}</h3>
                                <p class="text-xs text-gray-500 mb-8 px-4 font-medium"><i class="fas fa-sync-alt fa-spin mr-1 text-gray-300"></i> Atualizando em tempo real...</p>
                                
                                <a href="${wppLink}" target="_blank" class="w-full bg-[#25D366] hover:bg-[#128C7E] text-white font-black py-4 rounded-xl transition shadow-lg shadow-green-500/30 flex items-center justify-center gap-2 mb-4">
                                    <i class="fab fa-whatsapp text-xl"></i> ENVIAR DETALHES DO MEU PEDIDO NO WHATSAPP
                                </a>
                                
                                <button onclick="window.location.hash='#/cardapio/${state.publicTenant?.slug}'" class="text-sm font-bold text-gray-500 hover:text-gray-800 py-2 transition">
                                    <i class="fas fa-arrow-left mr-1"></i> Voltar ao Cardápio
                                </button>
                            </div>
                        </div>
                    </div>
                `;
            });
        }

        // Initialize App
        setupRouter();
        initializeAppAuth();

    </script>
</body>
</html>
