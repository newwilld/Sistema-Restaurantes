<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WA Sistema de Vendas</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.css" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.js"></script>
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: {
                        brand: {
                            50: '#fef2f2',
                            100: '#fee2e2',
                            500: '#ef4444',
                            600: '#dc2626',
                            900: '#7f1d1d',
                            dark: '#111827'
                        }
                    }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Inter', sans-serif; -webkit-font-smoothing: antialiased; background-color: #f9fafb; }
        .fade-in { animation: fadeIn 0.3s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
        .hide-scroll::-webkit-scrollbar { display: none; }
        .hide-scroll { -ms-overflow-style: none; scrollbar-width: none; }
        .glass-panel { background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(10px); }
        .loader { border-radius: 50%; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .overlay { background-color: rgba(0, 0, 0, 0.5); backdrop-filter: blur(4px); }
        
        /* Ajuste para altura das imagens no mobile */
        @media (max-width: 768px) {
            .product-image-mobile {
                height: 250px !important;
            }
        }
        
        /* Estilos para o Cropper */
        .cropper-container {
            max-height: 400px;
        }
        
        .cropper-modal {
            background-color: #000;
            opacity: 0.5;
        }
        
        .cropper-view-box {
            border-radius: 8px;
            outline: 2px solid #ef4444;
        }
        
        .cropper-face {
            border-radius: 8px;
        }
    </style>
</head>
<body class="text-gray-800 antialiased overflow-x-hidden">

    <div id="app" class="min-h-screen w-full flex flex-col">
        <div class="flex-grow flex items-center justify-center">
            <div class="loader w-12 h-12 border-4 border-gray-200 border-t-brand-500"></div>
        </div>
    </div>
    
    <div id="modal-container"></div>
    <div id="toast-container" class="fixed top-4 right-4 z-50 flex flex-col gap-2 pointer-events-none"></div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut, onAuthStateChanged, updateProfile } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, getDoc, setDoc, collection, getDocs, updateDoc, deleteDoc, onSnapshot, query, where, serverTimestamp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCZyMVAn_F3me72l8N1PqKTfgnb0cQpUKA",
            authDomain: "sistema-restaurantes-6baf8.firebaseapp.com",
            projectId: "sistema-restaurantes-6baf8",
            storageBucket: "sistema-restaurantes-6baf8.firebasestorage.app",
            messagingSenderId: "753663577381",
            appId: "1:753663577381:web:9771b3c0004264b2745ecc",
            measurementId: "G-0B4Q7M2V5K"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);

        // App Secundário: Permite ao Super Admin criar contas de restaurantes sem deslogar
        const secondaryApp = initializeApp(firebaseConfig, "SecondaryApp");
        const secondaryAuth = getAuth(secondaryApp);

        const collections = {
            tenants: "saas_tenants",
            products: "saas_products",
            orders: "saas_orders"
        };

        const state = {
            currentUser: null,
            isSuperAdmin: false,
            currentTenant: null,
            
            viewingSlug: null,
            publicTenant: null,
            publicProducts: [],
            cart: [],
            
            adminProducts: [],
            adminOrders: [],

            superAdminTenants: [],
            superAdminOrders: [],
            
            isAppLoaded: false
        };

        function generateId() {
            return Math.random().toString(36).substring(2, 15);
        }

        window.showToast = function(message, type = 'success') {
            const toast = document.createElement('div');
            const bgColor = type === 'success' ? 'bg-gray-900' : 'bg-red-500';
            const icon = type === 'success' ? 'fa-check-circle text-green-400' : 'fa-exclamation-circle text-white';
            
            toast.className = `${bgColor} text-white px-6 py-3 rounded-xl shadow-2xl flex items-center gap-3 fade-in transform transition-all duration-300`;
            toast.innerHTML = `<i class="fas ${icon} text-xl"></i><span class="font-medium">${message}</span>`;
            
            document.getElementById('toast-container').appendChild(toast);
            setTimeout(() => {
                toast.style.opacity = '0';
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }

        window.openModal = function(htmlContent) {
            document.getElementById('modal-container').innerHTML = htmlContent;
        }

        window.closeModal = function() {
            document.getElementById('modal-container').innerHTML = '';
        }

        function setupRouter() {
            window.addEventListener('hashchange', handleRoute);
            handleRoute();
        }

        async function handleRoute() {
            const hash = window.location.hash;
            const appDiv = document.getElementById('app');

            if (!state.isAppLoaded) return;

            if (hash === '' || hash === '#/') {
                renderLanding(appDiv);
            } 
            else if (hash.startsWith('#/login')) {
                if (state.currentUser) {
                    window.location.hash = state.isSuperAdmin ? '#/superadmin' : '#/admin';
                } else {
                    renderAuth(appDiv);
                }
            } 
            else if (hash.startsWith('#/superadmin')) {
                if (!state.currentUser || !state.isSuperAdmin) {
                    window.location.hash = '#/login';
                } else {
                    renderSuperAdmin(appDiv, hash);
                }
            }
            else if (hash.startsWith('#/admin')) {
                if (!state.currentUser) {
                    window.location.hash = '#/login';
                } else if (state.isSuperAdmin) {
                    window.location.hash = '#/superadmin';
                } else {
                    renderAdmin(appDiv, hash);
                }
            } 
            else if (hash.startsWith('#/cardapio/')) {
                const slug = hash.split('/')[2];
                if (slug) {
                    state.viewingSlug = slug;
                    await loadPublicMenuData(slug);
                    renderPublicMenu(appDiv);
                } else {
                    window.location.hash = '#/';
                }
            }
            else {
                window.location.hash = '#/';
            }
        }

        async function initializeAppAuth() {
            onAuthStateChanged(auth, async (user) => {
                state.currentUser = user;
                if (user) {
                    state.isSuperAdmin = (user.email === 'willdalves1@gmail.com');

                    if (!state.isSuperAdmin) {
                        try {
                            const docRef = doc(db, collections.tenants, user.uid);
                            const docSnap = await getDoc(docRef);
                            if (docSnap.exists()) {
                                state.currentTenant = { id: docSnap.id, ...docSnap.data() };
                            } else {
                                state.currentTenant = null;
                            }
                        } catch (e) {
                            console.error("Erro ao carregar perfil da loja:", e);
                        }
                    }
                } else {
                    state.currentTenant = null;
                    state.isSuperAdmin = false;
                }
                
                if (!state.isAppLoaded) {
                    state.isAppLoaded = true;
                    handleRoute();
                } else {
                    handleRoute();
                }
            });
        }

        window.renderLanding = function(container) {
            container.innerHTML = `
                <div class="min-h-screen flex flex-col bg-white fade-in">
                    <header class="flex justify-between items-center p-6 lg:px-12 border-b border-gray-100 bg-white sticky top-0 z-50">
                        <div class="font-black text-2xl tracking-tighter flex items-center gap-2">
                            <div class="w-8 h-8 bg-brand-500 rounded-lg flex items-center justify-center text-white text-sm shadow-md shadow-brand-500/30">
                                <i class="fas fa-bolt"></i>
                            </div>
                            <span><span class="text-brand-500">WA</span> Vendas</span>
                        </div>
                        <nav>
                            <button onclick="window.location.hash='#/login'" class="font-semibold text-gray-600 hover:text-brand-500 mr-6 transition">Entrar</button>
                            <button onclick="window.location.hash='#/login?type=cliente&register=true'" class="bg-brand-dark text-white px-5 py-2.5 rounded-xl font-bold hover:bg-gray-800 transition shadow-lg">Começar Grátis</button>
                        </nav>
                    </header>

                    <main class="flex-grow flex flex-col items-center justify-center text-center px-4 py-20 bg-gradient-to-b from-gray-50 to-white">
                        <div class="inline-flex items-center gap-2 px-4 py-2 rounded-full bg-brand-50 text-brand-600 font-bold text-sm mb-8 border border-brand-100">
                            <span class="relative flex h-2.5 w-2.5">
                              <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-brand-400 opacity-75"></span>
                              <span class="relative inline-flex rounded-full h-2.5 w-2.5 bg-brand-500"></span>
                            </span>
                            Plataforma SaaS Completa
                        </div>
                        <h1 class="text-5xl md:text-7xl font-black text-gray-900 tracking-tight mb-6 max-w-4xl leading-tight">
                            O sistema de vendas do seu <span class="text-transparent bg-clip-text bg-gradient-to-r from-brand-500 to-orange-500">Restaurante</span>
                        </h1>
                        <p class="text-xl text-gray-500 mb-10 max-w-2xl font-medium">Cardápio digital, gestão de pedidos e recebimentos via PIX e Cartão. Tudo em uma única plataforma profissional.</p>
                        
                        <div class="flex flex-col sm:flex-row gap-4">
                            <button onclick="window.location.hash='#/login?type=cliente&register=true'" class="bg-brand-500 text-white px-8 py-4 rounded-xl font-bold text-lg hover:bg-brand-600 transition shadow-xl shadow-brand-500/30 flex items-center justify-center gap-2">
                                Criar minha Loja Agora <i class="fas fa-arrow-right"></i>
                            </button>
                            <button onclick="window.location.hash='#/cardapio/demo'" class="bg-white border-2 border-gray-200 text-gray-700 px-8 py-4 rounded-xl font-bold text-lg hover:border-gray-300 hover:bg-gray-50 transition flex items-center justify-center gap-2">
                                <i class="fas fa-mobile-alt text-brand-500"></i> Ver Cardápio Demo
                            </button>
                        </div>

                        <div class="mt-20 w-full max-w-5xl">
                            <div class="grid grid-cols-1 md:grid-cols-3 gap-8 text-left">
                                <div class="bg-white p-8 rounded-2xl shadow-sm border border-gray-100">
                                    <div class="w-12 h-12 bg-red-50 text-brand-500 rounded-xl flex items-center justify-center text-xl mb-6"><i class="fas fa-hamburger"></i></div>
                                    <h3 class="text-xl font-bold mb-3">Cardápio Digital Lindo</h3>
                                    <p class="text-gray-500 text-sm leading-relaxed">Mostre seus produtos com fotos incríveis, variações e adicionais. Seus clientes vão comprar com os olhos.</p>
                                </div>
                                <div class="bg-white p-8 rounded-2xl shadow-sm border border-gray-100">
                                    <div class="w-12 h-12 bg-green-50 text-green-500 rounded-xl flex items-center justify-center text-xl mb-6"><i class="fas fa-motorcycle"></i></div>
                                    <h3 class="text-xl font-bold mb-3">Gestão de Pedidos</h3>
                                    <p class="text-gray-500 text-sm leading-relaxed">Receba os pedidos direto no painel com alertas sonoros. Acompanhe do preparo até a entrega.</p>
                                </div>
                                <div class="bg-white p-8 rounded-2xl shadow-sm border border-gray-100">
                                    <div class="w-12 h-12 bg-blue-50 text-blue-500 rounded-xl flex items-center justify-center text-xl mb-6"><i class="fas fa-qrcode"></i></div>
                                    <h3 class="text-xl font-bold mb-3">Pagamento Facilitado</h3>
                                    <p class="text-gray-500 text-sm leading-relaxed">Integração nativa para pagamentos. Dinheiro direto na sua conta sem taxas abusivas de aplicativos de terceiros.</p>
                                </div>
                            </div>
                        </div>
                    </main>
                </div>
            `;
        }

        window.renderAuth = function(container) {
            const urlParams = new URLSearchParams(window.location.hash.split('?')[1]);
            const isRegister = urlParams.get('register') === 'true';
            window.authTab = urlParams.get('type') === 'admin' ? 'admin' : 'cliente'; 
            renderAuthUI(container, isRegister);
        }

        window.renderAuthUI = function(container, isRegister) {
            const isAdmin = window.authTab === 'admin';

            container.innerHTML = `
                <div class="min-h-screen flex items-center justify-center bg-gray-50 p-4 fade-in">
                    <div class="bg-white p-8 sm:p-12 rounded-3xl shadow-2xl w-full max-w-md border border-gray-100 relative overflow-hidden">
                        <div class="absolute top-0 left-0 w-full h-2 bg-gradient-to-r ${isAdmin ? 'from-purple-600 to-blue-600' : 'from-brand-500 to-orange-500'}"></div>
                        <div class="text-center mb-8">
                            <div class="inline-flex items-center justify-center w-16 h-16 rounded-2xl ${isAdmin ? 'bg-purple-50 text-purple-600' : 'bg-red-50 text-brand-600'} mb-4 shadow-inner">
                                <i class="fas ${isAdmin ? 'fa-shield-alt' : 'fa-store'} text-2xl"></i>
                            </div>
                            <h2 class="text-2xl font-bold text-gray-800">${isAdmin ? 'Acesso Administrativo' : (isRegister ? 'Crie seu Restaurante' : 'Painel do Restaurante')}</h2>
                            <p class="text-gray-500 text-sm mt-1">${isAdmin ? 'Gestão da Plataforma WA Vendas.' : (isRegister ? 'Inicie seu teste gratuito e monte seu cardápio.' : 'Gerencie suas vendas e cardápio.')}</p>
                        </div>

                        <div class="flex p-1 bg-gray-100 rounded-xl mb-8">
                            <button onclick="window.authTab='cliente'; renderAuthUI(document.getElementById('app'), false)" class="flex-1 py-2 text-sm font-bold rounded-lg transition ${!isAdmin ? 'bg-white shadow-sm text-brand-600' : 'text-gray-500 hover:text-gray-800'}">Sou Lojista</button>
                            <button onclick="window.authTab='admin'; renderAuthUI(document.getElementById('app'), false)" class="flex-1 py-2 text-sm font-bold rounded-lg transition ${isAdmin ? 'bg-white shadow-sm text-purple-600' : 'text-gray-500 hover:text-gray-800'}">Administrador</button>
                        </div>

                        <form id="auth-form" class="space-y-4" onsubmit="handleAuthSubmit(event, ${isRegister && !isAdmin}, ${isAdmin})">
                            ${(isRegister && !isAdmin) ? `
                                <div>
                                    <label class="block text-sm font-bold text-gray-700 mb-1">Nome do Estabelecimento</label>
                                    <input type="text" id="restaurant-name" required class="w-full px-4 py-3 rounded-xl border border-gray-300 focus:ring-2 focus:ring-brand-500 focus:border-brand-500 outline-none transition bg-gray-50 focus:bg-white">
                                </div>
                                <div>
                                    <label class="block text-sm font-bold text-gray-700 mb-1">Link do Cardápio</label>
                                    <div class="flex shadow-sm rounded-xl overflow-hidden border border-gray-300 focus-within:ring-2 focus-within:ring-brand-500 transition">
                                        <span class="inline-flex items-center px-3 bg-gray-100 text-gray-500 text-sm font-mono border-r border-gray-200">wa.com/</span>
                                        <input type="text" id="restaurant-slug" placeholder="sua-loja" required class="flex-1 min-w-0 block w-full px-3 py-3 font-mono text-sm outline-none bg-gray-50 focus:bg-white" onkeyup="this.value = this.value.toLowerCase().replace(/[^a-z0-9-]/g, '')">
                                    </div>
                                </div>
                            ` : ''}
                            
                            <div>
                                <label class="block text-sm font-bold text-gray-700 mb-1">E-mail</label>
                                <div class="relative">
                                    <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-gray-400"><i class="fas fa-envelope"></i></div>
                                    <input type="email" id="email" required placeholder="seu@email.com" class="w-full pl-11 pr-4 py-3 rounded-xl border border-gray-300 focus:ring-2 focus:ring-${isAdmin ? 'purple' : 'brand'}-500 outline-none transition bg-gray-50 focus:bg-white">
                                </div>
                            </div>
                            
                            <div>
                                <label class="block text-sm font-bold text-gray-700 mb-1">Senha</label>
                                <div class="relative">
                                    <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-gray-400"><i class="fas fa-lock"></i></div>
                                    <input type="password" id="password" required placeholder="••••••••" class="w-full pl-11 pr-4 py-3 rounded-xl border border-gray-300 focus:ring-2 focus:ring-${isAdmin ? 'purple' : 'brand'}-500 outline-none transition bg-gray-50 focus:bg-white">
                                </div>
                            </div>

                            <button type="submit" id="auth-btn" class="w-full ${isAdmin ? 'bg-purple-600 hover:bg-purple-700 shadow-purple-500/30' : 'bg-brand-500 hover:bg-brand-600 shadow-brand-500/30'} text-white font-bold py-3.5 rounded-xl transition shadow-lg flex justify-center items-center mt-2">
                                ${isAdmin ? 'Entrar no Painel WA' : (isRegister ? 'Criar Loja e Começar' : 'Acessar meu Restaurante')}
                            </button>
                        </form>

                        ${!isAdmin ? `
                        <div class="mt-6 text-center text-sm text-gray-600 font-medium">
                            ${isRegister ? 
                                `Já tem sua loja? <a href="javascript:void(0)" onclick="renderAuthUI(document.getElementById('app'), false)" class="text-brand-600 hover:underline">Fazer Login</a>` : 
                                `Ainda não é parceiro? <a href="javascript:void(0)" onclick="renderAuthUI(document.getElementById('app'), true)" class="text-brand-600 hover:underline">Cadastre-se</a>`
                            }
                        </div>
                        ` : `
                        <div class="mt-6 text-center text-xs text-gray-400">
                            Acesso restrito à equipe administrativa WA Vendas.
                        </div>
                        `}
                    </div>
                </div>
            `;
        }

        window.handleAuthSubmit = async function(event, isRegister, isAdmin) {
            event.preventDefault();
            const btn = document.getElementById('auth-btn');
            const originalText = btn.innerHTML;
            btn.innerHTML = '<div class="loader w-5 h-5 border-2 border-white border-t-transparent mx-auto"></div>';
            btn.disabled = true;

            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            try {
                if (isRegister && !isAdmin) {
                    const name = document.getElementById('restaurant-name').value;
                    const slug = document.getElementById('restaurant-slug').value;
                    
                    if(slug.length < 3) throw new Error("Link deve ter pelo menos 3 caracteres.");

                    const userCreds = await createUserWithEmailAndPassword(auth, email, password);
                    await updateProfile(userCreds.user, { displayName: name });
                    
                    await setDoc(doc(db, collections.tenants, userCreds.user.uid), {
                        name: name,
                        slug: slug,
                        email: email,
                        status: 'active',
                        plan: 'trial',
                        createdAt: serverTimestamp(),
                        settings: {
                            open: true,
                            minOrder: 0,
                            primaryColor: '#ef4444',
                            coverImage: '',
                            profileImage: ''
                        }
                    });
                    showToast('Restaurante criado com sucesso! Bem-vindo(a).');
                } else {
                    await signInWithEmailAndPassword(auth, email, password);
                    if (isAdmin && email !== 'willdalves1@gmail.com') {
                        throw new Error("Acesso administrativo negado.");
                    }
                    showToast('Acesso liberado.');
                }
            } catch (error) {
                console.error(error);
                let msg = error.message;
                if(error.code === 'auth/email-already-in-use') msg = "E-mail já cadastrado.";
                if(error.code === 'auth/invalid-credential') msg = "E-mail ou senha incorretos.";
                showToast(msg, 'error');
                btn.innerHTML = originalText;
                btn.disabled = false;
            }
        }

        window.doLogout = async function() {
            await signOut(auth);
            state.currentUser = null;
            state.currentTenant = null;
            state.isSuperAdmin = false;
            window.location.hash = '#/';
        }

        async function loadSuperAdminData() {
            if (!state.isSuperAdmin) return;
            const tenantsSnap = await getDocs(collection(db, collections.tenants));
            state.superAdminTenants = tenantsSnap.docs.map(d => ({ id: d.id, ...d.data() }));
            
            const contentDiv = document.getElementById('superadmin-content');
            if (contentDiv) {
                contentDiv.innerHTML = getSuperAdminContent(window.location.hash.split('/')[2] || 'dashboard');
            }
        }

        window.renderSuperAdmin = function(container, hash) {
            loadSuperAdminData();
            const subRoute = hash.split('/')[2] || 'dashboard';

            container.innerHTML = `
                <div class="flex h-screen bg-gray-50 fade-in text-sm">
                    <aside class="w-64 bg-[#0f172a] text-white flex flex-col border-r border-gray-800">
                        <div class="p-6">
                            <div class="font-black text-xl flex items-center gap-2 mb-1"><i class="fas fa-shield-alt text-purple-500"></i> WA Admin</div>
                            <div class="text-xs text-gray-400 uppercase tracking-widest font-bold">Plataforma SaaS</div>
                        </div>
                        <nav class="flex-grow px-4 space-y-1 mt-4">
                            <a href="#/superadmin/dashboard" class="flex items-center gap-3 px-4 py-3 rounded-xl transition ${subRoute === 'dashboard' ? 'bg-purple-600 text-white font-bold' : 'text-gray-400 hover:bg-gray-800 hover:text-white'}">
                                <i class="fas fa-chart-pie w-5"></i> Dashboard
                            </a>
                            <a href="#/superadmin/restaurantes" class="flex items-center gap-3 px-4 py-3 rounded-xl transition ${subRoute === 'restaurantes' ? 'bg-purple-600 text-white font-bold' : 'text-gray-400 hover:bg-gray-800 hover:text-white'}">
                                <i class="fas fa-store w-5"></i> Lojistas
                            </a>
                        </nav>
                        <div class="p-4"><button onclick="doLogout()" class="w-full py-3 text-red-400 hover:bg-red-500/10 rounded-xl font-bold"><i class="fas fa-power-off"></i> Sair</button></div>
                    </aside>
                    <main class="flex-grow flex flex-col overflow-hidden">
                        <header class="h-16 bg-white border-b px-8 flex items-center justify-between shrink-0 shadow-sm z-10">
                            <h2 class="text-lg font-bold text-gray-800"><i class="fas ${subRoute === 'dashboard' ? 'fa-chart-pie' : 'fa-store'} text-purple-600 mr-2"></i> ${subRoute === 'dashboard' ? 'Visão Geral' : 'Gestão de Lojistas'}</h2>
                            <div class="bg-purple-50 text-purple-700 px-3 py-1 rounded-full font-bold text-xs border border-purple-100 flex items-center gap-2">
                                <span class="relative flex h-2 w-2"><span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-purple-400 opacity-75"></span><span class="relative inline-flex rounded-full h-2 w-2 bg-purple-600"></span></span>
                                Sistema Online
                            </div>
                        </header>
                        <div class="flex-grow p-8 overflow-y-auto" id="superadmin-content">
                            <div class="flex justify-center h-full items-center"><div class="loader w-8 h-8 border-4 border-gray-200 border-t-purple-600"></div></div>
                        </div>
                    </main>
                </div>
            `;
        }

        function getSuperAdminContent(route) {

        window.submitAdminCreateTenant = async function(e) {
            e.preventDefault();
            const btn = document.getElementById('btn-create-tenant');
            btn.innerHTML = '<div class="loader w-4 h-4 border-2 border-white border-t-transparent mx-auto"></div>';
            btn.disabled = true;

            const name = document.getElementById('new-t-name').value;
            const slug = document.getElementById('new-t-slug').value.toLowerCase();
            const email = document.getElementById('new-t-email').value;
            const pass = document.getElementById('new-t-pass').value;

            try {
                const { createUserWithEmailAndPassword: createUserSecondary, updateProfile: updateProfileSecondary, signOut: signOutSecondary } = await import("https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js");
                
                const userCreds = await createUserSecondary(secondaryAuth, email, pass);
                await updateProfileSecondary(userCreds.user, { displayName: name });
                
                await setDoc(doc(db, collections.tenants, userCreds.user.uid), {
                    name: name,
                    slug: slug,
                    email: email,
                    status: 'active',
                    plan: 'trial',
                    createdAt: serverTimestamp(),
                    settings: { 
                        open: true, 
                        minOrder: 0, 
                        primaryColor: '#ef4444',
                        coverImage: '',
                        profileImage: ''
                    }
                });

                await signOutSecondary(secondaryAuth);

                showToast('Lojista criado com sucesso!');
                closeModal();
                loadSuperAdminData();
            } catch (error) {
                showToast('Erro: ' + error.message, 'error');
                btn.innerHTML = 'Criar Conta';
                btn.disabled = false;
            }
        }

        async function loadAdminData() {
            if (!state.currentTenant) return;
            const q = query(collection(db, collections.products), where("tenantId", "==", state.currentTenant.id));
            const snap = await getDocs(q);
            state.adminProducts = snap.docs.map(d => ({ id: d.id, ...d.data() }));
            
            const oq = query(collection(db, collections.orders), where("tenantId", "==", state.currentTenant.id));
            const osnap = await getDocs(oq);
            state.adminOrders = osnap.docs.map(d => ({ id: d.id, ...d.data() })).sort((a,b) => b.createdAt - a.createdAt);

            const contentDiv = document.getElementById('admin-content');
            if (contentDiv) contentDiv.innerHTML = getAdminContent(window.location.hash.split('/')[2] || 'dashboard');
        }

        window.openImageEditor = function(type) {

            const html = `

                            </div>
                            <div id="image-preview-container" class="mb-4 ${currentImage ? '' : 'hidden'}">

                            </div>
                        </div>
                    </div>
                </div>
            `;
            openModal(html);
            
            // Configurar listeners para inputs
            setTimeout(() => {
                const fileInput = document.getElementById('image-file-input');
                const urlInput = document.getElementById('image-url-input');
                const preview = document.getElementById('image-preview');
                const previewContainer = document.getElementById('image-preview-container');
                
                fileInput.addEventListener('change', function(e) {
                    const file = e.target.files[0];
                    if (file) {
                        const reader = new FileReader();
                        reader.onload = function(event) {
                            const dataUrl = event.target.result;
                            urlInput.value = dataUrl;
                            preview.src = dataUrl;
                            previewContainer.classList.remove('hidden');
                        };
                        reader.readAsDataURL(file);
                    }
                });
                
                urlInput.addEventListener('input', function() {
                    if (urlInput.value) {
                        preview.src = urlInput.value;
                        previewContainer.classList.remove('hidden');
                    } else {
                        previewContainer.classList.add('hidden');
                    }
                });
            }, 100);
        }

        window.saveImage = async function(type) {
            const urlInput = document.getElementById('image-url-input');
            const imageUrl = urlInput.value.trim();
            
            if (!imageUrl) {
                showToast('Por favor, insira uma URL ou selecione uma imagem.', 'error');

            try {
                const tenantRef = doc(db, collections.tenants, state.currentTenant.id);
                
                if (type === 'profile') {
                    await updateDoc(tenantRef, {
                        'settings.profileImage': imageUrl
                    });
                    state.currentTenant.settings.profileImage = imageUrl;
                    showToast('Foto do perfil atualizada!');
                } else {
                    await updateDoc(tenantRef, {
                        'settings.coverImage': imageUrl
                    });
                    state.currentTenant.settings.coverImage = imageUrl;
                    showToast('Foto do topo atualizada!');
                }
                
                closeModal();
                loadAdminData();
            } catch (error) {
                showToast('Erro ao salvar imagem: ' + error.message, 'error');

        window.saveProduct = async function(e) {
            e.preventDefault();
            const btn = document.getElementById('btn-save-prod');

            const prod = {
                tenantId: state.currentTenant.id,
                name: document.getElementById('prod-name').value,

                price: parseFloat(document.getElementById('prod-price').value),
                image: document.getElementById('prod-image').value,
                active: true,
                createdAt: Date.now()
            };

            try {
                const docRef = doc(collection(db, collections.products));
                await setDoc(docRef, prod);
                showToast('Produto adicionado!');
                closeModal();
                loadAdminData();
            } catch (err) {
                showToast('Erro ao salvar.', 'error');
                btn.disabled = false; btn.innerHTML = 'Salvar Produto';
            }
        }

        window.openProductEditor = function(productId) {
            const product = state.adminProducts.find(p => p.id === productId);
            if (!product) return;
            
            const html = `
                <div class="fixed inset-0 z-50 flex items-center justify-center p-4 overlay fade-in">
                    <div class="bg-white rounded-3xl shadow-2xl w-full max-w-lg overflow-hidden flex flex-col max-h-[90vh]">
                        <div class="p-6 border-b flex justify-between items-center">
                            <h3 class="font-bold text-gray-800 text-lg">
                                <i class="fas fa-edit text-brand-500 mr-2"></i>
                                Editar Produto
                            </h3>
                            <button onclick="closeModal()" class="text-gray-400 hover:text-gray-800 text-xl leading-none">&times;</button>
                        </div>
                        <div class="p-6 overflow-y-auto flex-grow">
                            <form class="space-y-4" onsubmit="updateProduct(event, '${productId}')">
                                <div>
                                    <label class="block text-xs font-bold text-gray-700 mb-1">Nome do Produto</label>
                                    <input type="text" id="edit-prod-name" value="${product.name}" required class="w-full px-4 py-2.5 bg-gray-50 border border-gray-300 rounded-xl outline-none focus:border-brand-500">
                                </div>
                                <div>
                                    <label class="block text-xs font-bold text-gray-700 mb-1">Descrição</label>
                                    <textarea id="edit-prod-desc" rows="3" class="w-full px-4 py-2.5 bg-gray-50 border border-gray-300 rounded-xl outline-none focus:border-brand-500 resize-none">${product.description || ''}</textarea>
                                </div>
                                <div>
                                    <label class="block text-xs font-bold text-gray-700 mb-1">Preço (R$)</label>
                                    <input type="number" id="edit-prod-price" value="${product.price}" required step="0.01" min="0" class="w-full px-4 py-2.5 bg-gray-50 border border-gray-300 rounded-xl outline-none focus:border-brand-500">
                                </div>
                                <div>
                                    <label class="block text-xs font-bold text-gray-700 mb-1">URL da Imagem</label>
                                    <input type="url" id="edit-prod-image" value="${product.image || ''}" placeholder="https://" class="w-full px-4 py-2.5 bg-gray-50 border border-gray-300 rounded-xl outline-none focus:border-brand-500">
                                </div>
                                <div>
                                    <label class="block text-xs font-bold text-gray-700 mb-1">Ou envie do dispositivo</label>
                                    <input type="file" id="edit-prod-image-file" accept="image/*" class="w-full px-4 py-2.5 bg-gray-50 border border-gray-300 rounded-xl outline-none focus:border-brand-500">
                                </div>
                                <div id="edit-prod-image-preview" class="${product.image ? '' : 'hidden'}">
                                    <img id="edit-prod-image-preview-img" src="${product.image || ''}" class="w-full h-40 object-cover rounded-xl border border-gray-200">
                                </div>
                                <div class="mb-4">
                                    <button type="button" onclick="openCropper('edit-prod-image', 'edit-prod-image-preview-img')" class="w-full py-2 bg-blue-50 text-blue-600 font-bold rounded-xl hover:bg-blue-100 transition text-sm">
                                        <i class="fas fa-crop-alt mr-2"></i>Recortar Imagem
                                    </button>
                                </div>
                                <div class="mt-6 flex gap-3">
                                    <button type="button" onclick="closeModal()" class="flex-1 py-3 rounded-xl bg-gray-100 text-gray-600 font-bold hover:bg-gray-200">Cancelar</button>
                                    <button type="submit" id="btn-update-prod" class="flex-1 py-3 rounded-xl bg-brand-500 text-white font-bold hover:bg-brand-600 shadow-lg shadow-brand-500/30">Salvar Alterações</button>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            `;
            openModal(html);
            
            setTimeout(() => {
                const fileInput = document.getElementById('edit-prod-image-file');
                const urlInput = document.getElementById('edit-prod-image');
                const preview = document.getElementById('edit-prod-image-preview');
                const previewImg = document.getElementById('edit-prod-image-preview-img');
                
                fileInput.addEventListener('change', function(e) {
                    const file = e.target.files[0];
                    if (file) {
                        const reader = new FileReader();
                        reader.onload = function(event) {
                            const dataUrl = event.target.result;
                            urlInput.value = dataUrl;
                            previewImg.src = dataUrl;
                            preview.classList.remove('hidden');
                        };
                        reader.readAsDataURL(file);
                    }
                });
                
                urlInput.addEventListener('input', function() {
                    if (urlInput.value) {
                        previewImg.src = urlInput.value;
                        preview.classList.remove('hidden');
                    } else {
                        preview.classList.add('hidden');
                    }
                });
            }, 100);
        }

        window.updateProduct = async function(e, productId) {
            e.preventDefault();
            const btn = document.getElementById('btn-update-prod');
            btn.disabled = true; btn.innerHTML = 'Salvando...';

            const updatedProduct = {
                name: document.getElementById('edit-prod-name').value,
                description: document.getElementById('edit-prod-desc').value,
                price: parseFloat(document.getElementById('edit-prod-price').value),
                image: document.getElementById('edit-prod-image').value
            };

            try {
                await updateDoc(doc(db, collections.products, productId), updatedProduct);
                showToast('Produto atualizado!');
                closeModal();
                loadAdminData();
            } catch (err) {
                showToast('Erro ao atualizar produto.', 'error');
                btn.disabled = false; btn.innerHTML = 'Salvar Alterações';
            }
        }

        window.openCropper = function(inputId, previewId) {
            const imageUrl = document.getElementById(inputId).value;
            if (!imageUrl) {
                showToast('Por favor, insira uma imagem primeiro.', 'error');
                return;
            }
            
            const html = `
                <div class="fixed inset-0 z-[60] flex items-center justify-center p-4 bg-black bg-opacity-75 fade-in">
                    <div class="bg-white rounded-3xl shadow-2xl w-full max-w-2xl overflow-hidden flex flex-col">
                        <div class="p-6 border-b flex justify-between items-center">
                            <h3 class="font-bold text-gray-800 text-lg">
                                <i class="fas fa-crop-alt text-brand-500 mr-2"></i>
                                Recortar Imagem
                            </h3>
                            <button onclick="closeCropper()" class="text-gray-400 hover:text-gray-800 text-xl leading-none">&times;</button>
                        </div>
                        <div class="p-6">
                            <div class="mb-4">
                                <img id="cropper-image" src="${imageUrl}" class="w-full max-h-[400px] object-contain">
                            </div>
                            <div class="flex gap-3">
                                <button onclick="closeCropper()" class="flex-1 py-3 rounded-xl bg-gray-100 text-gray-600 font-bold hover:bg-gray-200">Cancelar</button>
                                <button onclick="applyCrop('${inputId}', '${previewId}')" class="flex-1 py-3 rounded-xl bg-brand-500 text-white font-bold hover:bg-brand-600 shadow-lg shadow-brand-500/30">Aplicar Corte</button>
                            </div>
                        </div>
                    </div>
                </div>
            `;
            
            const modalContainer = document.getElementById('modal-container');
            modalContainer.innerHTML = html;
            
            setTimeout(() => {
                const image = document.getElementById('cropper-image');
                if (typeof Cropper !== 'undefined') {
                    window.cropperInstance = new Cropper(image, {
                        aspectRatio: 16 / 9,
                        viewMode: 1,
                        autoCropArea: 0.8,
                        responsive: true,
                        background: false
                    });
                } else {
                    showToast('Biblioteca de recorte não carregada.', 'error');
                }
            }, 100);
        }

        window.closeCropper = function() {
            if (window.cropperInstance) {
                window.cropperInstance.destroy();
                window.cropperInstance = null;
            }
            // Reabrir o modal de edição do produto
            const currentHash = window.location.hash;
            handleRoute();
        }

        window.applyCrop = function(inputId, previewId) {
            if (!window.cropperInstance) return;
            
            const canvas = window.cropperInstance.getCroppedCanvas({
                width: 800,
                height: 450,
                imageSmoothingEnabled: true,
                imageSmoothingQuality: 'high'
            });
            
            const croppedDataUrl = canvas.toDataURL('image/jpeg', 0.9);
            
            // Atualizar o input e preview
            const input = document.getElementById(inputId);
            const preview = document.getElementById(previewId);
            const previewContainer = preview.parentElement;
            
            input.value = croppedDataUrl;
            preview.src = croppedDataUrl;
            previewContainer.classList.remove('hidden');
            
            // Fechar o cropper
            window.cropperInstance.destroy();
            window.cropperInstance = null;
            
            // Reabrir o modal de edição
            const currentHash = window.location.hash;
            handleRoute();
            
            showToast('Imagem recortada com sucesso!');
        }

        window.deleteProduct = async function(id) {
            if(confirm("Tem certeza que deseja excluir este produto?")) {
                await deleteDoc(doc(db, collections.products, id));
                showToast("Produto excluído.");
                loadAdminData();
            }
        }

        function renderAdminOrders() {
            return `
                <h3 class="font-bold text-gray-800 text-lg mb-6">Histórico de Pedidos</h3>
                <div class="bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden">
                    <table class="w-full text-left">
                        <thead class="bg-gray-50 text-xs uppercase text-gray-500 font-bold border-b border-gray-100">
                            <tr>
                                <th class="p-4">Cliente</th>
                                <th class="p-4">Itens</th>
                                <th class="p-4">Total</th>
                                <th class="p-4">Status</th>
                            </tr>
                        </thead>
                        <tbody class="divide-y divide-gray-100 text-sm">
                            ${state.adminOrders.map(o => `
                                <tr class="hover:bg-gray-50">
                                    <td class="p-4 font-bold text-gray-800">
                                        ${o.customer.name}<br>
                                        <span class="text-xs text-gray-400 font-normal">${o.customer.phone}</span>
                                    </td>
                                    <td class="p-4 text-gray-600">${o.items.length} itens</td>
                                    <td class="p-4 font-black text-brand-600">${o.total.toLocaleString('pt-BR', {style: 'currency', currency: 'BRL'})}</td>
                                    <td class="p-4"><span class="px-2 py-1 bg-yellow-100 text-yellow-700 rounded text-xs font-bold border border-yellow-200 uppercase">${o.status}</span></td>
                                </tr>
                            `).join('')}
                            ${state.adminOrders.length === 0 ? `<tr><td colspan="4" class="p-8 text-center text-gray-400">Nenhum pedido recebido.</td></tr>` : ''}
                        </tbody>
                    </table>
                </div>
            `;
        }

        async function loadPublicMenuData(slug) {
            const q = query(collection(db, collections.tenants), where("slug", "==", slug));
            const snap = await getDocs(q);
            if (snap.empty) {
                state.publicTenant = null;
                return;
            }
            state.publicTenant = { id: snap.docs[0].id, ...snap.docs[0].data() };

            const pq = query(collection(db, collections.products), where("tenantId", "==", state.publicTenant.id));
            const psnap = await getDocs(pq);
            state.publicProducts = psnap.docs.map(d => ({ id: d.id, ...d.data() }));
        }

        window.renderPublicMenu = function(container) {
            if (!state.publicTenant) {
                container.innerHTML = `<div class="min-h-screen flex items-center justify-center flex-col"><i class="fas fa-store-slash text-4xl text-gray-300 mb-4"></i><h2 class="text-xl font-bold">Restaurante não encontrado.</h2><a href="#/" class="text-brand-500 mt-4 font-bold">Voltar</a></div>`;
                return;
            }

            const t = state.publicTenant;
            const coverImage = t.settings?.coverImage || '';
            const profileImage = t.settings?.profileImage || '';
            
            container.innerHTML = `
                <div class="min-h-screen bg-gray-50 pb-24 text-sm fade-in">
                    <!-- Banner & Header -->
                    <div class="h-48 bg-gradient-to-r from-gray-800 to-gray-900 relative" style="${coverImage ? `background-image: url('${coverImage}'); background-size: cover; background-position: center;` : ''}">
                        <div class="absolute inset-0 bg-black/20"></div>
                        <div class="absolute -bottom-10 left-4 md:left-12 flex items-end gap-4">
                            <div class="w-24 h-24 bg-white rounded-2xl shadow-lg border-4 border-white flex items-center justify-center text-3xl font-black text-brand-500 uppercase overflow-hidden" style="${profileImage ? `background-image: url('${profileImage}'); background-size: cover; background-position: center;` : ''}">
                                ${profileImage ? '' : t.name.charAt(0)}
                            </div>
                            <div class="mb-2">
                                <h1 class="text-2xl font-black text-white drop-shadow-md">${t.name}</h1>
                                <span class="px-2 py-0.5 bg-green-500 text-white rounded text-xs font-bold shadow uppercase tracking-wider">Aberto</span>
                            </div>
                        </div>
                    </div>

                    <div class="pt-16 px-4 md:px-12 max-w-5xl mx-auto">
                        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6" id="public-products">
                            ${state.publicProducts.map(p => `
                                <div class="bg-white rounded-2xl overflow-hidden shadow-sm border border-gray-100 group hover:shadow-md transition">
                                    <div class="product-image-mobile h-40 md:h-40 lg:h-40 bg-gray-100 bg-cover bg-center" style="background-image: url('${p.image || 'https://placehold.co/400x300/eeeeee/999999?text=Sem+Foto'}')"></div>
                                    <div class="p-4 flex flex-col h-full">
                                        <h3 class="font-bold text-gray-800 text-lg mb-1 leading-tight">${p.name}</h3>
                                        <p class="text-xs text-gray-500 mb-4 line-clamp-2">${p.description}</p>
                                        <div class="mt-auto flex justify-between items-center">
                                            <span class="font-black text-brand-600 text-lg">${p.price.toLocaleString('pt-BR', {style: 'currency', currency: 'BRL'})}</span>
                                            <button onclick="addToCart('${p.id}')" class="bg-brand-50 text-brand-600 hover:bg-brand-500 hover:text-white w-10 h-10 rounded-xl flex items-center justify-center font-bold transition">
                                                <i class="fas fa-plus"></i>
                                            </button>
                                        </div>
                                    </div>
                                </div>
                            `).join('')}
                            ${state.publicProducts.length === 0 ? `<div class="col-span-full py-12 text-center text-gray-500">Este restaurante ainda não possui itens no cardápio.</div>` : ''}
                        </div>
                    </div>

                    <!-- Botão Carrinho Fixo Mobile -->
                    <div class="fixed bottom-0 left-0 w-full p-4 bg-white border-t border-gray-200 shadow-[0_-10px_40px_rgba(0,0,0,0.05)] z-40 transform transition-transform duration-300 ${state.cart.length > 0 ? 'translate-y-0' : 'translate-y-full'}">
                        <div class="max-w-5xl mx-auto flex gap-4">
                            <button onclick="renderCart()" class="w-full bg-brand-500 text-white font-bold py-4 rounded-xl shadow-lg shadow-brand-500/30 flex justify-between items-center px-6">
                                <span class="flex items-center gap-2"><div class="w-6 h-6 bg-white/20 rounded-full flex items-center justify-center text-xs" id="cart-count">${state.cart.length}</div> Ver Carrinho</span>
                                <span id="cart-total-btn">R$ 0,00</span>
                            </button>
                        </div>
                    </div>
                </div>
            `;
            updateCartTotal();
        }

        window.addToCart = function(productId) {
            const product = state.publicProducts.find(p => p.id === productId);
            if (!product) return;
            
            const existing = state.cart.find(item => item.product.id === productId);
            if (existing) {
                existing.quantity++;
            } else {
                state.cart.push({ product, quantity: 1 });
            }
            
            showToast(`${product.name} adicionado!`);
            updateCartTotal();
            
            if(state.cart.length === 1) handleRoute(); 
        }

        function updateCartTotal() {
            const total = state.cart.reduce((sum, item) => sum + (item.product.price * item.quantity), 0);
            const btnTotal = document.getElementById('cart-total-btn');
            const count = document.getElementById('cart-count');
            if(btnTotal) btnTotal.innerText = total.toLocaleString('pt-BR', {style: 'currency', currency: 'BRL'});
            if(count) count.innerText = state.cart.reduce((sum, item) => sum + item.quantity, 0);
        }

        window.renderCart = function() {
            const total = state.cart.reduce((sum, item) => sum + (item.product.price * item.quantity), 0);
            
            const html = `
                <div class="fixed inset-0 z-50 flex justify-end overlay fade-in">
                    <div class="bg-white w-full max-w-md h-full flex flex-col shadow-2xl slide-left">
                        <div class="p-6 border-b flex justify-between items-center bg-gray-50">
                            <h3 class="font-black text-gray-800 text-xl"><i class="fas fa-shopping-bag text-brand-500 mr-2"></i> Seu Pedido</h3>
                            <button onclick="closeModal()" class="w-8 h-8 bg-white border rounded-full text-gray-500 hover:text-gray-800 flex items-center justify-center shadow-sm">&times;</button>
                        </div>
                        
                        <div class="flex-grow overflow-y-auto p-6 space-y-4">
                            ${state.cart.map((item, index) => `
                                <div class="flex justify-between items-center pb-4 border-b border-gray-100 last:border-0">
                                    <div class="flex gap-3 items-center">
                                        <div class="font-bold text-gray-800">${item.quantity}x</div>
                                        <div>
                                            <p class="font-bold text-gray-800">${item.product.name}</p>
                                            <p class="text-brand-600 font-bold text-xs">${(item.product.price * item.quantity).toLocaleString('pt-BR', {style: 'currency', currency: 'BRL'})}</p>
                                        </div>
                                    </div>
                                    <button onclick="state.cart.splice(${index}, 1); updateCartTotal(); renderCart();" class="text-red-400 hover:text-red-600 p-2"><i class="fas fa-trash"></i></button>
                                </div>
                            `).join('')}
                            ${state.cart.length === 0 ? `<div class="text-center text-gray-400 mt-10"><i class="fas fa-shopping-cart text-4xl mb-3 opacity-20"></i><p>Seu carrinho está vazio.</p></div>` : ''}
                        </div>

                        ${state.cart.length > 0 ? `
                        <div class="p-6 border-t bg-gray-50">
                            <div class="flex justify-between items-center mb-6 text-lg">
                                <span class="font-bold text-gray-600">Total</span>
                                <span class="font-black text-gray-900">${total.toLocaleString('pt-BR', {style: 'currency', currency: 'BRL'})}</span>
                            </div>
                            <form onsubmit="checkout(event)" class="space-y-3">
                                <input type="text" id="c-name" required placeholder="Seu Nome" class="w-full px-4 py-3 bg-white border border-gray-300 rounded-xl outline-none focus:border-brand-500 text-sm">
                                <input type="text" id="c-phone" required placeholder="Seu WhatsApp" class="w-full px-4 py-3 bg-white border border-gray-300 rounded-xl outline-none focus:border-brand-500 text-sm">
                                <button type="submit" id="btn-checkout" class="w-full py-4 bg-brand-500 text-white font-black rounded-xl hover:bg-brand-600 shadow-lg shadow-brand-500/30 transition text-lg mt-2">
                                    Finalizar Pedido
                                </button>
                            </form>
                        </div>
                        ` : ''}
                    </div>
                </div>
                <style>.slide-left { animation: slideLeft 0.3s ease-out; } @keyframes slideLeft { from { transform: translateX(100%); } to { transform: translateX(0); } }</style>
            `;
            openModal(html);
        }

        window.checkout = async function(e) {
            e.preventDefault();
            if(state.cart.length === 0) return;
            
            const btn = document.getElementById('btn-checkout');
            btn.disabled = true; btn.innerHTML = 'Processando...';

            const name = document.getElementById('c-name').value;
            const phone = document.getElementById('c-phone').value;
            const total = state.cart.reduce((sum, item) => sum + (item.product.price * item.quantity), 0);

            const order = {
                tenantId: state.publicTenant.id,
                customer: { name, phone },
                items: state.cart.map(i => ({ productId: i.product.id, name: i.product.name, price: i.product.price, quantity: i.quantity })),
                total: total,
                status: 'novo',
                createdAt: Date.now()
            };

            try {
                await setDoc(doc(collection(db, collections.orders)), order);
                state.cart = [];
                closeModal();
                
                openModal(`
                    <div class="fixed inset-0 z-50 flex items-center justify-center p-4 overlay fade-in">
                        <div class="bg-white rounded-3xl shadow-2xl p-8 text-center max-w-sm w-full">
                            <div class="w-20 h-20 bg-green-100 text-green-500 rounded-full flex items-center justify-center text-4xl mx-auto mb-6"><i class="fas fa-check"></i></div>
                            <h2 class="text-2xl font-black text-gray-800 mb-2">Pedido Enviado!</h2>
                            <p class="text-gray-500 mb-6">O restaurante já recebeu o seu pedido. Em breve ele começará a ser preparado.</p>
                            <button onclick="closeModal(); handleRoute();" class="w-full bg-gray-900 text-white font-bold py-3.5 rounded-xl">Fechar</button>
                        </div>
                    </div>
                `);
            } catch(err) {
                showToast("Erro ao processar pedido.", "error");
                btn.disabled = false; btn.innerHTML = 'Finalizar Pedido';
            }
        }

        window.onload = () => {
            setupRouter();
            initializeAppAuth();
        };
    </script>
</body>
</html>
