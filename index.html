<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },

                        brand: {
                            50: '#fef2f2',
                            100: '#fee2e2',
                            500: '#ef4444',
                            600: '#dc2626',
                            900: '#7f1d1d',
                            dark: '#111827'
                        }
                    }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Inter', sans-serif; -webkit-font-smoothing: antialiased; background-color: #f9fafb; }
        .fade-in { animation: fadeIn 0.3s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
        .hide-scroll::-webkit-scrollbar { display: none; }
        .hide-scroll { -ms-overflow-style: none; scrollbar-width: none; }
        .glass-panel { background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(10px); }
        .loader { border-radius: 50%; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .overlay { background-color: rgba(0, 0, 0, 0.5); backdrop-filter: blur(4px); }
        
        @media (max-width: 768px) {
            .product-image-mobile { height: 130px !important; }
        }
        
        .cropper-container { max-height: 400px; }
        .cropper-modal { background-color: #000; opacity: 0.5; }
        .cropper-view-box { border-radius: 8px; outline: 2px solid #ef4444; }
        .cropper-face { border-radius: 8px; }

        .sortable-ghost { opacity: 0.35 !important; transform: scale(0.97); border: 2px dashed #ef4444 !important; background-color: #fef2f2 !important; }
        .sortable-chosen { box-shadow: 0 12px 25px -5px rgba(0, 0, 0, 0.15), 0 8px 10px -6px rgba(0, 0, 0, 0.1); }
        .sortable-drag { cursor: grabbing !important; opacity: 0.95; transform: rotate(1deg); }
        .drag-handle { touch-action: none; user-select: none; -webkit-user-select: none; }
    </style>
</head>
<body class="text-gray-800 antialiased overflow-x-hidden">

    <div id="app" class="min-h-screen w-full flex flex-col">
        <div class="flex-grow flex items-center justify-center">
            <div class="loader w-12 h-12 border-4 border-gray-200 border-t-brand-500"></div>
        </div>
    </div>
    
    <div id="modal-container"></div>
    <div id="toast-container" class="fixed top-4 right-4 z-50 flex flex-col gap-2 pointer-events-none"></div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut, onAuthStateChanged, updateProfile, updatePassword, updateEmail } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, getDoc, setDoc, collection, getDocs, updateDoc, deleteDoc, onSnapshot, query, where, serverTimestamp, writeBatch } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCZyMVAn_F3me72l8N1PqKTfgnb0cQpUKA",
            authDomain: "sistema-restaurantes-6baf8.firebaseapp.com",
            projectId: "sistema-restaurantes-6baf8",
            storageBucket: "sistema-restaurantes-6baf8.firebasestorage.app",
            messagingSenderId: "753663577381",
            appId: "1:753663577381:web:9771b3c0004264b2745ecc",
            measurementId: "G-0B4Q7M2V5K"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);

        const secondaryApp = initializeApp(firebaseConfig, "SecondaryApp");
        const secondaryAuth = getAuth(secondaryApp);

        const collections = {
            tenants: "saas_tenants",
            products: "saas_products",
            orders: "saas_orders",
            notifications: "saas_notifications",
            adminNotifications: "saas_admin_notifications"
        };

        const state = {
            currentUser: null,
            isSuperAdmin: false,
            currentTenant: null,
            
            viewingSlug: null,
            publicTenant: null,
            publicProducts: [],
            cart: [],
            
            adminProducts: [],
            adminOrders: [],
            adminNotifications: [],

            superAdminTenants: [],
            superAdminOrders: [],
            superAdminNotifications: [],
            
            isAppLoaded: false
        };

        function generateId() {
            return Math.random().toString(36).substring(2, 15);
        }

        window.showToast = function(message, type = 'success') {
            const toast = document.createElement('div');
            const bgColor = type === 'success' ? 'bg-gray-900' : 'bg-red-500';
            const icon = type === 'success' ? 'fa-check-circle text-green-400' : 'fa-exclamation-circle text-white';
            
            toast.className = `${bgColor} text-white px-6 py-3 rounded-xl shadow-2xl flex items-center gap-3 fade-in transform transition-all duration-300`;
            toast.innerHTML = `<i class="fas ${icon} text-xl"></i><span class="font-medium">${message}</span>`;
            
            document.getElementById('toast-container').appendChild(toast);
            setTimeout(() => {
                toast.style.opacity = '0';
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }

        window.openModal = function(htmlContent) {
            document.getElementById('modal-container').innerHTML = htmlContent;
        }

        window.closeModal = function() {
            document.getElementById('modal-container').innerHTML = '';
        }

        function setupRouter() {
            window.addEventListener('hashchange', handleRoute);
            handleRoute();
        }

        async function handleRoute() {
            const hash = window.location.hash;
            const appDiv = document.getElementById('app');

            if (!state.isAppLoaded) return;

            if (hash === '' || hash === '#/') {
                renderLanding(appDiv);
            } 
            else if (hash.startsWith('#/login')) {
                if (state.currentUser) {
                    window.location.hash = state.isSuperAdmin ? '#/superadmin' : '#/admin';
                } else {
                    renderAuth(appDiv);
                }
            } 
            else if (hash.startsWith('#/superadmin')) {
                if (!state.currentUser || !state.isSuperAdmin) {
                    window.location.hash = '#/login';
                } else {
                    renderSuperAdmin(appDiv, hash);
                }
            }
            else if (hash.startsWith('#/admin')) {
                if (!state.currentUser) {
                    window.location.hash = '#/login';
                } else if (state.isSuperAdmin) {
                    window.location.hash = '#/superadmin';
                } else {
                    renderAdmin(appDiv, hash);
                }
            } 
            else if (hash.startsWith('#/cardapio/')) {
                const slug = hash.split('/')[2];
                if (slug) {
                    state.viewingSlug = slug;
                    await loadPublicMenuData(slug);
                    renderPublicMenu(appDiv);
                } else {
                    window.location.hash = '#/';
                }
            }
            else {
                window.location.hash = '#/';
            }
        }

        async function initializeAppAuth() {
            onAuthStateChanged(auth, async (user) => {
                state.currentUser = user;
                if (user) {
                    state.isSuperAdmin = (user.email === 'willdalves1@gmail.com');

                    if (!state.isSuperAdmin) {
                        try {
                            const docRef = doc(db, collections.tenants, user.uid);
                            const docSnap = await getDoc(docRef);
                            if (docSnap.exists()) {
                                state.currentTenant = { id: docSnap.id, ...docSnap.data() };
                            } else {
                                state.currentTenant = null;
                            }
                        } catch (e) {
                            console.error("Erro ao carregar perfil da loja:", e);
                        }
                    } else {
                        await loadSuperAdminNotifications();
                    }
                } else {
                    state.currentTenant = null;
                    state.isSuperAdmin = false;
                }
                
                if (!state.isAppLoaded) {
                    state.isAppLoaded = true;
                    handleRoute();
                } else {
                    handleRoute();
                }
            });
        }

        async function loadSuperAdminNotifications() {
            try {
                const nq = query(collection(db, collections.adminNotifications), where("type", "==", "admin_master"));
                const nsnap = await getDocs(nq);
                state.superAdminNotifications = nsnap.docs.map(d => ({ id: d.id, ...d.data() }))
                    .sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
            } catch (err) {
                console.warn("Erro ao carregar notificações do admin:", err);
                state.superAdminNotifications = [];
            }
        }

        window.renderLanding = function(container) {
            container.innerHTML = `
                <div class="min-h-screen flex flex-col bg-white fade-in">
                    <header class="flex justify-between items-center p-6 lg:px-12 border-b border-gray-100 bg-white sticky top-0 z-50">
                        <div class="font-black text-2xl tracking-tighter flex items-center gap-2">
                            <div class="w-8 h-8 bg-brand-500 rounded-lg flex items-center justify-center text-white text-sm shadow-md shadow-brand-500/30">
                                <i class="fas fa-bolt"></i>
                            </div>
                            <span><span class="text-brand-500">WA</span> Vendas</span>
                        </div>
                        <nav>
                            <button onclick="window.location.hash='#/login'" class="font-semibold text-gray-600 hover:text-brand-500 mr-6 transition">Entrar</button>
                            <button onclick="window.location.hash='#/login?type=cliente&register=true'" class="bg-brand-dark text-white px-5 py-2.5 rounded-xl font-bold hover:bg-gray-800 transition shadow-lg">Começar Grátis</button>
                        </nav>
                    </header>

                    <main class="flex-grow flex flex-col items-center justify-center text-center px-4 py-20 bg-gradient-to-b from-gray-50 to-white">
                        <div class="inline-flex items-center gap-2 px-4 py-2 rounded-full bg-brand-50 text-brand-600 font-bold text-sm mb-8 border border-brand-100">
                            <span class="relative flex h-2.5 w-2.5">
                              <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-brand-400 opacity-75"></span>
                              <span class="relative inline-flex rounded-full h-2.5 w-2.5 bg-brand-500"></span>
                            </span>
                            Plataforma SaaS Completa
                        </div>
                        <h1 class="text-5xl md:text-7xl font-black text-gray-900 tracking-tight mb-6 max-w-4xl leading-tight">
                            O sistema de vendas do seu <span class="text-transparent bg-clip-text bg-gradient-to-r from-brand-500 to-orange-500">Restaurante</span>
                        </h1>
                        <p class="text-xl text-gray-500 mb-10 max-w-2xl font-medium">Cardápio digital, gestão de pedidos e recebimentos via PIX e Cartão. Tudo em uma única plataforma profissional.</p>
                        
                        <div class="flex flex-col sm:flex-row gap-4">
                            <button onclick="window.location.hash='#/login?type=cliente&register=true'" class="bg-brand-500 text-white px-8 py-4 rounded-xl font-bold text-lg hover:bg-brand-600 transition shadow-xl shadow-brand-500/30 flex items-center justify-center gap-2">
                                Criar minha Loja Agora <i class="fas fa-arrow-right"></i>
                            </button>
                            <button onclick="window.location.hash='#/cardapio/demo'" class="bg-white border-2 border-gray-200 text-gray-700 px-8 py-4 rounded-xl font-bold text-lg hover:border-gray-300 hover:bg-gray-50 transition flex items-center justify-center gap-2">
                                <i class="fas fa-mobile-alt text-brand-500"></i> Ver Cardápio Demo
                            </button>
                        </div>

                        <div class="mt-20 w-full max-w-5xl">
                            <div class="grid grid-cols-1 md:grid-cols-3 gap-8 text-left">
                                <div class="bg-white p-8 rounded-2xl shadow-sm border border-gray-100">
                                    <div class="w-12 h-12 bg-red-50 text-brand-500 rounded-xl flex items-center justify-center text-xl mb-6"><i class="fas fa-hamburger"></i></div>
                                    <h3 class="text-xl font-bold mb-3">Cardápio Digital Lindo</h3>
                                    <p class="text-gray-500 text-sm leading-relaxed">Mostre seus produtos com fotos incríveis, variações e adicionais. Seus clientes vão comprar com os olhos.</p>
                                </div>
                                <div class="bg-white p-8 rounded-2xl shadow-sm border border-gray-100">
                                    <div class="w-12 h-12 bg-green-50 text-green-500 rounded-xl flex items-center justify-center text-xl mb-6"><i class="fas fa-motorcycle"></i></div>
                                    <h3 class="text-xl font-bold mb-3">Gestão de Pedidos</h3>
                                    <p class="text-gray-500 text-sm leading-relaxed">Receba os pedidos direto no painel com alertas sonoros. Acompanhe do preparo até a entrega.</p>
                                </div>
                                <div class="bg-white p-8 rounded-2xl shadow-sm border border-gray-100">
                                    <div class="w-12 h-12 bg-blue-50 text-blue-500 rounded-xl flex items-center justify-center text-xl mb-6"><i class="fas fa-qrcode"></i></div>
                                    <h3 class="text-xl font-bold mb-3">Pagamento Facilitado</h3>
                                    <p class="text-gray-500 text-sm leading-relaxed">Integração nativa para pagamentos. Dinheiro direto na sua conta sem taxas abusivas de aplicativos de terceiros.</p>
                                </div>
                            </div>
                        </div>
                    </main>
                </div>
            `;
        }

        window.renderAuth = function(container) {
            const urlParams = new URLSearchParams(window.location.hash.split('?')[1]);
            const isRegister = urlParams.get('register') === 'true';
            window.authTab = urlParams.get('type') === 'admin' ? 'admin' : 'cliente'; 
            renderAuthUI(container, isRegister);
        }

        window.renderAuthUI = function(container, isRegister) {
            const isAdmin = window.authTab === 'admin';

            container.innerHTML = `
                <div class="min-h-screen flex items-center justify-center bg-gray-50 p-4 fade-in">
                    <div class="bg-white p-8 sm:p-12 rounded-3xl shadow-2xl w-full max-w-md border border-gray-100 relative overflow-hidden">
                        <div class="absolute top-0 left-0 w-full h-2 bg-gradient-to-r ${isAdmin ? 'from-purple-600 to-blue-600' : 'from-brand-500 to-orange-500'}"></div>
                        <div class="text-center mb-8">
                            <div class="inline-flex items-center justify-center w-16 h-16 rounded-2xl ${isAdmin ? 'bg-purple-50 text-purple-600' : 'bg-red-50 text-brand-600'} mb-4 shadow-inner">
                                <i class="fas ${isAdmin ? 'fa-shield-alt' : 'fa-store'} text-2xl"></i>
                            </div>
                            <h2 class="text-2xl font-bold text-gray-800">${isAdmin ? 'Acesso Administrativo' : (isRegister ? 'Crie seu Restaurante' : 'Painel do Restaurante')}</h2>
                            <p class="text-gray-500 text-sm mt-1">${isAdmin ? 'Gestão da Plataforma WA Vendas.' : (isRegister ? 'Inicie seu teste gratuito e monte seu cardápio.' : 'Gerencie suas vendas e cardápio.')}</p>
                        </div>

                        <div class="flex p-1 bg-gray-100 rounded-xl mb-8">
                            <button onclick="window.authTab='cliente'; renderAuthUI(document.getElementById('app'), false)" class="flex-1 py-2 text-sm font-bold rounded-lg transition ${!isAdmin ? 'bg-white shadow-sm text-brand-600' : 'text-gray-500 hover:text-gray-800'}">Sou Lojista</button>
                            <button onclick="window.authTab='admin'; renderAuthUI(document.getElementById('app'), false)" class="flex-1 py-2 text-sm font-bold rounded-lg transition ${isAdmin ? 'bg-white shadow-sm text-purple-600' : 'text-gray-500 hover:text-gray-800'}">Administrador</button>
                        </div>

                        <form id="auth-form" class="space-y-4" onsubmit="handleAuthSubmit(event, ${isRegister && !isAdmin}, ${isAdmin})">
                            ${(isRegister && !isAdmin) ? `
                                <div>
                                    <label class="block text-sm font-bold text-gray-700 mb-1">Nome do Estabelecimento</label>
                                    <input type="text" id="restaurant-name" required class="w-full px-4 py-3 rounded-xl border border-gray-300 focus:ring-2 focus:ring-brand-500 focus:border-brand-500 outline-none transition bg-gray-50 focus:bg-white">
                                </div>
                                <div>
                                    <label class="block text-sm font-bold text-gray-700 mb-1">Link do Cardápio</label>
                                    <div class="flex shadow-sm rounded-xl overflow-hidden border border-gray-300 focus-within:ring-2 focus-within:ring-brand-500 transition">
                                        <span class="inline-flex items-center px-3 bg-gray-100 text-gray-500 text-sm font-mono border-r border-gray-200">wa.com/</span>
                                        <input type="text" id="restaurant-slug" placeholder="sua-loja" required class="flex-1 min-w-0 block w-full px-3 py-3 font-mono text-sm outline-none bg-gray-50 focus:bg-white" onkeyup="this.value = this.value.toLowerCase().replace(/[^a-z0-9-]/g, '')">
                                    </div>
                                </div>
                                <div>
                                    <label class="block text-sm font-bold text-gray-700 mb-1">WhatsApp</label>
                                    <div class="relative">
                                        <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-gray-400">
                                            <i class="fab fa-whatsapp"></i>
                                        </div>
                                        <input type="tel" id="restaurant-phone" placeholder="(11) 99999-9999" class="w-full pl-11 pr-4 py-3 rounded-xl border border-gray-300 focus:ring-2 focus:ring-brand-500 focus:border-brand-500 outline-none transition bg-gray-50 focus:bg-white">
                                    </div>
                                    <p class="text-xs text-gray-400 mt-1">Número para contato dos clientes</p>
                                </div>
                            ` : ''}
                            
                            <div>
                                <label class="block text-sm font-bold text-gray-700 mb-1">E-mail</label>
                                <div class="relative">
                                    <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-gray-400"><i class="fas fa-envelope"></i></div>
                                    <input type="email" id="email" required placeholder="seu@email.com" class="w-full pl-11 pr-4 py-3 rounded-xl border border-gray-300 focus:ring-2 focus:ring-${isAdmin ? 'purple' : 'brand'}-500 outline-none transition bg-gray-50 focus:bg-white">
                                </div>
                            </div>
                            
                            <div>
                                <label class="block text-sm font-bold text-gray-700 mb-1">Senha</label>
                                <div class="relative">
                                    <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-gray-400"><i class="fas fa-lock"></i></div>
                                    <input type="password" id="password" required placeholder="••••••••" class="w-full pl-11 pr-4 py-3 rounded-xl border border-gray-300 focus:ring-2 focus:ring-${isAdmin ? 'purple' : 'brand'}-500 outline-none transition bg-gray-50 focus:bg-white">
                                </div>
                            </div>

                            <button type="submit" id="auth-btn" class="w-full ${isAdmin ? 'bg-purple-600 hover:bg-purple-700 shadow-purple-500/30' : 'bg-brand-500 hover:bg-brand-600 shadow-brand-500/30'} text-white font-bold py-3.5 rounded-xl transition shadow-lg flex justify-center items-center mt-2">
                                ${isAdmin ? 'Entrar no Painel WA' : (isRegister ? 'Criar Loja e Começar' : 'Acessar meu Restaurante')}
                            </button>
                        </form>

                        ${!isAdmin ? `
                        <div class="mt-6 text-center text-sm text-gray-600 font-medium">
                            ${isRegister ?  
                                `Já tem sua loja? <a href="javascript:void(0)" onclick="renderAuthUI(document.getElementById('app'), false)" class="text-brand-600 hover:underline">Fazer Login</a>` : 
                                `Ainda não é parceiro? <a href="javascript:void(0)" onclick="renderAuthUI(document.getElementById('app'), true)" class="text-brand-600 hover:underline">Cadastre-se</a>`
                            }
                        </div>
                        ` : `
                        <div class="mt-6 text-center text-xs text-gray-400">
                            Acesso restrito à equipe administrativa WA Vendas.
                        </div>
                        `}
                    </div>
                </div>
            `;
        }

        window.handleAuthSubmit = async function(event, isRegister, isAdmin) {
            event.preventDefault();
            const btn = document.getElementById('auth-btn');
            const originalText = btn.innerHTML;
            btn.innerHTML = '<div class="loader w-5 h-5 border-2 border-white border-t-transparent mx-auto"></div>';
            btn.disabled = true;

            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            try {
                if (isRegister && !isAdmin) {
                    const name = document.getElementById('restaurant-name').value;
                    const slug = document.getElementById('restaurant-slug').value;
                    const phone = document.getElementById('restaurant-phone').value.trim();
                    
                    if(slug.length < 3) throw new Error("Link deve ter pelo menos 3 caracteres.");

                    const userCreds = await createUserWithEmailAndPassword(auth, email, password);
                    await updateProfile(userCreds.user, { displayName: name });
                    
                    const tenantData = {
                        name: name,
                        slug: slug,
                        phone: phone,
                        email: email,
                        password: password,
                        status: 'active',
                        plan: 'trial',
                        createdAt: serverTimestamp(),
                        settings: {
                            open: true,
                            minOrder: 0,
                            primaryColor: '#ef4444',
                            coverImage: '',
                            profileImage: ''
                        }
                    };

                    await setDoc(doc(db, collections.tenants, userCreds.user.uid), tenantData);

                    await createAdminNotification({
                        type: 'admin_master',
                        title: 'Novo Cliente Cadastrado',
                        message: `${name} cadastrou-se na plataforma`,
                        customerName: name,
                        customerEmail: email,
                        action: 'novo_cliente'
                    });

                    // Otimização: Popula os dados imediatamente no state local para evitar atraso/travamento.
                    state.currentUser = userCreds.user;
                    state.currentTenant = { id: userCreds.user.uid, ...tenantData };
                    state.isSuperAdmin = false;

                    showToast('Restaurante criado com sucesso! Bem-vindo(a).');
                    window.location.hash = '#/admin';

                } else {
                    const userCreds = await signInWithEmailAndPassword(auth, email, password);
                    if (isAdmin && email !== 'willdalves1@gmail.com') {
                        throw new Error("Acesso administrativo negado.");
                    }
                    
                    // Otimização: Popula e recupera os dados na mesma requisição para transição rápida.
                    state.currentUser = userCreds.user;
                    state.isSuperAdmin = (email === 'willdalves1@gmail.com');
                    
                    if (!state.isSuperAdmin) {
                        const docRef = doc(db, collections.tenants, userCreds.user.uid);
                        const docSnap = await getDoc(docRef);
                        if (docSnap.exists()) {
                            state.currentTenant = { id: docSnap.id, ...docSnap.data() };
                        } else {
                            state.currentTenant = null;
                        }
                    } else {
                        await loadSuperAdminNotifications();
                    }

                    showToast('Acesso liberado.');
                    // Força a navegação imediatamente
                    window.location.hash = state.isSuperAdmin ? '#/superadmin' : '#/admin';
                }
            } catch (error) {
                console.error(error);
                let msg = error.message;
                if(error.code === 'auth/email-already-in-use') msg = "E-mail já cadastrado.";
                if(error.code === 'auth/invalid-credential') msg = "E-mail ou senha incorretos.";
                showToast(msg, 'error');
                btn.innerHTML = originalText;
                btn.disabled = false;
            }
        }

        async function createAdminNotification(notificationData) {
            try {
                const notifRef = doc(collection(db, collections.adminNotifications));
                await setDoc(notifRef, {
                    ...notificationData,
                    createdAt: Date.now(),
                    read: false
                });
                
                if (state.isSuperAdmin) {
                    state.superAdminNotifications.unshift({

            if (!state.isSuperAdmin) return;
            const tenantsSnap = await getDocs(collection(db, collections.tenants));
            state.superAdminTenants = tenantsSnap.docs.map(d => ({ id: d.id, ...d.data() }));
            
            await loadSuperAdminNotifications();

        async function checkPlanExpirations() {
            if (!state.isSuperAdmin) return;
            const batch = writeBatch(db);
            let hasUpdates = false;

            for (let t of state.superAdminTenants) {
                if (!t.renewalDate || t.status === 'canceled') continue;
                
                const today = new Date();
                today.setHours(0,0,0,0);
                // Ajusta timezone para evitar bugs de virada de dia
                const renewalParts = t.renewalDate.split('-');
                const renewal = new Date(renewalParts[0], renewalParts[1] - 1, renewalParts[2]); 
                
                const diffTime = renewal - today;
                const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));
                
                let notifType = null;
                let msg = '';
                let updateFields = {};

                if (diffDays === 5 && t.lastNotif !== '5d') {
                    notifType = '5d'; msg = `O plano de @${t.name} vai vencer em 5 dias`;
                } else if (diffDays === 3 && t.lastNotif !== '3d') {
                    notifType = '3d'; msg = `O plano de @${t.name} vai vencer em 3 dias`;
                } else if (diffDays === 0 && t.lastNotif !== '0d') {
                    notifType = '0d'; msg = `O plano de @${t.name} vai vencer hoje`;
                } else if (diffDays === -3 && t.lastNotif !== '-3d') {
                    notifType = '-3d'; msg = `@${t.name} venceu a 3 dias após 5 dias será congelado`;
                } else if (diffDays <= -5 && t.status !== 'suspended') {
                    notifType = 'suspended_auto'; 
                    msg = `O plano de @${t.name} venceu há 5 dias. Foi atualizado para Suspenso.`;
                    updateFields.status = 'suspended';
                }

                if (notifType) {
                    updateFields.lastNotif = notifType;
                    const tRef = doc(db, collections.tenants, t.id);
                    batch.update(tRef, updateFields);
                    hasUpdates = true;
                    
                    t.status = updateFields.status || t.status;
                    t.lastNotif = notifType;

                    await createAdminNotification({
                        type: 'admin_master',
                        title: 'Aviso de Vencimento',
                        message: msg,
                        customerName: t.name,
                        action: 'vencimento'
                    });
                }
            }

            if (hasUpdates) {
                await batch.commit();
            }
        }

        window.saveTenantEdits = async function(e, tenantId) {
            e.preventDefault();
            const btn = document.getElementById('btn-save-tenant-edits');
            btn.disabled = true;
            btn.innerHTML = '<div class="loader w-4 h-4 border-2 border-white border-t-transparent mx-auto"></div>';

            const name = document.getElementById('edit-t-name').value.trim();
            const phone = document.getElementById('edit-t-phone').value.trim();
            const email = document.getElementById('edit-t-email').value.trim();
            const password = document.getElementById('edit-t-password').value.trim();
            const slug = document.getElementById('edit-t-slug').value.trim().toLowerCase().replace(/[^a-z0-9-]/g, '');
            const planPrice = parseFloat(document.getElementById('edit-t-price').value) || 99.90;
            const renewalDate = document.getElementById('edit-t-renewal').value;
            const status = document.getElementById('edit-t-status').value;

            if (!name || !slug || !email) {
                showToast("Por favor, preencha todos os campos obrigatórios.", "error");
                btn.disabled = false;
                btn.innerHTML = '<i class="fas fa-save"></i> Salvar Alterações';
                return;
            }

            try {
                const oldTenant = state.superAdminTenants.find(t => t.id === tenantId);
                if (oldTenant && oldTenant.slug !== slug) {
                    const q = query(collection(db, collections.tenants), where("slug", "==", slug));
                    const snap = await getDocs(q);
                    if (!snap.empty && snap.docs.some(d => d.id !== tenantId)) {
                        showToast("Este slug já está sendo utilizado por outro restaurante.", "error");
                        btn.disabled = false;
                        btn.innerHTML = '<i class="fas fa-save"></i> Salvar Alterações';
                        return;
                    }
                }

                const tenantRef = doc(db, collections.tenants, tenantId);
                const updatedPayload = {
                    name,
                    phone,
                    email,
                    slug,
                    planPrice,
                    renewalDate,
                    status,
                    lastModified: Date.now()
                };

                // Remove a notificação de vencimento caso o admin renove o plano manualmente
                if(oldTenant && oldTenant.renewalDate !== renewalDate) {
                    updatedPayload.lastNotif = null; 
                }

                if (password) {
                    updatedPayload.password = password;
                }

                await setDoc(tenantRef, updatedPayload, { merge: true });

                const index = state.superAdminTenants.findIndex(t => t.id === tenantId);
                if (index !== -1) {
                    state.superAdminTenants[index] = { ...state.superAdminTenants[index], ...updatedPayload };
                }

                if (oldTenant) {
                    const changes = [];
                    if (oldTenant.email !== email) changes.push('email');
                    if (oldTenant.password !== password) changes.push('senha');
                    
                    if(changes.length > 0) {
                        const message = changes.includes('senha') 
                            ? `@${name} atualizou a senha no sistema`
                            : `@${name} atualizou o email de acesso`;
                        
                        await createAdminNotification({
                            type: 'admin_master',
                            title: changes.includes('senha') ? 'Senha Atualizada' : 'Email Atualizado',
                            message: message,
                            customerName: name,
                            customerEmail: email,
                            action: changes.includes('senha') ? 'senha_alterada' : 'email_alterado'
                        });
                    }

                    if (oldTenant.status !== status) {
                        let statusMsg = '';
                        if (status === 'active') statusMsg = `@${name} foi atualizado para Ativo`;
                        else if (status === 'suspended') statusMsg = `@${name} foi atualizado para Suspenso`;
                        else if (status === 'canceled') statusMsg = `@${name} cancelou a assinatura`;

                        if (statusMsg) {
                            await createAdminNotification({
                                type: 'admin_master',
                                title: 'Status Alterado',
                                message: statusMsg,
                                customerName: name,
                                action: 'status_alterado'
                            });
                        }
                    }
                }

                showToast("Dados do lojista atualizados com sucesso!");
                closeModal();
                loadSuperAdminData();
            } catch (err) {
                console.error("Erro ao salvar dados do lojista:", err);
                showToast("Erro ao salvar: " + err.message, "error");
                btn.disabled = false;
                btn.innerHTML = '<i class="fas fa-save"></i> Salvar Alterações';
            }
        };

        window.submitAdminCreateTenant = async function(e) {
            e.preventDefault();
            const btn = document.getElementById('btn-create-tenant');
            btn.innerHTML = '<div class="loader w-4 h-4 border-2 border-white border-t-transparent mx-auto"></div>';
            btn.disabled = true;

            const name = document.getElementById('new-t-name').value.trim();
            const phone = document.getElementById('new-t-phone').value.trim();
            const slug = document.getElementById('new-t-slug').value.trim().toLowerCase().replace(/[^a-z0-9-]/g, '');
            const email = document.getElementById('new-t-email').value.trim();
            const pass = document.getElementById('new-t-pass').value;
            const planPrice = parseFloat(document.getElementById('new-t-price').value) || 99.90;
            const renewalDate = document.getElementById('new-t-renewal').value;

            try {
                const { createUserWithEmailAndPassword: createUserSecondary, updateProfile: updateProfileSecondary, signOut: signOutSecondary } = await import("https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js");
                
                const userCreds = await createUserSecondary(secondaryAuth, email, pass);
                await updateProfileSecondary(userCreds.user, { displayName: name });
                
                await setDoc(doc(db, collections.tenants, userCreds.user.uid), {
                    name: name,
                    phone: phone,
                    slug: slug,
                    email: email,
                    password: pass,
                    planPrice: planPrice,
                    renewalDate: renewalDate,
                    status: 'active',
                    plan: 'pro',
                    createdAt: serverTimestamp(),
                    settings: { 
                        open: true, 
                        minOrder: 0, 
                        primaryColor: '#ef4444',
                        coverImage: '',
                        profileImage: ''
                    }
                });

                await signOutSecondary(secondaryAuth);

                await createAdminNotification({
                    type: 'admin_master',
                    title: 'Novo Cliente Cadastrado',
                    message: `${name} foi cadastrado na plataforma`,
                    customerName: name,
                    customerEmail: email,
                    action: 'novo_cliente'
                });

                showToast('Lojista criado com sucesso!');
                closeModal();
                loadSuperAdminData();
            } catch (error) {
                showToast('Erro: ' + error.message, 'error');
                btn.innerHTML = 'Criar Conta';
                btn.disabled = false;
            }
        }

        let sortableInstance = null;
        window.initAdminSortable = function() {
            const container = document.getElementById('admin-products-list');
            if (!container) return;
            
            if (typeof Sortable === 'undefined') {
                setTimeout(initAdminSortable, 150);
                return;
            }

            if (sortableInstance) {
                try {
                    sortableInstance.destroy();
                } catch(e) {}
                sortableInstance = null;
            }

            const cards = container.querySelectorAll('.admin-product-card');
            if (cards.length <= 1) return;

            sortableInstance = new Sortable(container, {
                animation: 200,
                handle: '.drag-handle',
                ghostClass: 'sortable-ghost',
                chosenClass: 'sortable-chosen',
                dragClass: 'sortable-drag',
                forceFallback: false,
                touchStartThreshold: 3,
                onEnd: async function(evt) {
                    if (evt.oldIndex === evt.newIndex) return;

                    const itemEls = container.querySelectorAll('.admin-product-card');
                    const newOrderedIds = Array.from(itemEls).map(el => el.getAttribute('data-id'));
                    
                    itemEls.forEach((el, idx) => {
                        const badge = el.querySelector('.product-order-badge');
                        if (badge) badge.innerText = `#${idx + 1}`;
                    });

                    await saveProductsOrder(newOrderedIds);
                }
            });
        };

        window.saveProductsOrder = async function(newOrderedIds) {
            try {
                const batch = writeBatch(db);
                newOrderedIds.forEach((id, index) => {
                    const productRef = doc(db, collections.products, id);
                    batch.update(productRef, { order: index });
                    
                    const p = state.adminProducts.find(item => item.id === id);
                    if (p) p.order = index;
                });
                
                await batch.commit();
                state.adminProducts.sort((a, b) => {
                    const orderA = a.order !== undefined ? a.order : 999999;
                    const orderB = b.order !== undefined ? b.order : 999999;
                    if (orderA !== orderB) return orderA - orderB;
                    return (a.createdAt || 0) - (b.createdAt || 0);
                });
                showToast('Ordem do cardápio salva com sucesso!');
            } catch (error) {
                console.error("Erro ao salvar ordem dos produtos:", error);
                showToast('Erro ao salvar nova ordem do cardápio.', 'error');
            }
        };

        async function loadAdminData() {
            if (!state.currentTenant) return;
            const q = query(collection(db, collections.products), where("tenantId", "==", state.currentTenant.id));
            const snap = await getDocs(q);
            state.adminProducts = snap.docs.map(d => ({ id: d.id, ...d.data() }))
                .sort((a, b) => {
                    const orderA = a.order !== undefined ? a.order : 999999;
                    const orderB = b.order !== undefined ? b.order : 999999;
                    if (orderA !== orderB) return orderA - orderB;
                    return (a.createdAt || 0) - (b.createdAt || 0);
                });
            
            const oq = query(collection(db, collections.orders), where("tenantId", "==", state.currentTenant.id));
            const osnap = await getDocs(oq);
            state.adminOrders = osnap.docs.map(d => ({ id: d.id, ...d.data() })).sort((a,b) => (b.createdAt || 0) - (a.createdAt || 0));

            let notifsFromCollection = [];
            try {
                const nq = query(collection(db, collections.notifications), where("tenantId", "==", state.currentTenant.id));
                const nsnap = await getDocs(nq);
                notifsFromCollection = nsnap.docs.map(d => ({ id: d.id, ...d.data() }));
            } catch (err) {
                console.warn("Aviso: Notificações serão sincronizadas com o histórico dos pedidos.", err);
            }

            const notifsMap = new Map();
            notifsFromCollection.forEach(n => notifsMap.set(n.id || (n.orderId + '_' + n.createdAt), n));
            state.adminOrders.forEach(o => {
                (o.history || []).forEach(h => {
                    notifsMap.set(h.id || (o.id + '_' + h.createdAt), {
                        ...h,
                        tenantId: o.tenantId,
                        orderId: o.id
                    });
                });
            });

            state.adminNotifications = Array.from(notifsMap.values()).sort((a,b) => (b.createdAt || 0) - (a.createdAt || 0));

            const contentDiv = document.getElementById('admin-content');
            if (contentDiv) {
                const subRoute = window.location.hash.split('/')[2] || 'dashboard';
                contentDiv.innerHTML = getAdminContent(subRoute);
                if (subRoute === 'cardapio') {
                    initAdminSortable();
                }
            }
        }

        window.markAllNotificationsAsRead = async function() {
            state.adminNotifications.forEach(n => n.read = true);

            try {
                const batch = writeBatch(db);
                state.adminNotifications.forEach(n => {
                    if (n.id) {
                        try {
                            batch.update(doc(db, collections.notifications, n.id), { read: true });
                        } catch(e){}
                    }
                });
                await batch.commit();
            } catch (err) {
                console.warn(err);
            }
            loadAdminData();
        };

        window.clearAllNotifications = async function() {
            if (!confirm("Deseja realmente limpar todo o histórico de notificações?")) return;
            state.adminNotifications = [];
            showToast('Histórico de notificações limpo.');
            try {
                const batch = writeBatch(db);
                state.adminOrders.forEach(o => {
                    if (o.history && o.history.length > 0) {
                        batch.update(doc(db, collections.orders, o.id), { history: [] });
                        o.history = [];

                });
                await batch.commit();
            } catch (err) {
                console.warn(err);

            loadAdminData();
        };

        window.saveTenantSettings = async function(e) {
            e.preventDefault();
            const btn = document.getElementById('btn-save-cfg');
            btn.disabled = true; btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Salvando...';
            
            const newPhone = document.getElementById('cfg-phone').value.trim();
            const oldPhone = state.currentTenant.phone;

            try {
                await updateDoc(doc(db, collections.tenants, state.currentTenant.id), { phone: newPhone });
                state.currentTenant.phone = newPhone;
                
                if (oldPhone !== newPhone) {
                    await createAdminNotification({
                        type: 'admin_master',
                        title: 'Contato Atualizado',
                        message: `@${state.currentTenant.name} atualizou contato`,
                        customerName: state.currentTenant.name,
                        action: 'contato_alterado'
                    });
                }
                
                showToast("Contato atualizado com sucesso!");
                btn.disabled = false; btn.innerHTML = 'Salvar Contato';
            } catch(err) {
                showToast("Erro ao atualizar: " + err.message, "error");
                btn.disabled = false; btn.innerHTML = 'Salvar Contato';
            }
        };

        window.saveTenantPassword = async function(e) {
            e.preventDefault();
            const btn = document.getElementById('btn-save-pass');
            btn.disabled = true; btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Salvando...';
            
            const newPass = document.getElementById('cfg-password').value;

            try {
                if(state.currentUser) {
                    await updatePassword(state.currentUser, newPass);
                }
                
                await updateDoc(doc(db, collections.tenants, state.currentTenant.id), { password: newPass });
                
                await createAdminNotification({
                    type: 'admin_master',
                    title: 'Senha Atualizada',
                    message: `@${state.currentTenant.name} atualizou a senha`,
                    customerName: state.currentTenant.name,
                    action: 'senha_alterada'
                });
                
                showToast("Senha alterada com sucesso!");
                document.getElementById('cfg-password').value = '';
                btn.disabled = false; btn.innerHTML = 'Editar Senha';

                // Mostra o modal de sucesso com a nova senha
                openModal(`
                    <div class="fixed inset-0 z-50 flex items-center justify-center p-4 overlay fade-in">
                        <div class="bg-white rounded-3xl shadow-2xl p-8 text-center max-w-sm w-full">
                            <div class="w-20 h-20 bg-green-100 text-green-500 rounded-full flex items-center justify-center text-4xl mx-auto mb-6"><i class="fas fa-lock"></i></div>
                            <h2 class="text-2xl font-black text-gray-800 mb-2">Senha Atualizada!</h2>
                            <p class="text-gray-500 mb-4 text-sm">Sua nova senha foi salva e o administrador foi notificado.</p>
                            <div class="bg-gray-100 p-3 rounded-xl mb-6 font-mono text-gray-800 font-bold text-lg select-all">
                                ${newPass}
                            </div>
                            <button onclick="closeModal();" class="w-full bg-gray-900 text-white font-bold py-3.5 rounded-xl">Entendi</button>
                        </div>
                    </div>
                `);

            } catch(err) {
                let msg = err.message;
                if(err.code === 'auth/requires-recent-login') msg = "Por segurança, saia e faça login novamente para alterar a senha.";
                showToast("Erro ao alterar senha: " + msg, "error");
                btn.disabled = false; btn.innerHTML = 'Editar Senha';
            }
        };

        window.saveSlug = async function(e) {
            e.preventDefault();
            const btn = document.getElementById('btn-save-slug');
            const slugInput = document.getElementById('tenant-slug-input');
            const newSlug = slugInput.value.trim().toLowerCase().replace(/[^a-z0-9-]/g, '');

            if (!newSlug || newSlug.length < 2) {
                showToast("O link deve ter pelo menos 2 caracteres.", "error");
                return;
            }

            if (newSlug === state.currentTenant?.slug) {
                showToast("O link informado é igual ao atual.");
                closeModal();
                return;
            }

            btn.disabled = true;
            btn.innerHTML = '<div class="loader w-4 h-4 border-2 border-white border-t-transparent mx-auto"></div>';

            try {
                const q = query(collection(db, collections.tenants), where("slug", "==", newSlug));
                const snap = await getDocs(q);
                const isTaken = snap.docs.some(d => d.id !== state.currentTenant.id);

                if (isTaken) {
                    showToast("Este link já está em uso por outro restaurante. Escolha outro.", "error");
                    btn.disabled = false;
                    btn.innerHTML = '<i class="fas fa-check"></i> Salvar Novo Link';
                    return;
                }

                const tenantRef = doc(db, collections.tenants, state.currentTenant.id);
                await setDoc(tenantRef, { slug: newSlug }, { merge: true });
                state.currentTenant.slug = newSlug;

                showToast("Link do cardápio atualizado com sucesso!");
                closeModal();
                handleRoute();
            } catch (err) {
                console.error("Erro ao salvar link do cardápio:", err);
                showToast("Erro ao salvar link: " + err.message, "error");
                btn.disabled = false;
                btn.innerHTML = '<i class="fas fa-check"></i> Salvar Novo Link';
            }
        };

        }

        window.applyCrop = function(inputId, previewId) {
            if (!window.cropperInstance) return;
            
            const canvas = window.cropperInstance.getCroppedCanvas({
                width: 800,
                height: 450,
                imageSmoothingEnabled: true,
                imageSmoothingQuality: 'high'
            });
            
            const croppedDataUrl = canvas.toDataURL('image/jpeg', 0.9);
            
            const input = document.getElementById(inputId);
            const preview = document.getElementById(previewId);
            const previewContainer = preview.parentElement;
            
            input.value = croppedDataUrl;
            preview.src = croppedDataUrl;
            previewContainer.classList.remove('hidden');
            
            window.cropperInstance.destroy();
            window.cropperInstance = null;
            
            const currentHash = window.location.hash;
            handleRoute();
            
            showToast('Imagem recortada com sucesso!');

        window.saveOrderEdits = async function(e, orderId) {
            e.preventDefault();
            const btn = document.getElementById('btn-save-order-edits');
            btn.disabled = true;
            btn.innerHTML = '<div class="loader w-4 h-4 border-2 border-white border-t-transparent mx-auto"></div>';

            const oldOrder = state.adminOrders.find(o => o.id === orderId);
            if (!oldOrder) {
                showToast("Pedido não encontrado.", "error");
                btn.disabled = false;
                btn.innerHTML = 'Salvar Alterações';
                return;
            }

            const newName = document.getElementById('modal-order-name').value.trim();
            const newPhone = document.getElementById('modal-order-phone').value.trim();
            const newAddress = document.getElementById('modal-order-address').value.trim();
            const newObs = document.getElementById('modal-order-obs').value.trim();
            const newStatus = document.getElementById('modal-order-status').value;
            const newTotal = parseFloat(document.getElementById('modal-order-total').value) || 0;

            const changes = [];
            const oldName = oldOrder.customer?.name || '';
            const oldPhone = oldOrder.customer?.phone || '';
            const oldAddress = oldOrder.customer?.address || '';
            const oldObs = oldOrder.observations || '';
            const oldStatus = oldOrder.status || 'novo';
            const oldTotal = oldOrder.total || 0;

            if (newName !== oldName) {
                changes.push({ field: "Nome do Cliente", before: oldName || '(Vazio)', after: newName || '(Vazio)' });
            }
            if (newPhone !== oldPhone) {
                changes.push({ field: "Telefone do Cliente", before: oldPhone || '(Vazio)', after: newPhone || '(Vazio)' });
            }
            if (newAddress !== oldAddress) {
                changes.push({ field: "Endereço de Entrega", before: oldAddress || '(Vazio)', after: newAddress || '(Vazio)' });
            }
            if (newObs !== oldObs) {
                changes.push({ field: "Observações do Pedido (obs)", before: oldObs || '(Nenhuma)', after: newObs || '(Nenhuma)' });
            }
            if (newStatus !== oldStatus) {
                changes.push({ field: "Status do Pedido", before: oldStatus, after: newStatus });
            }
            if (Math.abs(newTotal - oldTotal) > 0.001) {
                changes.push({ field: "Valor Total", before: oldTotal.toLocaleString('pt-BR', {style: 'currency', currency: 'BRL'}), after: newTotal.toLocaleString('pt-BR', {style: 'currency', currency: 'BRL'}) });
            }

            if (changes.length === 0) {
                showToast("Nenhuma alteração foi realizada.");
                closeModal();
                return;
            }

            const author = state.currentUser?.displayName || state.currentTenant?.name || (state.currentUser?.email ? state.currentUser.email.split('@')[0] : 'Administrador');

            const newHistoryItem = {
                id: generateId(),
                orderId: orderId,
                author: author,
                customerName: oldName || newName || 'Cliente',
                changes: changes,
                createdAt: Date.now(),
                read: false
            };

            const updatedOrderPayload = {
                ...oldOrder,
                customer: {
                    ...(oldOrder.customer || {}),
                    name: newName,
                    phone: newPhone,
                    address: newAddress
                },
                observations: newObs,
                status: newStatus,
                total: newTotal,
                lastModified: Date.now(),
                lastModifiedBy: author,
                history: [newHistoryItem, ...(oldOrder.history || [])]
            };

            try {
                const orderRef = doc(db, collections.orders, orderId);
                await setDoc(orderRef, updatedOrderPayload, { merge: true });

                try {
                    const notifRef = doc(collection(db, collections.notifications));
                    await setDoc(notifRef, {
                        tenantId: state.currentTenant?.id || oldOrder.tenantId,
                        ...newHistoryItem
                    });
                } catch (notifErr) {
                    console.warn("Aviso: Notificação registrada no histórico do pedido.", notifErr);
                }

                const orderIndex = state.adminOrders.findIndex(o => o.id === orderId);
                if (orderIndex !== -1) {
                    state.adminOrders[orderIndex] = updatedOrderPayload;
                }
                state.adminNotifications.unshift(newHistoryItem);

                showToast(`Alterações salvas e registradas em Notificações!`);
                closeModal();
                loadAdminData();
            } catch (err) {
                console.error("Erro ao salvar alterações do pedido:", err);
                showToast("Erro ao salvar alterações: " + err.message, "error");
                btn.disabled = false;
                btn.innerHTML = 'Salvar Alterações';
            }
        };

        async function loadPublicMenuData(slug) {
            const q = query(collection(db, collections.tenants), where("slug", "==", slug));
            const snap = await getDocs(q);
            if (snap.empty) {
                state.publicTenant = null;
                return;
            }
            state.publicTenant = { id: snap.docs[0].id, ...snap.docs[0].data() };

            const pq = query(collection(db, collections.products), where("tenantId", "==", state.publicTenant.id));
            const psnap = await getDocs(pq);
            state.publicProducts = psnap.docs.map(d => ({ id: d.id, ...d.data() }))
                .sort((a, b) => {
                    const orderA = a.order !== undefined ? a.order : 999999;
                    const orderB = b.order !== undefined ? b.order : 999999;
                    if (orderA !== orderB) return orderA - orderB;
                    return (a.createdAt || 0) - (b.createdAt || 0);
                });
        }

                                    </div>
                                    <div class="p-3 sm:p-4 pt-0">
                                        <button onclick="addToCart('${p.id}')" class="w-full bg-brand-50 hover:bg-brand-500 text-brand-600 hover:text-white py-2 sm:py-2.5 px-3 rounded-xl flex items-center justify-center gap-1.5 font-bold text-xs sm:text-sm transition shadow-sm">
                                            <i class="fas fa-plus text-xs"></i>
                                            <span>Adicionar</span>
                                        </button>
                                    </div>
                                </div>
                            `).join('')}
                            ${state.publicProducts.length === 0 ? `<div class="col-span-full py-12 text-center text-gray-500">Este restaurante ainda não possui itens no cardápio.</div>` : ''}
                        </div>
                    </div>

                    <div class="fixed bottom-0 left-0 w-full p-4 bg-white border-t border-gray-200 shadow-[0_-10px_40px_rgba(0,0,0,0.05)] z-40 transform transition-transform duration-300 ${state.cart.length > 0 ? 'translate-y-0' : 'translate-y-full'}">
                        <div class="max-w-5xl mx-auto flex gap-4">
                            <button onclick="renderCart()" class="w-full bg-brand-500 text-white font-bold py-4 rounded-xl shadow-lg shadow-brand-500/30 flex justify-between items-center px-6">
                                <span class="flex items-center gap-2"><div class="w-6 h-6 bg-white/20 rounded-full flex items-center justify-center text-xs" id="cart-count">${state.cart.length}</div> Ver Carrinho</span>
                                <span id="cart-total-btn">R$ 0,00</span>
                            </button>
                        </div>
                    </div>
                </div>
            `;
            updateCartTotal();
        }

        window.addToCart = function(productId) {
            const product = state.publicProducts.find(p => p.id === productId);
            if (!product) return;
            
            const existing = state.cart.find(item => item.product.id === productId);
            if (existing) {
                existing.quantity++;
            } else {
                state.cart.push({ product, quantity: 1 });
            }
            
            showToast(`${product.name} adicionado!`);
            updateCartTotal();
            
            if(state.cart.length === 1) handleRoute(); 
        }

        function updateCartTotal() {
            const total = state.cart.reduce((sum, item) => sum + (item.product.price * item.quantity), 0);
            const btnTotal = document.getElementById('cart-total-btn');
            const count = document.getElementById('cart-count');
            if(btnTotal) btnTotal.innerText = total.toLocaleString('pt-BR', {style: 'currency', currency: 'BRL'});
            if(count) count.innerText = state.cart.reduce((sum, item) => sum + item.quantity, 0);
        }

        window.renderCart = function() {
            const total = state.cart.reduce((sum, item) => sum + (item.product.price * item.quantity), 0);
            
            const html = `
                <div class="fixed inset-0 z-50 flex justify-end overlay fade-in">
                    <div class="bg-white w-full max-w-md h-full flex flex-col shadow-2xl slide-left">
                        <div class="p-6 border-b flex justify-between items-center bg-gray-50">
                            <h3 class="font-black text-gray-800 text-xl"><i class="fas fa-shopping-bag text-brand-500 mr-2"></i> Seu Pedido</h3>
                            <button onclick="closeModal()" class="w-8 h-8 bg-white border rounded-full text-gray-500 hover:text-gray-800 flex items-center justify-center shadow-sm">&times;</button>
                        </div>
                        
                        <div class="flex-grow overflow-y-auto p-6 space-y-4">
                            ${state.cart.map((item, index) => `
                                <div class="flex justify-between items-center pb-4 border-b border-gray-100 last:border-0">
                                    <div class="flex gap-3 items-center">
                                        <div class="font-bold text-gray-800">${item.quantity}x</div>
                                        <div>
                                            <p class="font-bold text-gray-800">${item.product.name}</p>
                                            <p class="text-brand-600 font-bold text-xs">${(item.product.price * item.quantity).toLocaleString('pt-BR', {style: 'currency', currency: 'BRL'})}</p>
                                        </div>
                                    </div>
                                    <button onclick="state.cart.splice(${index}, 1); updateCartTotal(); renderCart();" class="text-red-400 hover:text-red-600 p-2"><i class="fas fa-trash"></i></button>
                                </div>
                            `).join('')}
                            ${state.cart.length === 0 ? `<div class="text-center text-gray-400 mt-10"><i class="fas fa-shopping-cart text-4xl mb-3 opacity-20"></i><p>Seu carrinho está vazio.</p></div>` : ''}
                        </div>

                        ${state.cart.length > 0 ? `
                        <div class="p-6 border-t bg-gray-50 overflow-y-auto max-h-[50vh]">
                            <div class="flex justify-between items-center mb-4 text-lg">
                                <span class="font-bold text-gray-600">Total</span>
                                <span class="font-black text-gray-900">${total.toLocaleString('pt-BR', {style: 'currency', currency: 'BRL'})}</span>
                            </div>
                            <form onsubmit="checkout(event)" class="space-y-3">
                                <div>
                                    <label class="block text-xs font-bold text-gray-700 mb-1">Seu Nome</label>
                                    <input type="text" id="c-name" required placeholder="Ex: João da Silva" class="w-full px-4 py-2.5 bg-white border border-gray-300 rounded-xl outline-none focus:border-brand-500 text-sm">
                                </div>
                                <div>
                                    <label class="block text-xs font-bold text-gray-700 mb-1">WhatsApp / Telefone</label>
                                    <input type="text" id="c-phone" required placeholder="Ex: (11) 99999-9999" class="w-full px-4 py-2.5 bg-white border border-gray-300 rounded-xl outline-none focus:border-brand-500 text-sm">
                                </div>
                                <div>
                                    <label class="block text-xs font-bold text-gray-700 mb-1">Endereço de Entrega</label>
                                    <input type="text" id="c-address" required placeholder="Rua, Número, Bairro, Compl. / Apto" class="w-full px-4 py-2.5 bg-white border border-gray-300 rounded-xl outline-none focus:border-brand-500 text-sm">
                                </div>
                                <div>
                                    <label class="block text-xs font-bold text-gray-700 mb-1">Observações do Pedido (obs)</label>
                                    <textarea id="c-obs" rows="2" placeholder="Ex: Sem cebola, ponto da carne bem passado, troco para 50, etc." class="w-full px-4 py-2 bg-white border border-gray-300 rounded-xl outline-none focus:border-brand-500 text-sm resize-none"></textarea>
                                </div>
                                <button type="submit" id="btn-checkout" class="w-full py-3.5 bg-brand-500 text-white font-black rounded-xl hover:bg-brand-600 shadow-lg shadow-brand-500/30 transition text-base mt-2 flex justify-center items-center">
                                    Finalizar Pedido
                                </button>
                            </form>
                        </div>
                        ` : ''}
                    </div>
                </div>
                <style>.slide-left { animation: slideLeft 0.3s ease-out; } @keyframes slideLeft { from { transform: translateX(100%); } to { transform: translateX(0); } }</style>
            `;
            openModal(html);
        }

        window.checkout = async function(e) {
            e.preventDefault();
            if(state.cart.length === 0) return;
            
            const btn = document.getElementById('btn-checkout');
            btn.disabled = true; btn.innerHTML = '<div class="loader w-5 h-5 border-2 border-white border-t-transparent mx-auto"></div>';

            const name = document.getElementById('c-name').value;
            const phone = document.getElementById('c-phone').value;
            const address = document.getElementById('c-address').value;
            const observations = document.getElementById('c-obs').value;
            const total = state.cart.reduce((sum, item) => sum + (item.product.price * item.quantity), 0);

            const order = {
                tenantId: state.publicTenant.id,
                customer: { 
                    name: name.trim(), 
                    phone: phone.trim(),
                    address: address.trim()
                },
                observations: observations.trim(),
                items: state.cart.map(i => ({ 
                    productId: i.product.id, 
                    name: i.product.name, 
                    price: i.product.price, 
                    quantity: i.quantity 
                })),
                total: total,
                status: 'novo',
                createdAt: Date.now()
            };

            try {
                await setDoc(doc(collection(db, collections.orders)), order);
                state.cart = [];
                closeModal();
                
                openModal(`
                    <div class="fixed inset-0 z-50 flex items-center justify-center p-4 overlay fade-in">
                        <div class="bg-white rounded-3xl shadow-2xl p-8 text-center max-w-sm w-full">
                            <div class="w-20 h-20 bg-green-100 text-green-500 rounded-full flex items-center justify-center text-4xl mx-auto mb-6"><i class="fas fa-check"></i></div>
                            <h2 class="text-2xl font-black text-gray-800 mb-2">Pedido Enviado!</h2>
                            <p class="text-gray-500 mb-6">O restaurante já recebeu o seu pedido. Em breve ele começará a ser preparado.</p>
                            <button onclick="closeModal(); handleRoute();" class="w-full bg-gray-900 text-white font-bold py-3.5 rounded-xl">Fechar</button>
                        </div>
                    </div>
                `);
            } catch(err) {
                showToast("Erro ao processar pedido: " + err.message, "error");
                btn.disabled = false; btn.innerHTML = 'Finalizar Pedido';
            }
        }

        window.onload = () => {
            setupRouter();
            initializeAppAuth();
        };
    </script>
</body>
</html>
