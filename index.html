<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>WA Sistema de Vendas</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.css" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.2/Sortable.min.js"></script>
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: {
                        brand: {
                            50: '#fef2f2',
                            100: '#fee2e2',
                            500: '#ef4444',
                            600: '#dc2626',
                            900: '#7f1d1d',
                            dark: '#111827'
                        }
                    }
                }
            }
        }
    </script>
    
    <style>
        body { font-family: 'Inter', sans-serif; -webkit-font-smoothing: antialiased; background-color: #f9fafb; }
        .fade-in { animation: fadeIn 0.3s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
        .hide-scroll::-webkit-scrollbar { display: none; }
        .hide-scroll { -ms-overflow-style: none; scrollbar-width: none; }
        .glass-panel { background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(10px); }
        .loader { border-radius: 50%; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .overlay { background-color: rgba(0, 0, 0, 0.5); backdrop-filter: blur(4px); }
        
        .cropper-container { max-height: 400px; }
        .cropper-modal { background-color: #000; opacity: 0.5; }
        .cropper-view-box { border-radius: 8px; outline: 2px solid #ef4444; }
        .cropper-face { border-radius: 8px; }

        .sortable-ghost { opacity: 0.35 !important; transform: scale(0.97); border: 2px dashed #ef4444 !important; background-color: #fef2f2 !important; }
        .sortable-chosen { box-shadow: 0 12px 25px -5px rgba(0, 0, 0, 0.15), 0 8px 10px -6px rgba(0, 0, 0, 0.1); }
        .sortable-drag { cursor: grabbing !important; opacity: 0.95; transform: rotate(1deg); }
        .drag-handle { touch-action: none; user-select: none; -webkit-user-select: none; }

        .status-card { animation: statusPulse 2s ease-in-out infinite; }
        @keyframes statusPulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.02); } }
        .status-icon { animation: iconBounce 1.5s ease-in-out infinite; }
        @keyframes iconBounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
        .line-clamp-2 { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        .pb-safe { padding-bottom: env(safe-area-inset-bottom); }
    </style>
</head>
<body class="text-gray-800 antialiased overflow-x-hidden">

    <div id="app" class="min-h-screen w-full flex flex-col">
        <div class="flex-grow flex items-center justify-center">
            <div class="loader w-12 h-12 border-4 border-gray-200 border-t-brand-500"></div>
        </div>
    </div>
    
    <div id="modal-container"></div>
    <div id="toast-container" class="fixed top-4 right-4 z-[99] flex flex-col gap-2 pointer-events-none"></div>
    <div id="persistent-toast-container" class="fixed bottom-4 left-4 sm:left-auto sm:right-4 z-[90] flex flex-col gap-2 pointer-events-none"></div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut, onAuthStateChanged, updateProfile, updatePassword } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, getDoc, setDoc, collection, getDocs, updateDoc, deleteDoc, onSnapshot, query, where, serverTimestamp, writeBatch, addDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCZyMVAn_F3me72l8N1PqKTfgnb0cQpUKA",
            authDomain: "sistema-restaurantes-6baf8.firebaseapp.com",
            projectId: "sistema-restaurantes-6baf8",
            storageBucket: "sistema-restaurantes-6baf8.firebasestorage.app",
            messagingSenderId: "753663577381",
            appId: "1:753663577381:web:9771b3c0004264b2745ecc",
            measurementId: "G-0B4Q7M2V5K"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);
        
        const secondaryApp = initializeApp(firebaseConfig, "SecondaryApp");
        const secondaryAuth = getAuth(secondaryApp);

        const collections = {
            tenants: "saas_tenants",
            products: "saas_products",
            orders: "saas_orders",
            notifications: "saas_notifications",
            adminNotifications: "saas_admin_notifications"
        };

        const state = {
            currentUser: null,
            isSuperAdmin: false,
            currentTenant: null,
            
            viewingSlug: null,
            publicTenant: null,
            publicProducts: [],
            cart: [],
            
            adminProducts: [],
            adminOrders: [],
            adminNotifications: [],
            
            superAdminTenants: [],
            superAdminNotifications: [],
            
            isAppLoaded: false,
            isNavigating: false,
            
            // Listeners
            unsubAdminOrders: null,
            unsubAdminProducts: null,
            unsubPublicTenant: null,
            unsubPublicProducts: null,
            unsubOrderListener: null
        };

        window.state = state; // For debugging

        function generateId() { return Math.random().toString(36).substring(2, 15); }

        window.showToast = function(message, type = 'success') {
            const toast = document.createElement('div');
            const bgColor = type === 'success' ? 'bg-gray-900' : 'bg-red-500';
            const icon = type === 'success' ? 'fa-check-circle text-green-400' : 'fa-exclamation-circle text-white';
            
            toast.className = `${bgColor} text-white px-6 py-3 rounded-xl shadow-2xl flex items-center gap-3 fade-in transform transition-all duration-300 pointer-events-auto`;
            toast.innerHTML = `<i class="fas ${icon} text-xl"></i><span class="font-medium text-sm">${message}</span>`;
            
            document.getElementById('toast-container').appendChild(toast);
            setTimeout(() => {
                toast.style.opacity = '0';
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }

        window.showOrderNotification = function(order) {
            const container = document.getElementById('persistent-toast-container');
            if (!container) return;

            const notifId = 'notif-' + order.id;
            if (document.getElementById(notifId)) return; // Já está exibindo

            const div = document.createElement('div');
            div.id = notifId;
            div.className = 'bg-white border-l-4 border-brand-500 shadow-2xl rounded-r-xl p-4 mb-3 w-80 pointer-events-auto transform transition-all duration-300 translate-x-[-150%] sm:translate-x-full relative flex flex-col fade-in';
            
            const itemsSummary = order.items.map(i => `${i.quantity}x ${i.name}`).join(', ');

            div.innerHTML = `
                <button onclick="this.parentElement.remove()" class="absolute top-2 right-2 text-gray-400 hover:text-red-500 transition"><i class="fas fa-times"></i></button>
                <h4 class="font-black text-gray-800 text-sm mb-1 flex items-center gap-2"><i class="fas fa-bell text-brand-500 animate-pulse"></i> Novo Pedido!</h4>
                <p class="font-bold text-brand-600 text-xs mb-1">${order.customer?.name || 'Cliente'}</p>
                <p class="text-[11px] text-gray-500 line-clamp-2 mb-2">${itemsSummary}</p>
                <p class="font-black text-gray-900 text-sm mb-3">Total: ${(order.total || 0).toLocaleString('pt-BR', {style: 'currency', currency: 'BRL'})}</p>
                <button onclick="window.location.hash='#/admin/pedidos'; openOrderDetailsModal('${order.id}'); this.parentElement.remove();" class="w-full bg-brand-50 text-brand-600 font-bold py-2 rounded-lg text-xs hover:bg-brand-100 transition">Ver Detalhes do Pedido</button>
            `;

            container.appendChild(div);
            
            // Animate in based on screen size
            setTimeout(() => {
                div.classList.remove('translate-x-[-150%]', 'sm:translate-x-full');
            }, 50);
        }

        window.openModal = function(htmlContent) {
            document.getElementById('modal-container').innerHTML = htmlContent;
            document.body.style.overflow = 'hidden';
        }

        window.closeModal = function() {
            document.getElementById('modal-container').innerHTML = '';
            document.body.style.overflow = '';
        }

        async function navigateToDashboard(user, isSuperAdmin, tenantData) {
            state.currentUser = user;
            state.isSuperAdmin = isSuperAdmin;
            
            if (tenantData) {
                state.currentTenant = { id: user.uid, ...tenantData };
            } else if (!isSuperAdmin && user) {
                const docRef = doc(db, collections.tenants, user.uid);
                const docSnap = await getDoc(docRef);
                if (docSnap.exists()) {
                    state.currentTenant = { id: docSnap.id, ...docSnap.data() };
                }
            }

            const targetHash = isSuperAdmin ? '#/superadmin' : '#/admin';
            window.location.hash = targetHash;
            // Immediate routing check since hash might be the same
            handleRoute(); 
        }

        function setupRouter() {
            window.addEventListener('hashchange', handleRoute);
            handleRoute();
        }

        async function handleRoute() {
            const hash = window.location.hash;
            const appDiv = document.getElementById('app');

            if (!state.isAppLoaded) return;

            // Clear modals on navigation
            closeModal();

            if (hash === '' || hash === '#/') {
                renderLanding(appDiv);
            } 
            else if (hash.startsWith('#/login')) {
                if (state.currentUser) {
                    window.location.hash = state.isSuperAdmin ? '#/superadmin' : '#/admin';
                } else {
                    renderAuth(appDiv);
                }
            } 
            else if (hash.startsWith('#/superadmin')) {
                if (!state.currentUser || !state.isSuperAdmin) {
                    window.location.hash = '#/login';
                } else {
                    renderSuperAdmin(appDiv, hash);
                }
            }
            else if (hash.startsWith('#/admin')) {
                if (!state.currentUser) {
                    window.location.hash = '#/login';
                } else if (state.isSuperAdmin) {
                    window.location.hash = '#/superadmin';
                } else {
                    renderAdmin(appDiv, hash);
                }
            } 
            else if (hash.startsWith('#/cardapio/')) {
                const slug = hash.split('/')[2];
                if (slug) {
                    state.viewingSlug = slug;
                    await loadPublicMenuData(slug);
                    renderPublicMenu(appDiv);
                } else {
                    window.location.hash = '#/';
                }
            }
            else if (hash.startsWith('#/status-pedido')) {
                renderOrderStatus(appDiv);
            }
            else {
                window.location.hash = '#/';
            }
        }

        async function initializeAppAuth() {
            onAuthStateChanged(auth, async (user) => {
                state.currentUser = user;
                if (user) {
                    state.isSuperAdmin = (user.email === 'willdalves1@gmail.com');
                    if (!state.isSuperAdmin) {
                        try {
                            const docRef = doc(db, collections.tenants, user.uid);
                            const docSnap = await getDoc(docRef);
                            if (docSnap.exists()) {
                                state.currentTenant = { id: docSnap.id, ...docSnap.data() };
                            } else {
                                state.currentTenant = null;
                            }
                        } catch (e) { console.error("Erro ao carregar perfil:", e); }
                    }
                } else {
                    state.currentTenant = null;
                    state.isSuperAdmin = false;
                }
                
                if (!state.isAppLoaded) {
                    state.isAppLoaded = true;
                    setupRouter();
                } else {
                    handleRoute();
                }
            });
        }

        window.doLogout = async function() {
            await signOut(auth);
            state.currentUser = null;
            state.currentTenant = null;
            state.isSuperAdmin = false;
            
            // Clear listeners
            if (state.unsubAdminOrders) { state.unsubAdminOrders(); state.unsubAdminOrders = null; }
            if (state.unsubAdminProducts) { state.unsubAdminProducts(); state.unsubAdminProducts = null; }
            if (state.unsubPublicTenant) { state.unsubPublicTenant(); state.unsubPublicTenant = null; }
            if (state.unsubPublicProducts) { state.unsubPublicProducts(); state.unsubPublicProducts = null; }
            if (state.unsubOrderListener) { state.unsubOrderListener(); state.unsubOrderListener = null; }
            
            window.location.hash = '#/';
        }

        window.renderLanding = function(container) {
            container.innerHTML = `
                <div class="min-h-screen flex flex-col bg-white fade-in">
                    <header class="flex justify-between items-center p-6 lg:px-12 border-b border-gray-100 bg-white sticky top-0 z-40">
                        <div class="font-black text-2xl tracking-tighter flex items-center gap-2">
                            <div class="w-8 h-8 bg-brand-500 rounded-lg flex items-center justify-center text-white text-sm shadow-md shadow-brand-500/30">
                                <i class="fas fa-bolt"></i>
                            </div>
                            <span><span class="text-brand-500">WA</span> Vendas</span>
                        </div>
                        <nav>
                            <button onclick="window.location.hash='#/login'" class="font-semibold text-gray-600 hover:text-brand-500 mr-4 md:mr-6 transition text-sm md:text-base">Entrar</button>
                            <button onclick="window.location.hash='#/login?type=cliente&register=true'" class="bg-brand-dark text-white px-4 md:px-5 py-2 md:py-2.5 rounded-xl font-bold hover:bg-gray-800 transition shadow-lg text-sm md:text-base">Começar Grátis</button>
                        </nav>
                    </header>

                    <main class="flex-grow flex flex-col items-center justify-center text-center px-4 py-16 md:py-20 bg-gradient-to-b from-gray-50 to-white">
                        <div class="inline-flex items-center gap-2 px-4 py-2 rounded-full bg-brand-50 text-brand-600 font-bold text-xs md:text-sm mb-8 border border-brand-100">
                            <span class="relative flex h-2.5 w-2.5">
                              <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-brand-400 opacity-75"></span>
                              <span class="relative inline-flex rounded-full h-2.5 w-2.5 bg-brand-500"></span>
                            </span>
                            Plataforma SaaS Completa
                        </div>
                        <h1 class="text-4xl md:text-6xl lg:text-7xl font-black text-gray-900 tracking-tight mb-6 max-w-4xl leading-tight">
                            O sistema de vendas do seu <span class="text-transparent bg-clip-text bg-gradient-to-r from-brand-500 to-orange-500">Restaurante</span>
                        </h1>
                        <p class="text-lg md:text-xl text-gray-500 mb-10 max-w-2xl font-medium px-4">Cardápio digital, gestão de pedidos e recebimentos via PIX e Cartão. Tudo em uma única plataforma profissional.</p>
                        
                        <div class="flex flex-col sm:flex-row gap-4 w-full sm:w-auto px-4">
                            <button onclick="window.location.hash='#/login?type=cliente&register=true'" class="w-full sm:w-auto bg-brand-500 text-white px-8 py-4 rounded-xl font-bold text-lg hover:bg-brand-600 transition shadow-xl shadow-brand-500/30 flex items-center justify-center gap-2">
                                Criar minha Loja Agora <i class="fas fa-arrow-right"></i>
                            </button>
                            <button onclick="window.location.hash='#/cardapio/demo'" class="w-full sm:w-auto bg-white border-2 border-gray-200 text-gray-700 px-8 py-4 rounded-xl font-bold text-lg hover:border-gray-300 hover:bg-gray-50 transition flex items-center justify-center gap-2">
                                <i class="fas fa-mobile-alt text-brand-500"></i> Ver Cardápio Demo
                            </button>
                        </div>

                        <div class="mt-20 w-full max-w-5xl px-4">
                            <div class="grid grid-cols-1 md:grid-cols-3 gap-6 md:gap-8 text-left">
                                <div class="bg-white p-6 md:p-8 rounded-2xl shadow-sm border border-gray-100">
                                    <div class="w-12 h-12 bg-red-50 text-brand-500 rounded-xl flex items-center justify-center text-xl mb-6"><i class="fas fa-hamburger"></i></div>
                                    <h3 class="text-lg md:text-xl font-bold mb-3">Cardápio Digital Lindo</h3>
                                    <p class="text-gray-500 text-sm leading-relaxed">Mostre seus produtos com fotos incríveis e variações. Seus clientes vão comprar com os olhos.</p>
                                </div>
                                <div class="bg-white p-6 md:p-8 rounded-2xl shadow-sm border border-gray-100">
                                    <div class="w-12 h-12 bg-green-50 text-green-500 rounded-xl flex items-center justify-center text-xl mb-6"><i class="fas fa-motorcycle"></i></div>
                                    <h3 class="text-lg md:text-xl font-bold mb-3">Gestão de Pedidos Real-time</h3>
                                    <p class="text-gray-500 text-sm leading-relaxed">Receba os pedidos direto no painel com alertas visuais sem precisar atualizar a página.</p>
                                </div>
                                <div class="bg-white p-6 md:p-8 rounded-2xl shadow-sm border border-gray-100">
                                    <div class="w-12 h-12 bg-blue-50 text-blue-500 rounded-xl flex items-center justify-center text-xl mb-6"><i class="fas fa-qrcode"></i></div>
                                    <h3 class="text-lg md:text-xl font-bold mb-3">Pagamento Facilitado</h3>
                                    <p class="text-gray-500 text-sm leading-relaxed">Integração para pagamentos ou acerto direto com o cliente. Sem taxas abusivas de terceiros.</p>
                                </div>
                            </div>
                        </div>
                    </main>
                </div>
            `;
        }

        window.renderAuth = function(container) {
            const urlParams = new URLSearchParams(window.location.hash.split('?')[1]);
            const isRegister = urlParams.get('register') === 'true';
            window.authTab = urlParams.get('type') === 'admin' ? 'admin' : 'cliente'; 
            renderAuthUI(container, isRegister);
        }

        window.renderAuthUI = function(container, isRegister) {
            const isAdmin = window.authTab === 'admin';

            container.innerHTML = `
                <div class="min-h-screen flex items-center justify-center bg-gray-50 p-4 fade-in">
                    <div class="bg-white p-6 sm:p-10 rounded-3xl shadow-2xl w-full max-w-md border border-gray-100 relative overflow-hidden">
                        <div class="absolute top-0 left-0 w-full h-2 bg-gradient-to-r ${isAdmin ? 'from-purple-600 to-blue-600' : 'from-brand-500 to-orange-500'}"></div>
                        <div class="text-center mb-8 mt-2">
                            <div class="inline-flex items-center justify-center w-14 h-14 rounded-2xl ${isAdmin ? 'bg-purple-50 text-purple-600' : 'bg-red-50 text-brand-600'} mb-4 shadow-inner">
                                <i class="fas ${isAdmin ? 'fa-shield-alt' : 'fa-store'} text-2xl"></i>
                            </div>
                            <h2 class="text-2xl font-bold text-gray-800">${isAdmin ? 'Acesso Administrativo' : (isRegister ? 'Crie seu Restaurante' : 'Painel do Restaurante')}</h2>
                            <p class="text-gray-500 text-sm mt-1">${isAdmin ? 'Gestão da Plataforma WA Vendas.' : (isRegister ? 'Inicie seu teste e monte seu cardápio.' : 'Gerencie suas vendas e cardápio.')}</p>
                        </div>

                        <div class="flex p-1 bg-gray-100 rounded-xl mb-6">
                            <button onclick="window.authTab='cliente'; renderAuthUI(document.getElementById('app'), false)" class="flex-1 py-2 text-sm font-bold rounded-lg transition ${!isAdmin ? 'bg-white shadow-sm text-brand-600' : 'text-gray-500 hover:text-gray-800'}">Sou Lojista</button>
                            <button onclick="window.authTab='admin'; renderAuthUI(document.getElementById('app'), false)" class="flex-1 py-2 text-sm font-bold rounded-lg transition ${isAdmin ? 'bg-white shadow-sm text-purple-600' : 'text-gray-500 hover:text-gray-800'}">Administrador</button>
                        </div>

                        <form id="auth-form" class="space-y-4" onsubmit="handleAuthSubmit(event, ${isRegister && !isAdmin}, ${isAdmin})">
                            ${(isRegister && !isAdmin) ? `
                                <div>
                                    <label class="block text-xs font-bold text-gray-700 mb-1">Nome do Estabelecimento</label>
                                    <input type="text" id="restaurant-name" required class="w-full px-4 py-3 rounded-xl border border-gray-300 focus:ring-2 focus:ring-brand-500 outline-none transition bg-gray-50 focus:bg-white text-sm">
                                </div>
                                <div>
                                    <label class="block text-xs font-bold text-gray-700 mb-1">Link do Cardápio</label>
                                    <div class="flex border border-gray-300 rounded-xl overflow-hidden focus-within:ring-2 focus-within:ring-brand-500 transition">

                                        <input type="text" id="restaurant-slug" placeholder="sua-loja" required class="flex-1 min-w-0 block w-full px-3 py-3 font-mono text-sm outline-none bg-gray-50 focus:bg-white" oninput="this.value = this.value.toLowerCase().replace(/[^a-z0-9-]/g, '')">
                                    </div>
                                </div>
                                <div>
                                    <label class="block text-xs font-bold text-gray-700 mb-1">WhatsApp</label>
                                    <div class="relative">
                                        <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-gray-400"><i class="fab fa-whatsapp"></i></div>
                                        <input type="tel" id="restaurant-phone" placeholder="(11) 99999-9999" class="w-full pl-11 pr-4 py-3 rounded-xl border border-gray-300 focus:ring-2 focus:ring-brand-500 outline-none transition bg-gray-50 focus:bg-white text-sm">
                                    </div>
                                </div>
                            ` : ''}
                            
                            <div>
                                <label class="block text-xs font-bold text-gray-700 mb-1">E-mail</label>

                                    <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-gray-400"><i class="fas fa-envelope"></i></div>
                                    <input type="email" id="email" required placeholder="seu@email.com" class="w-full pl-11 pr-4 py-3 rounded-xl border border-gray-300 focus:ring-2 focus:ring-brand-500 outline-none transition bg-gray-50 focus:bg-white text-sm">
                                </div>
                            </div>
                            
                            <div>

                                </div>
                            </div>

                                ${isAdmin ? 'Entrar no Painel WA' : (isRegister ? 'Criar Loja e Começar' : 'Acessar meu Restaurante')}

        window.handleAuthSubmit = async function(event, isRegister, isAdmin) {
            event.preventDefault();
            const btn = document.getElementById('auth-btn');
            const originalText = btn.innerHTML;
            btn.innerHTML = '<div class="loader w-5 h-5 border-2 border-white border-t-transparent mx-auto"></div>';
            btn.disabled = true;

            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;

            try {
                if (isRegister && !isAdmin) {
                    const name = document.getElementById('restaurant-name').value.trim();
                    const slug = document.getElementById('restaurant-slug').value.trim().toLowerCase();
                    const phone = document.getElementById('restaurant-phone').value.trim();
                    
                    if(slug.length < 3) throw new Error("Link deve ter pelo menos 3 caracteres.");

                    // Check if slug is unique
                    const slugQuery = query(collection(db, collections.tenants), where("slug", "==", slug));
                    const slugSnap = await getDocs(slugQuery);
                    if (!slugSnap.empty) throw new Error("Este link já está sendo utilizado. Escolha outro.");

                    const userCreds = await createUserWithEmailAndPassword(auth, email, password);
                    await updateProfile(userCreds.user, { displayName: name });
                    
                    const tenantData = {
                        name: name,
                        slug: slug,
                        phone: phone,
                        email: email,
                        password: password,
                        status: 'active',
                        plan: 'trial',
                        createdAt: serverTimestamp(),
                        settings: {
                            open: true,
                            minOrder: 0,
                            primaryColor: '#ef4444',
                            coverImage: '',
                            profileImage: ''
                        }
                    };

                    await setDoc(doc(db, collections.tenants, userCreds.user.uid), tenantData);
                    showToast('Restaurante criado! Redirecionando...');
                    
                    // Directly navigate to dashboard - avoiding F5
                    await navigateToDashboard(userCreds.user, false, tenantData);

                } else {
                    const userCreds = await signInWithEmailAndPassword(auth, email, password);
                    const isSuperAdmin = (email === 'willdalves1@gmail.com');
                    
                    if (isAdmin && !isSuperAdmin) {
                        await signOut(auth);
                        throw new Error("Acesso administrativo negado.");
                    }
                    
                    showToast('Acesso liberado. Carregando...');
                    await navigateToDashboard(userCreds.user, isSuperAdmin, null);
                }
            } catch (error) {
                console.error(error);
                let msg = error.message;
                if(error.code === 'auth/email-already-in-use') msg = "E-mail já cadastrado.";
                if(error.code === 'auth/invalid-credential') msg = "E-mail ou senha incorretos.";
                showToast(msg, 'error');
                btn.innerHTML = originalText;
                btn.disabled = false;
            }
        }

        let initialOrdersLoad = true;

        async function loadAdminData() {
            if (!state.currentTenant) return;
            const tenantId = state.currentTenant.id;

            // 1. Real-time Products Listener
            const productsQuery = query(collection(db, collections.products), where("tenantId", "==", tenantId));
            if (state.unsubAdminProducts) state.unsubAdminProducts();
            
            state.unsubAdminProducts = onSnapshot(productsQuery, (snap) => {
                state.adminProducts = snap.docs.map(d => ({ id: d.id, ...d.data() }))
                    .sort((a, b) => {
                        const orderA = a.order !== undefined ? a.order : 999999;
                        const orderB = b.order !== undefined ? b.order : 999999;
                        if (orderA !== orderB) return orderA - orderB;
                        return (a.createdAt || 0) - (b.createdAt || 0);
                    });
                
                // Update UI if viewing menu builder
                if (window.location.hash === '#/admin/cardapio') {
                    const contentDiv = document.getElementById('admin-content');
                    if (contentDiv) {
                        contentDiv.innerHTML = getAdminContent('cardapio');
                        if(window.initAdminSortable) window.initAdminSortable();
                    }
                }
            });

            // 2. Real-time Orders Listener
            const ordersQuery = query(collection(db, collections.orders), where("tenantId", "==", tenantId));
            if (state.unsubAdminOrders) state.unsubAdminOrders();

            state.unsubAdminOrders = onSnapshot(ordersQuery, (snap) => {
                const newOrdersList = snap.docs.map(d => ({ id: d.id, ...d.data() })).sort((a,b) => (b.createdAt || 0) - (a.createdAt || 0));
                
                if (!initialOrdersLoad && state.isAppLoaded) {
                    // Check for completely new orders
                    const oldIds = new Set(state.adminOrders.map(o => o.id));
                    newOrdersList.forEach(order => {
                        if (!oldIds.has(order.id) && order.status === 'novo') {
                            window.showOrderNotification(order);
                        }
                    });
                }
                
                state.adminOrders = newOrdersList;
                initialOrdersLoad = false;
                
                // Update Notifications history map
                const notifsMap = new Map();
                state.adminOrders.forEach(o => {
                    (o.history || []).forEach(h => {
                        notifsMap.set(h.id || (o.id + '_' + h.createdAt), { ...h, tenantId: o.tenantId, orderId: o.id });
                    });
                });
                state.adminNotifications = Array.from(notifsMap.values()).sort((a,b) => (b.createdAt || 0) - (a.createdAt || 0));

                // Update UI if viewing specific tabs
                const hash = window.location.hash;
                const contentDiv = document.getElementById('admin-content');
                
                if (contentDiv) {
                    if (hash === '#/admin/pedidos') {
                        contentDiv.innerHTML = getAdminContent('pedidos');
                    } else if (hash === '#/admin/notificacoes') {
                        contentDiv.innerHTML = getAdminContent('notificacoes');
                    } else if (hash === '#/admin/dashboard' || hash === '#/admin') {
                        contentDiv.innerHTML = getAdminContent('dashboard');
                    }
                    updateAdminNavBadges();
                }
            });
            
            // First load complete
            const contentDiv = document.getElementById('admin-content');
            if (contentDiv) {
                const subRoute = window.location.hash.split('/')[2] || 'dashboard';
                contentDiv.innerHTML = getAdminContent(subRoute);
                if (subRoute === 'cardapio' && window.initAdminSortable) {
                    setTimeout(window.initAdminSortable, 200);
                }
                updateAdminNavBadges();
            }
        }

            if (desktopNav) {
                desktopNav.innerHTML = `<div class="flex items-center gap-3"><i class="fas fa-bell w-5"></i> Notificações</div>${badgeHTML}`;

                    case 'preparando': return `<span class="px-2.5 py-1 bg-yellow-100 text-yellow-700 rounded-lg text-[10px] sm:text-xs font-bold border border-yellow-200 uppercase whitespace-nowrap">Preparando</span>`;
                    case 'entrega': return `<span class="px-2.5 py-1 bg-purple-100 text-purple-700 rounded-lg text-[10px] sm:text-xs font-bold border border-purple-200 uppercase whitespace-nowrap">Em Entrega</span>`;
                    case 'entregue': return `<span class="px-2.5 py-1 bg-green-100 text-green-700 rounded-lg text-[10px] sm:text-xs font-bold border border-green-200 uppercase whitespace-nowrap">Entregue</span>`;
                    case 'recusado':
                    case 'cancelado': return `<span class="px-2.5 py-1 bg-red-100 text-red-700 rounded-lg text-[10px] sm:text-xs font-bold border border-red-200 uppercase whitespace-nowrap">Cancelado</span>`;

            };

            return `
                <div class="bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden">
                    <div class="overflow-x-auto hide-scroll">
                        <table class="w-full text-left border-collapse">
                            <thead class="bg-gray-50 text-xs uppercase text-gray-500 font-bold border-b border-gray-100">
                                <tr>
                                    <th class="p-4 whitespace-nowrap">Cliente</th>
                                    <th class="p-4 hidden md:table-cell">Endereço</th>
                                    <th class="p-4">Itens</th>
                                    <th class="p-4 whitespace-nowrap">Total</th>
                                    <th class="p-4 text-center">Status</th>
                                </tr>
                            </thead>
                            <tbody class="divide-y divide-gray-100 text-sm">
                                ${state.adminOrders.map(o => `
                                    <tr class="hover:bg-gray-50/80 transition cursor-pointer" onclick="openOrderDetailsModal('${o.id}')">
                                        <td class="p-4">
                                            <div class="font-bold text-gray-900 truncate max-w-[120px] sm:max-w-[200px]">${o.customer?.name || 'Cliente'}</div>
                                            <div class="text-[10px] text-gray-400 font-mono mt-0.5">${new Date(o.createdAt).toLocaleTimeString('pt-BR', {hour: '2-digit', minute:'2-digit'})}</div>
                                        </td>
                                        <td class="p-4 hidden md:table-cell text-xs text-gray-600 max-w-[200px] truncate">
                                            ${o.customer?.address || '-'}
                                        </td>
                                        <td class="p-4 text-xs font-medium text-gray-600">
                                            ${o.items.length} item(ns)
                                        </td>
                                        <td class="p-4 font-black text-brand-600 whitespace-nowrap">
                                            ${(o.total || 0).toLocaleString('pt-BR', {style: 'currency', currency: 'BRL'})}
                                        </td>
                                        <td class="p-4 text-center">
                                            ${getStatusBadge(o.status)}
                                        </td>
                                    </tr>
                                `).join('')}
                                ${state.adminOrders.length === 0 ? `<tr><td colspan="5" class="p-12 text-center text-gray-400 font-medium">Nenhum pedido recebido.</td></tr>` : ''}
                            </tbody>
                        </table>
                    </div>
                </div>
            `;
        }

        window.openOrderDetailsModal = function(orderId) {

            const clientPhone = order.customer?.phone || '';
            const hasClientWpp = clientPhone.length > 5;

                <div class="fixed inset-0 z-50 flex items-center justify-center p-4 overlay fade-in">
                    <div class="bg-white rounded-3xl shadow-2xl w-full max-w-2xl overflow-hidden flex flex-col max-h-[90vh]">
                        <div class="p-4 sm:p-6 border-b flex justify-between items-center bg-gray-50 shrink-0">
                            <div>
                                <h3 class="font-bold text-gray-800 text-base sm:text-lg flex items-center gap-2">
                                    <i class="fas fa-receipt text-brand-500"></i> Detalhes & Edição do Pedido

                                <p class="text-[10px] sm:text-xs text-gray-500 mt-1">Realizado em: ${new Date(order.createdAt || Date.now()).toLocaleString('pt-BR')}</p>

                        <div class="p-4 sm:p-6 overflow-y-auto flex-grow space-y-5">

                            <div class="p-4 rounded-2xl border ${hasWhatsApp ? 'bg-green-50 border-green-200' : 'bg-gray-50 border-gray-200'} flex items-center justify-between gap-4">
                                <div class="flex items-center gap-3">
                                    <div class="w-10 h-10 ${hasWhatsApp ? 'bg-green-100 text-green-600' : 'bg-gray-200 text-gray-400'} rounded-xl flex items-center justify-center text-lg shrink-0">
                                        <i class="fab fa-whatsapp"></i>
                                    </div>
                                    <div>
                                        <p class="text-[11px] font-bold ${hasWhatsApp ? 'text-green-800' : 'text-gray-500'} uppercase tracking-wider mb-0.5">WhatsApp do Restaurante</p>
                                        <p class="text-sm font-black ${hasWhatsApp ? 'text-green-700' : 'text-gray-400'}">${tenantPhone || 'Não configurado'}</p>
                                    </div>
                                </div>
                                ${hasClientWpp ? `
                                    <a href="https://wa.me/55${clientPhone.replace(/\D/g, '')}?text=Olá ${order.customer?.name.split(' ')[0]}, somos do restaurante ${state.currentTenant.name}. Sobre o seu pedido..." target="_blank" class="bg-[#25D366] hover:bg-[#128C7E] text-white px-4 py-2 rounded-xl font-bold transition shadow-sm text-xs flex items-center gap-2 shrink-0">
                                        <i class="fas fa-comment"></i> Falar com Cliente
                                    </a>
                                ` : ''}
                            </div>

                            <form id="order-edit-form" onsubmit="saveOrderEdits(event, '${order.id}')" class="space-y-5">
                                <!-- Informações do Cliente -->
                                <div class="bg-white p-4 rounded-2xl border border-gray-200 shadow-sm">
                                    <h4 class="font-black text-[11px] uppercase tracking-wider text-gray-500 mb-3 flex items-center gap-1.5">
                                        <i class="fas fa-user"></i> Informações do Cliente (Editáveis)
                                    </h4>
                                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                                        <div>
                                            <label class="block text-[10px] font-bold text-gray-400 mb-1 uppercase">Nome do Cliente</label>
                                            <input type="text" id="modal-order-name" value="${order.customer?.name || ''}" required class="w-full px-3 py-2 bg-gray-50 border border-gray-200 rounded-xl outline-none focus:border-brand-500 text-sm font-medium">
                                        </div>
                                        <div>
                                            <label class="block text-[10px] font-bold text-gray-400 mb-1 uppercase">Telefone / WhatsApp</label>
                                            <input type="text" id="modal-order-phone" value="${order.customer?.phone || ''}" required class="w-full px-3 py-2 bg-gray-50 border border-gray-200 rounded-xl outline-none focus:border-brand-500 text-sm font-medium">
                                        </div>
                                        <div class="sm:col-span-2">
                                            <label class="block text-[10px] font-bold text-gray-400 mb-1 uppercase">Endereço de Entrega</label>
                                            <input type="text" id="modal-order-address" value="${order.customer?.address || ''}" class="w-full px-3 py-2 bg-gray-50 border border-gray-200 rounded-xl outline-none focus:border-brand-500 text-sm font-medium">
                                        </div>
                                    </div>
                                </div>

                                <!-- Itens Pedidos -->
                                <div class="bg-white p-4 rounded-2xl border border-gray-200 shadow-sm">
                                    <h4 class="font-black text-[11px] uppercase tracking-wider text-gray-500 mb-3 flex items-center gap-1.5">
                                        <i class="fas fa-shopping-bag"></i> Itens Pedidos & Informações
                                    </h4>
                                    <div class="space-y-2 mb-4 bg-gray-50 p-3 rounded-xl border border-gray-100">
                                        ${order.items.map(i => `
                                            <div class="flex justify-between items-start text-sm border-b last:border-0 border-gray-200 pb-2 mb-2 last:mb-0 last:pb-0">
                                                <div class="flex gap-2">
                                                    <span class="font-black text-gray-800">${i.quantity}x</span>
                                                    <span class="font-medium text-gray-700">${i.name}</span>
                                                </div>
                                                <span class="text-brand-600 font-bold shrink-0 ml-2">${(i.price * i.quantity).toLocaleString('pt-BR', {style: 'currency', currency: 'BRL'})}</span>
                                            </div>
                                        `).join('')}
                                    </div>
                                    
                                    ${order.observations ? `
                                        <div class="bg-amber-50 p-3 rounded-xl border border-amber-200 mb-4">
                                            <p class="text-[10px] font-black text-amber-800 mb-1 uppercase tracking-wider">Observações do Pedido pelo Cliente (obs)</p>
                                            <p class="text-xs text-amber-900 italic font-medium">"${order.observations}"</p>
                                        </div>
                                    ` : ''}
                                    
                                    <div class="bg-brand-50 p-4 rounded-xl border border-brand-100 flex flex-col sm:flex-row sm:items-center justify-between gap-4">
                                        <div class="w-full sm:w-1/2">
                                            <label class="block text-[10px] font-black text-brand-800 mb-1 uppercase tracking-wider">Status do Pedido:</label>
                                            <select id="modal-order-status" class="w-full px-3 py-2.5 bg-white border border-brand-200 rounded-lg outline-none focus:ring-2 focus:ring-brand-500 text-sm font-bold text-gray-800 shadow-sm">
                                                <option value="novo" ${order.status === 'novo' ? 'selected' : ''}>Novo</option>
                                                <option value="preparando" ${order.status === 'preparando' ? 'selected' : ''}>Preparando</option>
                                                <option value="entrega" ${order.status === 'entrega' ? 'selected' : ''}>Saiu para Entrega</option>
                                                <option value="entregue" ${order.status === 'entregue' ? 'selected' : ''}>Entregue</option>
                                                <option value="recusado" ${order.status === 'recusado' ? 'selected' : ''}>Recusado (Indisponível)</option>
                                                <option value="cancelado" ${order.status === 'cancelado' ? 'selected' : ''}>Cancelado</option>
                                            </select>
                                        </div>
                                        <div class="text-right">
                                            <span class="block text-[10px] font-black text-brand-800 uppercase tracking-wider mb-0.5">Valor Total (R$)</span>
                                            <span class="font-black text-2xl text-brand-600">${(order.total || 0).toLocaleString('pt-BR', {style: 'currency', currency: 'BRL'})}</span>
                                        </div>
                                    </div>
                                </div>
                                
                                <div class="flex gap-3 pt-2">
                                    <button type="button" onclick="closeModal()" class="flex-1 py-3.5 rounded-xl bg-gray-100 text-gray-600 font-bold hover:bg-gray-200 transition text-sm">Cancelar</button>
                                    <button type="submit" id="btn-save-order" class="flex-1 py-3.5 rounded-xl bg-brand-500 text-white font-bold hover:bg-brand-600 transition shadow-lg shadow-brand-500/30 text-sm flex items-center justify-center gap-2">
                                        <i class="fas fa-save"></i> Salvar alterações
                                    </button>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            `;
            openModal(html);
        }

        window.saveOrderEdits = async function(e, orderId) {
            e.preventDefault();
            const btn = document.getElementById('btn-save-order');
            btn.disabled = true; btn.innerHTML = '<div class="loader w-4 h-4 border-2 border-white border-t-transparent mx-auto"></div>';

            const newName = document.getElementById('modal-order-name').value;
            const newPhone = document.getElementById('modal-order-phone').value;
            const newAddress = document.getElementById('modal-order-address').value;
            const newStatus = document.getElementById('modal-order-status').value;

            try {
                await updateDoc(doc(db, collections.orders, orderId), {
                    'customer.name': newName,
                    'customer.phone': newPhone,
                    'customer.address': newAddress,
                    status: newStatus,
                    updatedAt: Date.now()
                });
                
                showToast('Pedido atualizado com sucesso!');
                closeModal();
            } catch (err) {
                showToast('Erro ao atualizar.', 'error');
                btn.disabled = false; btn.innerHTML = 'Salvar alterações';
            }
        };

        function renderAdminSettings() {
            const t = state.currentTenant || {};
            return `
                <div class="max-w-3xl mx-auto space-y-6">
                    <div class="bg-white p-6 md:p-8 rounded-3xl border border-gray-100 shadow-sm">
                        <h3 class="font-black text-gray-800 text-xl mb-1 flex items-center gap-2">
                            <i class="fas fa-address-card text-brand-500"></i> Informações de Contato
                        </h3>
                        <p class="text-xs text-gray-500 mb-6">Atualize o número de telefone/WhatsApp que seus clientes verão e usarão para contato.</p>
                        
                        <form onsubmit="saveTenantSettings(event)" class="space-y-4">
                            <div>
                                <label class="block text-sm font-bold text-gray-700 mb-1">WhatsApp de Contato</label>
                                <div class="relative">
                                    <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-green-500">
                                        <i class="fab fa-whatsapp text-lg"></i>
                                    </div>
                                    <input type="text" id="cfg-phone" value="${t.phone || ''}" required placeholder="(11) 99999-9999" class="w-full pl-11 pr-4 py-3 bg-gray-50 border border-gray-300 rounded-xl outline-none focus:bg-white focus:border-brand-500 focus:ring-2 focus:ring-brand-500/20 transition font-medium text-sm">
                                </div>
                            </div>
                            <button type="submit" id="btn-save-cfg" class="bg-gray-900 text-white font-bold py-3 px-6 rounded-xl hover:bg-black transition shadow-md w-full sm:w-auto text-sm">
                                Salvar Contato
                            </button>
                        </form>
                    </div>

                    <div class="bg-white p-6 md:p-8 rounded-3xl border border-gray-100 shadow-sm border-l-4 border-l-brand-500">
                        <h3 class="font-black text-gray-800 text-xl mb-1 flex items-center gap-2">
                            <i class="fas fa-shield-alt text-brand-500"></i> Segurança
                        </h3>
                        <p class="text-xs text-gray-500 mb-6">Altere sua senha de acesso ao painel. O administrador será notificado da alteração.</p>
                        
                        <form onsubmit="saveTenantPassword(event)" class="space-y-4">
                            <div>
                                <label class="block text-sm font-bold text-gray-700 mb-1">Nova Senha</label>
                                <div class="relative">
                                    <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-gray-400">
                                        <i class="fas fa-lock"></i>
                                    </div>
                                    <input type="password" id="cfg-password" required minlength="6" placeholder="Mínimo 6 caracteres" class="w-full pl-11 pr-4 py-3 bg-gray-50 border border-gray-300 rounded-xl outline-none focus:bg-white focus:border-brand-500 focus:ring-2 focus:ring-brand-500/20 transition text-sm">
                                </div>
                            </div>
                            <button type="submit" id="btn-save-pass" class="bg-brand-500 text-white font-bold py-3 px-6 rounded-xl hover:bg-brand-600 shadow-lg shadow-brand-500/30 transition w-full sm:w-auto text-sm flex justify-center">
                                Editar Senha
                            </button>
                        </form>
                    </div>
                </div>
            `;
        }

        window.saveTenantSettings = async function(e) {
            e.preventDefault();
            const btn = document.getElementById('btn-save-cfg');
            btn.disabled = true; btn.innerHTML = 'Salvando...';
            const newPhone = document.getElementById('cfg-phone').value.trim();
            try {
                await updateDoc(doc(db, collections.tenants, state.currentTenant.id), { phone: newPhone });
                state.currentTenant.phone = newPhone;
                showToast("Contato atualizado com sucesso!");
            } catch(err) {
                showToast("Erro ao atualizar.", "error");
            }
            btn.disabled = false; btn.innerHTML = 'Salvar Contato';
        };

        window.saveTenantPassword = async function(e) {
            e.preventDefault();
            const btn = document.getElementById('btn-save-pass');
            btn.disabled = true; btn.innerHTML = 'Salvando...';
            const newPass = document.getElementById('cfg-password').value;

            try {
                if(state.currentUser) { await updatePassword(state.currentUser, newPass); }
                await updateDoc(doc(db, collections.tenants, state.currentTenant.id), { password: newPass });
                showToast("Senha alterada com sucesso!");
                document.getElementById('cfg-password').value = '';
            } catch(err) {
                let msg = err.message;
                if(err.code === 'auth/requires-recent-login') msg = "Saia e faça login novamente para alterar a senha.";
                showToast("Erro ao alterar senha: " + msg, "error");
            }
            btn.disabled = false; btn.innerHTML = 'Editar Senha';
        };

        window.openRestaurantNameEditor = function() {
            const currentName = state.currentTenant?.name || '';
            openModal(`
                <div class="fixed inset-0 z-50 flex items-center justify-center p-4 overlay fade-in">
                    <div class="bg-white rounded-3xl shadow-2xl w-full max-w-sm overflow-hidden">
                        <div class="p-5 border-b bg-gray-50 flex justify-between items-center"><h3 class="font-bold text-gray-800"><i class="fas fa-store text-brand-500 mr-2"></i> Editar Nome</h3><button onclick="closeModal()" class="text-gray-400 hover:text-red-500">&times;</button></div>
                        <form onsubmit="saveMenuSetting(event, 'name')" class="p-5 space-y-4">
                            <input type="text" id="t-setting-val" required value="${currentName}" class="w-full px-4 py-3 bg-gray-50 border border-gray-300 rounded-xl outline-none focus:border-brand-500 text-sm font-bold text-gray-800">
                            <div class="flex gap-2"><button type="button" onclick="closeModal()" class="flex-1 py-2.5 rounded-xl bg-gray-100 text-gray-600 font-bold text-sm">Cancelar</button><button type="submit" class="flex-1 py-2.5 rounded-xl bg-brand-500 text-white font-bold text-sm">Salvar</button></div>
                        </form>
                    </div>
                </div>
            `);
        };

        window.openSlugEditor = function() {
            const currentSlug = state.currentTenant?.slug || '';
            openModal(`
                <div class="fixed inset-0 z-50 flex items-center justify-center p-4 overlay fade-in">
                    <div class="bg-white rounded-3xl shadow-2xl w-full max-w-sm overflow-hidden">
                        <div class="p-5 border-b bg-gray-50 flex justify-between items-center"><h3 class="font-bold text-gray-800"><i class="fas fa-link text-brand-500 mr-2"></i> Mudar Link</h3><button onclick="closeModal()" class="text-gray-400 hover:text-red-500">&times;</button></div>
                        <form onsubmit="saveMenuSetting(event, 'slug')" class="p-5 space-y-4">
                            <div class="flex border border-gray-300 rounded-xl overflow-hidden focus-within:border-brand-500 bg-gray-50"><span class="pl-3 py-3 text-sm text-gray-400 font-mono font-bold">wa.com/</span><input type="text" id="t-setting-val" required value="${currentSlug}" class="w-full py-3 pr-3 bg-transparent outline-none text-sm font-mono font-bold text-brand-600" oninput="this.value = this.value.toLowerCase().replace(/[^a-z0-9-]/g, '');"></div>
                            <div class="flex gap-2"><button type="button" onclick="closeModal()" class="flex-1 py-2.5 rounded-xl bg-gray-100 text-gray-600 font-bold text-sm">Cancelar</button><button type="submit" class="flex-1 py-2.5 rounded-xl bg-brand-500 text-white font-bold text-sm">Salvar</button></div>
                        </form>
                    </div>
                </div>
            `);
        };

        window.openImageEditor = function(type) {
            const isProfile = type === 'profile';
            const currentImage = isProfile ? (state.currentTenant?.settings?.profileImage || '') : (state.currentTenant?.settings?.coverImage || '');
            openModal(`
                <div class="fixed inset-0 z-50 flex items-center justify-center p-4 overlay fade-in">
                    <div class="bg-white rounded-3xl shadow-2xl w-full max-w-sm overflow-hidden">
                        <div class="p-5 border-b bg-gray-50 flex justify-between items-center"><h3 class="font-bold text-gray-800"><i class="fas ${isProfile?'fa-user-circle':'fa-image'} text-brand-500 mr-2"></i> ${isProfile?'Foto Perfil':'Foto Topo'}</h3><button onclick="closeModal()" class="text-gray-400">&times;</button></div>
                        <div class="p-5 space-y-4">
                            <input type="url" id="image-url-input" value="${currentImage}" placeholder="URL da Imagem" class="w-full px-3 py-2 bg-gray-50 border rounded-lg text-sm mb-2 outline-none">
                            <input type="file" id="image-file-input" accept="image/*" class="w-full text-sm">
                            <img id="image-preview" src="${currentImage}" class="w-full h-32 object-cover rounded-lg border ${currentImage?'':'hidden'}">
                            <div class="flex gap-2"><button onclick="closeModal()" class="flex-1 py-2.5 rounded-xl bg-gray-100 text-gray-600 font-bold text-sm">Cancelar</button><button onclick="saveImageSetting('${type}')" class="flex-1 py-2.5 rounded-xl bg-brand-500 text-white font-bold text-sm">Salvar</button></div>
                        </div>
                    </div>
                </div>
            `);
            setTimeout(() => {
                document.getElementById('image-file-input').addEventListener('change', function(e) {
                    if (e.target.files[0]) {
                        const reader = new FileReader();
                        reader.onload = function(event) {
                            document.getElementById('image-url-input').value = event.target.result;
                            document.getElementById('image-preview').src = event.target.result;
                            document.getElementById('image-preview').classList.remove('hidden');
                        };
                        reader.readAsDataURL(e.target.files[0]);
                    }
                });
            }, 50);
        };

        window.saveMenuSetting = async function(e, field) {
            e.preventDefault();
            const val = document.getElementById('t-setting-val').value.trim();
            if (!val) return showToast("Valor inválido", "error");
            try {
                await updateDoc(doc(db, collections.tenants, state.currentTenant.id), { [field]: val });
                state.currentTenant[field] = val;
                showToast("Atualizado!");
                closeModal();
                if (window.location.hash === '#/admin/cardapio') document.getElementById('admin-content').innerHTML = getAdminContent('cardapio');
            } catch(err) { showToast("Erro: " + err.message, "error"); }
        };

        window.saveImageSetting = async function(type) {
            const url = document.getElementById('image-url-input').value.trim();
            const field = type === 'profile' ? 'settings.profileImage' : 'settings.coverImage';
            try {
                await updateDoc(doc(db, collections.tenants, state.currentTenant.id), { [field]: url });
                if(type === 'profile') state.currentTenant.settings.profileImage = url;
                else state.currentTenant.settings.coverImage = url;
                showToast("Imagem salva!");
                closeModal();
            } catch(err) { showToast("Erro.", "error"); }
        };

        window.openProductModal = function() {
            openModal(`
                <div class="fixed inset-0 z-50 flex items-center justify-center p-4 overlay fade-in">
                    <div class="bg-white rounded-3xl shadow-2xl w-full max-w-sm overflow-hidden flex flex-col">
                        <div class="p-5 border-b flex justify-between items-center bg-gray-50"><h3 class="font-bold text-gray-800"><i class="fas fa-hamburger text-brand-500 mr-2"></i> Novo Produto</h3><button onclick="closeModal()" class="text-gray-400">&times;</button></div>
                        <form class="p-5 space-y-4" onsubmit="saveProduct(event)">
                            <input type="text" id="prod-name" required placeholder="Nome do Produto" class="w-full px-3 py-2 bg-gray-50 border border-gray-300 rounded-xl outline-none focus:border-brand-500 text-sm font-bold text-gray-800">

                description: document.getElementById('prod-desc').value,

        window.updateProduct = async function(e, productId) {
            e.preventDefault();
            const updated = {
                name: document.getElementById('edit-prod-name').value,
                description: document.getElementById('edit-prod-desc').value,
                price: parseFloat(document.getElementById('edit-prod-price').value),

        window.deleteProduct = async function(id) {
            if(confirm("Excluir este produto permanentemente?")) {
                await deleteDoc(doc(db, collections.products, id));
                showToast("Produto excluído.");
            }

        window.initAdminSortable = function() {
            const container = document.getElementById('admin-products-list');
            if (!container || typeof Sortable === 'undefined') return;
            new Sortable(container, {
                animation: 200, handle: '.drag-handle', ghostClass: 'sortable-ghost',
                onEnd: async function(evt) {
                    if (evt.oldIndex === evt.newIndex) return;
                    const itemEls = container.querySelectorAll('.admin-product-card');
                    const newOrderedIds = Array.from(itemEls).map(el => el.getAttribute('data-id'));
                    try {
                        const batch = writeBatch(db);
                        newOrderedIds.forEach((id, index) => batch.update(doc(db, collections.products, id), { order: index }));
                        await batch.commit();
                        showToast('Ordem salva com sucesso!');
                    } catch (e) { showToast('Erro ao reordenar.', 'error'); }
                }
            });
        };

        async function loadPublicMenuData(slug) {
            if (state.unsubPublicTenant) state.unsubPublicTenant();
            if (state.unsubPublicProducts) state.unsubPublicProducts();
            
            const appDiv = document.getElementById('app');
            appDiv.innerHTML = `<div class="flex justify-center h-screen items-center"><div class="loader w-12 h-12 border-4 border-gray-200 border-t-brand-500"></div></div>`;

            return new Promise((resolve) => {
                const qTenant = query(collection(db, collections.tenants), where("slug", "==", slug));
                state.unsubPublicTenant = onSnapshot(qTenant, (snap) => {
                    if (snap.empty) {
                        appDiv.innerHTML = `<div class="min-h-screen flex flex-col items-center justify-center p-4 text-center"><div class="text-6xl mb-4">🍽️</div><h1 class="text-2xl font-bold text-gray-800">Cardápio não encontrado</h1><a href="#/" class="mt-4 text-brand-500 font-bold hover:underline">Voltar</a></div>`;
                        resolve(false);
                        return;
                    }
                    
                    state.publicTenant = { id: snap.docs[0].id, ...snap.docs[0].data() };
                    
                    // Setup products listener
                    if (!state.unsubPublicProducts) {
                        const qProd = query(collection(db, collections.products), where("tenantId", "==", state.publicTenant.id));
                        state.unsubPublicProducts = onSnapshot(qProd, (pSnap) => {
                            state.publicProducts = pSnap.docs.map(d => ({ id: d.id, ...d.data() }))
                                .filter(p => p.active !== false)
                                .sort((a,b) => (a.order || 0) - (b.order || 0));
                            
                            if (window.location.hash.startsWith('#/cardapio/')) {
                                renderPublicMenu(document.getElementById('app'));
                            }
                        });
                    } else if (window.location.hash.startsWith('#/cardapio/')) {
                        // Just update UI if only tenant changed (e.g. Open/Closed status)
                        renderPublicMenu(document.getElementById('app'));
                    }
                    resolve(true);
                });
            });
        }

                    <button onclick="openCart()" class="fixed bottom-6 right-6 md:right-10 bg-brand-500 text-white w-14 h-14 md:w-16 md:h-16 rounded-full shadow-2xl flex items-center justify-center hover:bg-brand-600 transition transform hover:scale-105 z-30">

        window.addToCart = function(id, qty) {
            const p = state.publicProducts.find(x => x.id === id);
            const existing = state.cart.find(x => x.id === id);
            if(existing) existing.quantity += qty;
            else state.cart.push({...p, quantity: qty});
            
            showToast('Adicionado ao carrinho!');
            closeModal();
            const badge = document.getElementById('cart-badge');
            if(badge) {
                badge.innerText = state.cart.reduce((sum, i) => sum + i.quantity, 0);
                badge.classList.remove('hidden');
                badge.classList.add('animate-bounce');
                setTimeout(() => badge.classList.remove('animate-bounce'), 1000);
            }
        }

        window.openCart = function() {
            if(state.cart.length === 0) return showToast('Seu carrinho está vazio', 'error');
            const total = state.cart.reduce((s, i) => s + (i.price * i.quantity), 0);
            
            openModal(`
                <div class="fixed inset-0 z-50 flex items-end sm:items-center justify-center bg-black/50 fade-in pb-safe">
                    <div class="bg-white rounded-t-3xl sm:rounded-3xl w-full max-w-md overflow-hidden flex flex-col max-h-[90vh]">
                        <div class="p-5 border-b flex justify-between items-center bg-gray-50 shrink-0">

                            <button onclick="closeModal()" class="text-gray-400 hover:text-red-500 text-xl leading-none">&times;</button>
                        </div>
                        
                        <div class="p-5 overflow-y-auto flex-grow space-y-4 bg-gray-50/50">
                            ${state.cart.map((i, index) => `
                                <div class="bg-white p-3 rounded-2xl shadow-sm border border-gray-100 flex items-center gap-3">
                                    <div class="w-12 h-12 bg-gray-100 rounded-xl bg-cover bg-center shrink-0 border border-gray-200" style="background-image: url('${i.image}')"></div>
                                    <div class="flex-grow min-w-0">
                                        <h4 class="font-bold text-sm text-gray-800 truncate leading-tight">${i.name}</h4>
                                        <p class="font-black text-brand-600 text-xs mt-0.5">${(i.price * i.quantity).toLocaleString('pt-BR', {style: 'currency', currency: 'BRL'})}</p>
                                    </div>
                                    <div class="flex items-center gap-2 bg-gray-50 rounded-lg p-1 shrink-0">
                                        <button onclick="updateCartItem(${index}, -1)" class="w-6 h-6 flex items-center justify-center text-gray-500 hover:text-brand-500 font-bold">-</button>
                                        <span class="text-xs font-black text-gray-800 w-4 text-center">${i.quantity}</span>
                                        <button onclick="updateCartItem(${index}, 1)" class="w-6 h-6 flex items-center justify-center text-gray-500 hover:text-brand-500 font-bold">+</button>
                                    </div>
                                </div>
                            `).join('')}
                            
                            <textarea id="checkout-obs" rows="2" placeholder="Alguma observação? (Opcional)" class="w-full p-3 bg-white border border-gray-200 rounded-xl outline-none focus:border-brand-500 text-sm resize-none"></textarea>
                            
                            <div class="bg-white p-4 rounded-2xl border border-gray-200 shadow-sm">
                                <h4 class="font-black text-[11px] uppercase tracking-wider text-gray-500 mb-3"><i class="fas fa-map-marker-alt text-gray-400 mr-1"></i> Seus Dados</h4>
                                <input type="text" id="c-name" required placeholder="Seu Nome Completo" class="w-full px-3 py-2.5 bg-gray-50 border border-gray-200 rounded-xl outline-none focus:border-brand-500 text-sm mb-2 font-medium">
                                <input type="tel" id="c-phone" required placeholder="Seu WhatsApp" class="w-full px-3 py-2.5 bg-gray-50 border border-gray-200 rounded-xl outline-none focus:border-brand-500 text-sm mb-2 font-medium">
                                <input type="text" id="c-address" required placeholder="Endereço de Entrega Completo" class="w-full px-3 py-2.5 bg-gray-50 border border-gray-200 rounded-xl outline-none focus:border-brand-500 text-sm font-medium">
                            </div>
                        </div>
                        
                        <div class="p-5 bg-white border-t border-gray-100 shrink-0">
                            <div class="flex justify-between items-end mb-4">
                                <span class="font-bold text-gray-500 text-sm">Total a pagar:</span>
                                <span class="font-black text-2xl text-brand-600">${total.toLocaleString('pt-BR', {style: 'currency', currency: 'BRL'})}</span>
                            </div>
                            <button onclick="processCheckout()" id="btn-checkout" class="w-full bg-brand-500 hover:bg-brand-600 text-white font-black py-4 rounded-xl shadow-lg shadow-brand-500/30 transition flex justify-center items-center gap-2">
                                Confirmar Pedido <i class="fas fa-arrow-right"></i>
                            </button>
