<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WA CRM - Azul Moderno</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Inter', sans-serif;
    }
    /* Estilos extras para barra de rolagem e transições */
    ::-webkit-scrollbar {
      width: 8px;
    }
    ::-webkit-scrollbar-track {
      background: #f1f1f1;
    }
    ::-webkit-scrollbar-thumb {
      background: #bfdbfe;
      border-radius: 4px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #60a5fa;
    }
  </style>
</head>
<body class="bg-blue-50 text-gray-800">
  <div id="layoutContainer" class="flex flex-col lg:flex-row min-h-screen">
    <!-- Sidebar -->
    <aside class="lg:block w-full lg:w-72 bg-blue-800 text-white p-6 flex flex-col shadow-lg">
      <h1 class="text-3xl font-bold mb-4">WA CRM</h1>
      <p class="text-sm opacity-80">Total de Serviços</p>
      <p id="totalValor" class="text-4xl font-extrabold mb-6">R$ 0,00</p>

      <button id="addClienteBtn" class="bg-white text-blue-800 px-4 py-3 rounded-xl font-semibold shadow hover:bg-blue-100 transition mb-2 flex items-center justify-center gap-2">
        <span>+</span> Novo Cliente
      </button>
      
      <button id="exportarBtn" class="bg-blue-700 text-white border border-blue-600 px-4 py-3 rounded-xl font-semibold shadow hover:bg-blue-600 transition mb-2 flex items-center justify-center gap-2">
        <span>⬇️</span> Exportar JSON
      </button>
      
      <label for="importarInput" class="mb-6">
        <div class="bg-blue-700 text-white border border-blue-600 px-4 py-3 rounded-xl font-semibold shadow text-center cursor-pointer hover:bg-blue-600 transition flex items-center justify-center gap-2">
          <span>⬆️</span> Importar JSON
        </div>
        <input type="file" id="importarInput" accept=".json" class="hidden" />
      </label>

      <!-- NOVO BOTÃO ADICIONADO AQUI -->
      <div class="mt-auto pt-4 border-t border-blue-600">
        <button id="limparTudoBtn" class="w-full bg-red-600 text-white px-4 py-3 rounded-xl font-semibold shadow hover:bg-red-700 transition flex items-center justify-center gap-2">
          <span>🗑️</span> Limpar Todos
        </button>
      </div>
    </aside>

    <!-- Conteúdo principal -->
    <main class="flex-1 p-4 sm:p-6 overflow-x-hidden">
      <!-- Dashboard Resumo -->
      <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4 mb-6">
        <div class="bg-white border-l-4 border-blue-500 p-4 rounded-lg shadow">
          <h3 class="text-sm text-gray-500">Total Realizando</h3>
          <p id="totalRealizando" class="text-2xl font-bold text-blue-700">0</p>
        </div>
        <div class="bg-white border-l-4 border-green-500 p-4 rounded-lg shadow">
          <h3 class="text-sm text-gray-500">Total Entregue</h3>
          <p id="totalEntregue" class="text-2xl font-bold text-green-700">0</p>
        </div>
        <div class="bg-white border-l-4 border-gray-500 p-4 rounded-lg shadow">
          <h3 class="text-sm text-gray-500">Total de Clientes</h3>
          <p id="totalClientes" class="text-2xl font-bold text-gray-800">0</p>
        </div>
      </div>

      <!-- Barra de ações -->
      <div class="flex flex-wrap justify-between items-center gap-3 mb-6">
        <div class="flex items-center gap-2 w-full sm:w-auto">
          <input type="text" id="buscarCliente" placeholder="🔍 Buscar clientes..." class="p-2 pl-10 border rounded-lg w-full sm:w-64 bg-white shadow-sm focus:ring-2 focus:ring-blue-300" />
        </div>
      </div>

      <!-- Lista de filtros -->
      <div class="flex flex-col md:flex-row md:items-center md:gap-4 gap-3 mb-6">
        <select id="filtroStatus" class="p-3 border rounded-lg w-full md:w-auto bg-white shadow-sm">
          <option value="">Todas Situações</option>
          <option value="realizando">Realizando</option>
          <option value="entregue">Entregue</option>
        </select>
        <select id="filtroServico" class="p-3 border rounded-lg w-full md:w-auto bg-white shadow-sm">
          <option value="">Todos Serviços</option>
          <option value="logotipo">Logotipo</option>
          <option value="site">Site</option>
          <option value="anuncio">Anúncio</option>
        </select>
        <select id="filtroPrioridade" class="p-3 border rounded-lg w-full md:w-auto bg-white shadow-sm">
          <option value="">Todas Prioridades</option>
          <option value="baixa">Baixa</option>
          <option value="média">Média</option>
          <option value="alta">Alta</option>
        </select>
      </div>

      <!-- Cards -->
      <div id="listaClientes" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
        <!-- Os cards serão gerados via JavaScript -->
      </div>
    </main>
  </div>

  <!-- Modal -->
  <div id="modalCliente" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50 p-4 backdrop-blur-sm">
    <div class="bg-white p-6 sm:p-8 rounded-xl shadow-2xl w-full max-w-2xl transform transition-all">
      <h2 class="text-2xl font-bold mb-6 text-blue-800 flex justify-between items-center">
        <span id="tituloModal">Novo Cliente</span>
        <button id="fecharModalX" class="text-gray-400 hover:text-gray-600">&times;</button>
      </h2>
      <form id="formCliente" class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <input type="hidden" id="idCliente">
        <input id="nomeCliente" class="border p-3 rounded-lg w-full focus:ring-2 focus:ring-blue-500 outline-none" type="text" placeholder="Nome do Cliente" required>
        <input id="empresaCliente" class="border p-3 rounded-lg w-full focus:ring-2 focus:ring-blue-500 outline-none" type="text" placeholder="Nome da Empresa">
        <input id="contatoCliente" class="border p-3 rounded-lg w-full focus:ring-2 focus:ring-blue-500 outline-none" type="text" placeholder="WhatsApp / Email">
        <input id="valorCliente" class="border p-3 rounded-lg w-full focus:ring-2 focus:ring-blue-500 outline-none" type="number" step="0.01" placeholder="Valor (R$)">

        <select id="tipoServico" class="border p-3 rounded-lg w-full focus:ring-2 focus:ring-blue-500 outline-none">
          <option value="logotipo">Logotipo</option>
          <option value="site">Site</option>
          <option value="anuncio">Anúncio</option>
          <option value="outro">Outro</option>
        </select>
        <select id="prioridadeCliente" class="border p-3 rounded-lg w-full focus:ring-2 focus:ring-blue-500 outline-none">
          <option value="baixa">Baixa Prioridade</option>
          <option value="média">Média Prioridade</option>
          <option value="alta">Alta Prioridade</option>
        </select>
        <select id="statusCliente" class="border p-3 rounded-lg w-full focus:ring-2 focus:ring-blue-500 outline-none">
          <option value="realizando">Realizando</option>
          <option value="entregue">Entregue</option>
        </select>
        <input id="dataCriacao" class="border p-3 rounded-lg w-full focus:ring-2 focus:ring-blue-500 outline-none" type="date">
        <textarea id="obsCliente" class="border p-3 rounded-lg w-full md:col-span-2 focus:ring-2 focus:ring-blue-500 outline-none" rows="3" placeholder="Observações do projeto..."></textarea>
        
        <div class="md:col-span-2 flex justify-end gap-3 mt-4">
          <button type="button" id="cancelarBtn" class="bg-gray-200 text-gray-700 px-6 py-2 rounded-lg hover:bg-gray-300 transition font-medium">Cancelar</button>
          <button type="submit" id="salvarClienteBtn" class="bg-blue-700 text-white px-6 py-2 rounded-lg hover:bg-blue-800 transition font-medium">Salvar Cliente</button>
        </div>
      </form>
    </div>
  </div>

  <!-- SCRIPT INTEGRADO -->
  <script>
    // --- Estado da Aplicação ---
    let clientes = JSON.parse(localStorage.getItem('wa_crm_clientes')) || [];
    let clienteEditandoId = null;

    // --- Elementos do DOM ---
    const listaClientes = document.getElementById('listaClientes');
    const modalCliente = document.getElementById('modalCliente');
    const formCliente = document.getElementById('formCliente');
    const addClienteBtn = document.getElementById('addClienteBtn');
    const cancelarBtn = document.getElementById('cancelarBtn');
    const fecharModalX = document.getElementById('fecharModalX');
    
    // Inputs de Filtro
    const buscarClienteInput = document.getElementById('buscarCliente');
    const filtroStatus = document.getElementById('filtroStatus');
    const filtroServico = document.getElementById('filtroServico');
    const filtroPrioridade = document.getElementById('filtroPrioridade');

    // Botões de Ação
    const exportarBtn = document.getElementById('exportarBtn');
    const importarInput = document.getElementById('importarInput');
    const limparTudoBtn = document.getElementById('limparTudoBtn');

    // --- Funções Principais ---

    function salvarDados() {
      localStorage.setItem('wa_crm_clientes', JSON.stringify(clientes));
      atualizarDashboard();
      renderizarClientes();
    }

    function formatarMoeda(valor) {
      return new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL' }).format(valor || 0);
    }

    function atualizarDashboard() {
      const totalValor = clientes.reduce((acc, c) => acc + Number(c.valor || 0), 0);
      const totalRealizando = clientes.filter(c => c.status === 'realizando').length;
      const totalEntregue = clientes.filter(c => c.status === 'entregue').length;

      document.getElementById('totalValor').textContent = formatarMoeda(totalValor);
      document.getElementById('totalRealizando').textContent = totalRealizando;
      document.getElementById('totalEntregue').textContent = totalEntregue;
      document.getElementById('totalClientes').textContent = clientes.length;
    }

    function renderizarClientes() {
      listaClientes.innerHTML = '';

      // Filtros
      const termo = buscarClienteInput.value.toLowerCase();
      const status = filtroStatus.value;
      const servico = filtroServico.value;
      const prioridade = filtroPrioridade.value;

      const clientesFiltrados = clientes.filter(c => {
        const matchNome = c.nome.toLowerCase().includes(termo) || (c.empresa && c.empresa.toLowerCase().includes(termo));
        const matchStatus = status ? c.status === status : true;
        const matchServico = servico ? c.servico === servico : true;
        const matchPrioridade = prioridade ? c.prioridade === prioridade : true;
        return matchNome && matchStatus && matchServico && matchPrioridade;
      });

      if (clientesFiltrados.length === 0) {
        listaClientes.innerHTML = `
          <div class="col-span-full text-center py-10 text-gray-400">
            <p class="text-xl">Nenhum cliente encontrado.</p>
          </div>
        `;
        return;
      }

      clientesFiltrados.forEach(cliente => {
        const card = document.createElement('div');
        card.className = 'bg-white p-5 rounded-xl shadow hover:shadow-md transition border border-gray-100 relative group';
        
        // Cores baseadas no status/prioridade
        const statusColor = cliente.status === 'entregue' ? 'bg-green-100 text-green-700' : 'bg-blue-100 text-blue-700';
        const prioridadeColor = cliente.prioridade === 'alta' ? 'text-red-500' : (cliente.prioridade === 'média' ? 'text-yellow-600' : 'text-gray-500');

        card.innerHTML = `
          <div class="flex justify-between items-start mb-3">
            <div>
              <h3 class="font-bold text-lg text-gray-800">${cliente.nome}</h3>
              <p class="text-sm text-gray-500">${cliente.empresa || 'Particular'}</p>
            </div>
            <span class="text-xs font-semibold px-2 py-1 rounded-full ${statusColor} uppercase tracking-wide">${cliente.status}</span>
          </div>
          
          <div class="space-y-2 mb-4">
            <p class="text-sm text-gray-600 flex items-center gap-2">
              <span class="w-4">💼</span> ${cliente.servico}
            </p>
            <p class="text-sm text-gray-600 flex items-center gap-2">
              <span class="w-4">💰</span> ${formatarMoeda(cliente.valor)}
            </p>
             <p class="text-sm ${prioridadeColor} flex items-center gap-2">
              <span class="w-4">🔥</span> Prioridade ${cliente.prioridade}
            </p>
          </div>

          <div class="border-t pt-3 flex justify-between items-center mt-auto">
             <span class="text-xs text-gray-400">${new Date(cliente.data).toLocaleDateString('pt-BR')}</span>
             <div class="flex gap-2">
                <button onclick="editarCliente(${cliente.id})" class="text-blue-600 hover:bg-blue-50 p-1.5 rounded-md transition" title="Editar">✏️</button>
                <button onclick="deletarCliente(${cliente.id})" class="text-red-500 hover:bg-red-50 p-1.5 rounded-md transition" title="Excluir">🗑️</button>
             </div>
          </div>
        `;
        listaClientes.appendChild(card);
      });
    }

    // --- Operações CRUD ---

    function abrirModal(editar = false) {
      modalCliente.classList.remove('hidden');
      if (!editar) {
        formCliente.reset();
        document.getElementById('tituloModal').textContent = 'Novo Cliente';
        document.getElementById('dataCriacao').valueAsDate = new Date();
        clienteEditandoId = null;
      } else {
        document.getElementById('tituloModal').textContent = 'Editar Cliente';
      }
    }

    function fecharModal() {
      modalCliente.classList.add('hidden');
      clienteEditandoId = null;
    }

    formCliente.addEventListener('submit', (e) => {
      e.preventDefault();
      
      const novoCliente = {
        id: clienteEditandoId || Date.now(),
        nome: document.getElementById('nomeCliente').value,
        empresa: document.getElementById('empresaCliente').value,
        contato: document.getElementById('contatoCliente').value,
        valor: parseFloat(document.getElementById('valorCliente').value),
        servico: document.getElementById('tipoServico').value,
        prioridade: document.getElementById('prioridadeCliente').value,
        status: document.getElementById('statusCliente').value,
        data: document.getElementById('dataCriacao').value,
        obs: document.getElementById('obsCliente').value
      };

      if (clienteEditandoId) {
        const index = clientes.findIndex(c => c.id === clienteEditandoId);
        if (index !== -1) clientes[index] = novoCliente;
      } else {
        clientes.push(novoCliente);
      }

      salvarDados();
      fecharModal();
    });

    window.editarCliente = (id) => {
      const cliente = clientes.find(c => c.id === id);
      if (!cliente) return;

      clienteEditandoId = id;
      document.getElementById('nomeCliente').value = cliente.nome;
      document.getElementById('empresaCliente').value = cliente.empresa;
      document.getElementById('contatoCliente').value = cliente.contato;
      document.getElementById('valorCliente').value = cliente.valor;
      document.getElementById('tipoServico').value = cliente.servico;
      document.getElementById('prioridadeCliente').value = cliente.prioridade;
      document.getElementById('statusCliente').value = cliente.status;
      document.getElementById('dataCriacao').value = cliente.data;
      document.getElementById('obsCliente').value = cliente.obs;

      abrirModal(true);
    };

    window.deletarCliente = (id) => {
      if(confirm('Tem certeza que deseja excluir este cliente?')) {
        clientes = clientes.filter(c => c.id !== id);
        salvarDados();
      }
    };

    // --- NOVA FUNÇÃO: LIMPAR TUDO ---
    limparTudoBtn.addEventListener('click', () => {
      const confirmacao = confirm("⚠️ ATENÇÃO: Você está prestes a apagar TODOS os clientes do sistema.\n\nEssa ação é irreversível. Deseja continuar?");
      
      if (confirmacao) {
        const segundaConfirmacao = confirm("Tem certeza absoluta? Todos os dados serão perdidos para sempre.");
        if (segundaConfirmacao) {
            clientes = [];
            salvarDados();
            alert("Base de dados limpa com sucesso!");
        }
      }
    });

    // --- Importar / Exportar ---
    exportarBtn.addEventListener('click', () => {
      const dataStr = JSON.stringify(clientes, null, 2);
      const blob = new Blob([dataStr], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = "backup_crm.json";
      a.click();
    });

    importarInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = (event) => {
        try {
          const dadosImportados = JSON.parse(event.target.result);
          if (Array.isArray(dadosImportados)) {
            if(confirm('Deseja substituir a lista atual (OK) ou adicionar aos existentes (Cancelar)?')) {
                clientes = dadosImportados;
            } else {
                clientes = [...clientes, ...dadosImportados];
            }
            salvarDados();
            alert('Dados importados com sucesso!');
          } else {
            alert('Arquivo JSON inválido.');
          }
        } catch (error) {
          alert('Erro ao ler arquivo: ' + error.message);
        }
      };
      reader.readAsText(file);
    });

    // --- Event Listeners UI ---
    addClienteBtn.addEventListener('click', () => abrirModal(false));
    cancelarBtn.addEventListener('click', fecharModal);
    fecharModalX.addEventListener('click', fecharModal);
    
    // Listeners de filtro
    [buscarClienteInput, filtroStatus, filtroServico, filtroPrioridade].forEach(el => {
        el.addEventListener('input', renderizarClientes);
    });

    // Inicialização
    atualizarDashboard();
    renderizarClientes();

  </script>
</body>
</html>
