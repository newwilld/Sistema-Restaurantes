<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WA Sistema de Vendas</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.css" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.js"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: {
                        brand: {
                            50: '#fef2f2',
                            100: '#fee2e2',
                            500: '#ef4444',
                            600: '#dc2626',
                            900: '#7f1d1d',
                            dark: '#111827'
                        }
                    }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Inter', sans-serif; -webkit-font-smoothing: antialiased; background-color: #f9fafb; }
        .fade-in { animation: fadeIn 0.3s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
        .hide-scroll::-webkit-scrollbar { display: none; }
        .hide-scroll { -ms-overflow-style: none; scrollbar-width: none; }
        .glass-panel { background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(10px); }
        .loader { border-radius: 50%; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .overlay { background-color: rgba(0, 0, 0, 0.5); backdrop-filter: blur(4px); }
        
        @media (max-width: 768px) {
            .product-image-mobile { height: 130px !important; }
        }
        
        .cropper-container { max-height: 400px; }
        .cropper-modal { background-color: #000; opacity: 0.5; }
        .cropper-view-box { border-radius: 8px; outline: 2px solid #ef4444; }
        .cropper-face { border-radius: 8px; }

        .sortable-ghost { opacity: 0.35 !important; transform: scale(0.97); border: 2px dashed #ef4444 !important; background-color: #fef2f2 !important; }
        .sortable-chosen { box-shadow: 0 12px 25px -5px rgba(0, 0, 0, 0.15), 0 8px 10px -6px rgba(0, 0, 0, 0.1); }
        .sortable-drag { cursor: grabbing !important; opacity: 0.95; transform: rotate(1deg); }
        .drag-handle { touch-action: none; user-select: none; -webkit-user-select: none; }
    </style>
</head>
<body class="text-gray-800 antialiased overflow-x-hidden">

    <div id="app" class="min-h-screen w-full flex flex-col">
        <div class="flex-grow flex items-center justify-center">
            <div class="loader w-12 h-12 border-4 border-gray-200 border-t-brand-500"></div>
        </div>
    </div>
    
    <div id="modal-container"></div>
    <div id="toast-container" class="fixed top-4 right-4 z-50 flex flex-col gap-2 pointer-events-none"></div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut, onAuthStateChanged, updateProfile, updatePassword, updateEmail } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, getDoc, setDoc, addDoc, collection, getDocs, updateDoc, deleteDoc, onSnapshot, query, where, serverTimestamp, writeBatch } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCZyMVAn_F3me72l8N1PqKTfgnb0cQpUKA",
            authDomain: "sistema-restaurantes-6baf8.firebaseapp.com",
            projectId: "sistema-restaurantes-6baf8",
            storageBucket: "sistema-restaurantes-6baf8.firebasestorage.app",
            messagingSenderId: "753663577381",
            appId: "1:753663577381:web:9771b3c0004264b2745ecc",
            measurementId: "G-0B4Q7M2V5K"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);

        const secondaryApp = initializeApp(firebaseConfig, "SecondaryApp");
        const secondaryAuth = getAuth(secondaryApp);

        const collections = {
            tenants: "saas_tenants",
            products: "saas_products",
            orders: "saas_orders",
            notifications: "saas_notifications",
            adminNotifications: "saas_admin_notifications"
        };

        const state = {
            currentUser: null,
            isSuperAdmin: false,
            currentTenant: null,
            
            viewingSlug: null,
            publicTenant: null,
            publicProducts: [],
            cart: [],
            
            adminProducts: [],
            adminOrders: [],
            adminNotifications: [],

            superAdminTenants: [],
            superAdminOrders: [],
            superAdminNotifications: [],
            
            isAppLoaded: false
        };

        function generateId() {
            return Math.random().toString(36).substring(2, 15);
        }

        window.showToast = function(message, type = 'success') {
            const toast = document.createElement('div');
            const bgColor = type === 'success' ? 'bg-gray-900' : 'bg-red-500';
            const icon = type === 'success' ? 'fa-check-circle text-green-400' : 'fa-exclamation-circle text-white';
            
            toast.className = `${bgColor} text-white px-6 py-3 rounded-xl shadow-2xl flex items-center gap-3 fade-in transform transition-all duration-300`;
            toast.innerHTML = `<i class="fas ${icon} text-xl"></i><span class="font-medium">${message}</span>`;
            
            document.getElementById('toast-container').appendChild(toast);
            setTimeout(() => {
                toast.style.opacity = '0';
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }

        window.openModal = function(htmlContent) {
            document.getElementById('modal-container').innerHTML = htmlContent;
        }

        window.closeModal = function() {
            document.getElementById('modal-container').innerHTML = '';
        }

        function setupRouter() {
            window.addEventListener('hashchange', handleRoute);
            handleRoute();
        }

        async function handleRoute() {
            const hash = window.location.hash;
            const appDiv = document.getElementById('app');

            if (!state.isAppLoaded) return;

            if (hash === '' || hash === '#/') {
                renderLanding(appDiv);
            } 
            else if (hash.startsWith('#/login')) {
                if (state.currentUser) {
                    window.location.hash = state.isSuperAdmin ? '#/superadmin' : '#/admin';
                } else {
                    renderAuth(appDiv);
                }
            } 
            else if (hash.startsWith('#/superadmin')) {
                if (!state.currentUser || !state.isSuperAdmin) {
                    window.location.hash = '#/login';
                } else {
                    renderSuperAdmin(appDiv, hash);
                }
            }
            else if (hash.startsWith('#/admin')) {
                if (!state.currentUser) {
                    window.location.hash = '#/login';
                } else if (state.isSuperAdmin) {
                    window.location.hash = '#/superadmin';
                } else {
                    renderAdmin(appDiv, hash);
                }
            } 
            else if (hash.startsWith('#/cardapio/')) {
                const slug = hash.split('/')[2];
                if (slug) {
                    state.viewingSlug = slug;
                    await loadPublicMenuData(slug);
                    renderPublicMenu(appDiv);
                } else {
                    window.location.hash = '#/';
                }
            }
            else if (hash.startsWith('#/status/')) {
                const orderId = hash.split('/')[2];
                if (orderId) {
                    renderOrderStatus(appDiv, orderId);
                } else {
                    window.location.hash = '#/';
                }
            }
            else {
                window.location.hash = '#/';
            }
        }

        async function initializeAppAuth() {
            onAuthStateChanged(auth, async (user) => {
                state.currentUser = user;
                if (user) {
                    state.isSuperAdmin = (user.email === 'willdalves1@gmail.com');

                    if (!state.isSuperAdmin) {
                        try {
                            const docRef = doc(db, collections.tenants, user.uid);
                            const docSnap = await getDoc(docRef);
                            if (docSnap.exists()) {
                                state.currentTenant = { id: docSnap.id, ...docSnap.data() };
                            } else {
                                state.currentTenant = null;
                            }
                        } catch (e) {
                            console.error("Erro ao carregar perfil da loja:", e);
                        }
                    } else {
                        try {
                            await loadSuperAdminNotifications();
                        } catch (err) {
                            console.warn("Aviso: Não foi possível carregar notificações do admin:", err);
                            state.superAdminNotifications = [];
                        }
                    }
                } else {
                    state.currentTenant = null;
                    state.isSuperAdmin = false;
                }
                
                if (!state.isAppLoaded) {
                    state.isAppLoaded = true;
                    setupRouter(); // Only start router after auth is verified
                } else {
                    handleRoute();
                }
            });
        }
        
        // Starts the application
        window.onload = function() {
            initializeAppAuth();
        };

        window.unsubSuperAdminNotifs = null;
        window.unsubSuperAdminTenantDeletions = null;

        function refreshSuperAdminContent() {
            if (window.location.hash.startsWith('#/superadmin') && document.getElementById('superadmin-content')) {
                const route = window.location.hash.split('/')[2] || 'dashboard';
                document.getElementById('superadmin-content').innerHTML = getSuperAdminContent(route);
                
                const unreadCount = state.superAdminNotifications.filter(n => !n.read).length;
                
                const badgeHTML = unreadCount > 0 ? `<span class="absolute top-1 right-1 w-2.5 h-2.5 bg-red-500 rounded-full ring-2 ring-white"></span>` : '';
                const headerBell = document.querySelector('header a[title="Notificações"]');
                if (headerBell) headerBell.innerHTML = `<i class="fas fa-bell text-lg"></i>${badgeHTML}`;
                
                const sidebarBadgeHTML = unreadCount > 0 ? `<span class="bg-red-500 text-white text-[10px] font-black px-2 py-0.5 rounded-full animate-pulse">${unreadCount}</span>` : '';
                const sidebarLink = document.querySelector('aside nav a[href="#/superadmin/notificacoes"]');
                if (sidebarLink) sidebarLink.innerHTML = `<div class="flex items-center gap-3"><i class="fas fa-bell w-5"></i> Notificações</div>${sidebarBadgeHTML}`;
            }
        }

        async function loadSuperAdminNotifications() {
            if (!state.isSuperAdmin || !state.currentUser) {
                state.superAdminNotifications = [];
                return;
            }

            return new Promise((resolve) => {
                if (window.unsubSuperAdminNotifs) {
                    resolve();
                    return;
                }
                try {
                    const nq = query(collection(db, collections.adminNotifications), where("type", "==", "admin_master"));
                    window.unsubSuperAdminNotifs = onSnapshot(nq, (nsnap) => {
                        const oldCount = state.superAdminNotifications.length;
                        state.superAdminNotifications = nsnap.docs.map(d => ({ id: d.id, ...d.data() }))
                            .sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
                        
                        const newCount = state.superAdminNotifications.length;
                        
                        refreshSuperAdminContent();
                        
                        if (newCount > oldCount) {
                            showToast('Nova notificação recebida!', 'success');
                        }
                        resolve();
                    }, (err) => {
                        console.warn("Erro ao carregar notificações do admin:", err);
                        window.unsubSuperAdminNotifs = null;
                        state.superAdminNotifications = [];
                        resolve();
                    });
                } catch (err) {
                    console.warn("Erro crítico no listener de notificações:", err);
                    window.unsubSuperAdminNotifs = null;
                    state.superAdminNotifications = [];
                    resolve();
                }
            });
        }

        window.renderLanding = function(container) {
            container.innerHTML = `
                <div class="min-h-screen flex flex-col bg-white fade-in">
                    <header class="flex justify-between items-center p-6 lg:px-12 border-b border-gray-100 bg-white sticky top-0 z-50">
                        <div class="font-black text-2xl tracking-tighter flex items-center gap-2">
                            <div class="w-8 h-8 bg-brand-500 rounded-lg flex items-center justify-center text-white text-sm shadow-md shadow-brand-500/30">
                                <i class="fas fa-bolt"></i>
                            </div>
                            <span><span class="text-brand-500">WA</span> Vendas</span>
                        </div>
                        <nav>
                            <button onclick="window.location.hash='#/login'" class="font-semibold text-gray-600 hover:text-brand-500 mr-6 transition">Entrar</button>
                            <button onclick="window.location.hash='#/login?type=cliente&register=true'" class="bg-brand-dark text-white px-5 py-2.5 rounded-xl font-bold hover:bg-gray-800 transition shadow-lg">Começar Grátis</button>
                        </nav>
                    </header>

                    <main class="flex-grow flex flex-col items-center justify-center text-center px-4 py-20 bg-gradient-to-b from-gray-50 to-white">
                        <div class="inline-flex items-center gap-2 px-4 py-2 rounded-full bg-brand-50 text-brand-600 font-bold text-sm mb-8 border border-brand-100">
                            <span class="relative flex h-2.5 w-2.5">
                              <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-brand-400 opacity-75"></span>
                              <span class="relative inline-flex rounded-full h-2.5 w-2.5 bg-brand-500"></span>
                            </span>
                            Plataforma SaaS Completa
                        </div>
                        <h1 class="text-5xl md:text-7xl font-black text-gray-900 tracking-tight mb-6 max-w-4xl leading-tight">
                            O sistema de vendas do seu <span class="text-transparent bg-clip-text bg-gradient-to-r from-brand-500 to-orange-500">Restaurante</span>
                        </h1>
                        <p class="text-xl text-gray-500 mb-10 max-w-2xl font-medium">Cardápio digital, gestão de pedidos e recebimentos via PIX e Cartão. Tudo em uma única plataforma profissional.</p>
                        
                        <div class="flex flex-col sm:flex-row gap-4">
                            <button onclick="window.location.hash='#/login?type=cliente&register=true'" class="bg-brand-500 text-white px-8 py-4 rounded-xl font-bold text-lg hover:bg-brand-600 transition shadow-xl shadow-brand-500/30 flex items-center justify-center gap-2">
                                Criar minha Loja Agora <i class="fas fa-arrow-right"></i>
                            </button>
                        </div>

                        <div class="mt-20 w-full max-w-5xl">
                            <div class="grid grid-cols-1 md:grid-cols-3 gap-8 text-left">
                                <div class="bg-white p-8 rounded-2xl shadow-sm border border-gray-100">
                                    <div class="w-12 h-12 bg-red-50 text-brand-500 rounded-xl flex items-center justify-center text-xl mb-6"><i class="fas fa-hamburger"></i></div>
                                    <h3 class="text-xl font-bold mb-3">Cardápio Digital Lindo</h3>
                                    <p class="text-gray-500 text-sm leading-relaxed">Mostre seus produtos com fotos incríveis, variações e adicionais. Seus clientes vão comprar com os olhos.</p>
                                </div>
                                <div class="bg-white p-8 rounded-2xl shadow-sm border border-gray-100">
                                    <div class="w-12 h-12 bg-green-50 text-green-500 rounded-xl flex items-center justify-center text-xl mb-6"><i class="fas fa-motorcycle"></i></div>
                                    <h3 class="text-xl font-bold mb-3">Gestão de Pedidos</h3>
                                    <p class="text-gray-500 text-sm leading-relaxed">Receba os pedidos direto no painel com alertas sonoros. Acompanhe do preparo até a entrega.</p>
                                </div>
                                <div class="bg-white p-8 rounded-2xl shadow-sm border border-gray-100">
                                    <div class="w-12 h-12 bg-blue-50 text-blue-500 rounded-xl flex items-center justify-center text-xl mb-6"><i class="fas fa-qrcode"></i></div>
                                    <h3 class="text-xl font-bold mb-3">Pagamento Facilitado</h3>
                                    <p class="text-gray-500 text-sm leading-relaxed">Integração nativa para pagamentos. Dinheiro direto na sua conta sem taxas abusivas.</p>
                                </div>
                            </div>
                        </div>
                    </main>
                </div>
            `;
        }

        window.renderAuth = function(container) {
            const urlParams = new URLSearchParams(window.location.hash.split('?')[1]);
            const isRegister = urlParams.get('register') === 'true';
            window.authTab = urlParams.get('type') === 'admin' ? 'admin' : 'cliente'; 
            renderAuthUI(container, isRegister);
        }

        window.renderAuthUI = function(container, isRegister) {
            const isAdmin = window.authTab === 'admin';

            container.innerHTML = `
                <div class="min-h-screen flex items-center justify-center bg-gray-50 p-4 fade-in">
                    <div class="bg-white p-8 sm:p-12 rounded-3xl shadow-2xl w-full max-w-md border border-gray-100 relative overflow-hidden">
                        <div class="absolute top-0 left-0 w-full h-2 bg-gradient-to-r ${isAdmin ? 'from-purple-600 to-blue-600' : 'from-brand-500 to-orange-500'}"></div>
                        <div class="text-center mb-8">
                            <div class="inline-flex items-center justify-center w-16 h-16 rounded-2xl ${isAdmin ? 'bg-purple-50 text-purple-600' : 'bg-red-50 text-brand-600'} mb-4 shadow-inner">
                                <i class="fas ${isAdmin ? 'fa-shield-alt' : 'fa-store'} text-2xl"></i>
                            </div>
                            <h2 class="text-2xl font-bold text-gray-800">${isAdmin ? 'Acesso Administrativo' : (isRegister ? 'Crie seu Restaurante' : 'Painel do Restaurante')}</h2>
                            <p class="text-gray-500 text-sm mt-1">${isAdmin ? 'Gestão da Plataforma WA Vendas.' : (isRegister ? 'Inicie seu teste gratuito e monte seu cardápio.' : 'Gerencie suas vendas e cardápio.')}</p>
                        </div>

                        <div class="flex p-1 bg-gray-100 rounded-xl mb-8">
                            <button onclick="window.authTab='cliente'; renderAuthUI(document.getElementById('app'), false)" class="flex-1 py-2 text-sm font-bold rounded-lg transition ${!isAdmin ? 'bg-white shadow-sm text-brand-600' : 'text-gray-500 hover:text-gray-800'}">Sou Lojista</button>
                            <button onclick="window.authTab='admin'; renderAuthUI(document.getElementById('app'), false)" class="flex-1 py-2 text-sm font-bold rounded-lg transition ${isAdmin ? 'bg-white shadow-sm text-purple-600' : 'text-gray-500 hover:text-gray-800'}">Administrador</button>
                        </div>

                        <form id="auth-form" class="space-y-4" onsubmit="handleAuthSubmit(event, ${isRegister && !isAdmin}, ${isAdmin})">
                            ${(isRegister && !isAdmin) ? `
                                <div>
                                    <label class="block text-sm font-bold text-gray-700 mb-1">Nome do Estabelecimento</label>
                                    <input type="text" id="restaurant-name" required class="w-full px-4 py-3 rounded-xl border border-gray-300 focus:ring-2 focus:ring-brand-500 focus:border-brand-500 outline-none transition bg-gray-50 focus:bg-white">
                                </div>
                                <div>
                                    <label class="block text-sm font-bold text-gray-700 mb-1">Link do Cardápio</label>
                                    <div class="flex shadow-sm rounded-xl overflow-hidden border border-gray-300 focus-within:ring-2 focus-within:ring-brand-500 transition">
                                        <span class="inline-flex items-center px-3 bg-gray-100 text-gray-500 text-sm font-mono border-r border-gray-200">wa.com/</span>
                                        <input type="text" id="restaurant-slug" placeholder="sua-loja" required class="flex-1 min-w-0 block w-full px-3 py-3 font-mono text-sm outline-none bg-gray-50 focus:bg-white" onkeyup="this.value = this.value.toLowerCase().replace(/[^a-z0-9-]/g, '')">
                                    </div>
                                </div>
                                <div>
                                    <label class="block text-sm font-bold text-gray-700 mb-1">WhatsApp</label>
                                    <div class="relative">
                                        <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-gray-400">
                                            <i class="fab fa-whatsapp"></i>
                                        </div>
                                        <input type="tel" id="restaurant-phone" placeholder="(11) 99999-9999" class="w-full pl-11 pr-4 py-3 rounded-xl border border-gray-300 focus:ring-2 focus:ring-brand-500 focus:border-brand-500 outline-none transition bg-gray-50 focus:bg-white">
                                    </div>
                                    <p class="text-xs text-gray-400 mt-1">Número para contato dos clientes</p>
                                </div>
                            ` : ''}
                            
                            <div>
                                <label class="block text-sm font-bold text-gray-700 mb-1">E-mail</label>
                                <div class="relative">
                                    <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-gray-400"><i class="fas fa-envelope"></i></div>
                                    <input type="email" id="email" required placeholder="seu@email.com" class="w-full pl-11 pr-4 py-3 rounded-xl border border-gray-300 focus:ring-2 focus:ring-brand-500 outline-none transition bg-gray-50 focus:bg-white">
                                </div>
                            </div>
                            
                            <div>
                                <label class="block text-sm font-bold text-gray-700 mb-1">Senha</label>
                                <div class="relative">
                                    <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-gray-400"><i class="fas fa-lock"></i></div>
                                    <input type="password" id="password" required placeholder="••••••••" class="w-full pl-11 pr-4 py-3 rounded-xl border border-gray-300 focus:ring-2 focus:ring-brand-500 outline-none transition bg-gray-50 focus:bg-white">
                                </div>
                            </div>

                            <button type="submit" id="auth-btn" class="w-full ${isAdmin ? 'bg-purple-600 hover:bg-purple-700 shadow-purple-500/30' : 'bg-brand-500 hover:bg-brand-600 shadow-brand-500/30'} text-white font-bold py-3.5 rounded-xl transition shadow-lg flex justify-center items-center mt-2">
                                ${isAdmin ? 'Entrar no Painel WA' : (isRegister ? 'Criar Loja e Começar' : 'Acessar meu Restaurante')}
                            </button>
                        </form>

                        ${!isAdmin ? `
                        <div class="mt-6 text-center text-sm text-gray-600 font-medium">
                            ${isRegister ?  
                                `Já tem sua loja? <a href="javascript:void(0)" onclick="renderAuthUI(document.getElementById('app'), false)" class="text-brand-600 hover:underline">Fazer Login</a>` : 
                                `Ainda não é parceiro? <a href="javascript:void(0)" onclick="renderAuthUI(document.getElementById('app'), true)" class="text-brand-600 hover:underline">Cadastre-se</a>`
                            }
                        </div>
                        ` : `
                        <div class="mt-6 text-center text-xs text-gray-400">
                            Acesso restrito à equipe administrativa WA Vendas.
                        </div>
                        `}
                    </div>
                </div>
            `;
        }

        window.handleAuthSubmit = async function(event, isRegister, isAdmin) {
            event.preventDefault();
            const btn = document.getElementById('auth-btn');
            const originalText = btn.innerHTML;
            btn.innerHTML = '<div class="loader w-5 h-5 border-2 border-white border-t-transparent mx-auto"></div>';
            btn.disabled = true;

            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            try {
                if (isRegister && !isAdmin) {
                    const name = document.getElementById('restaurant-name').value;
                    const slug = document.getElementById('restaurant-slug').value;
                    const phone = document.getElementById('restaurant-phone').value.trim();
                    
                    if(slug.length < 3) throw new Error("Link deve ter pelo menos 3 caracteres.");

                    const userCreds = await createUserWithEmailAndPassword(auth, email, password);
                    await updateProfile(userCreds.user, { displayName: name });
                    
                    const tenantData = {
                        name: name,
                        slug: slug,
                        phone: phone,
                        email: email,
                        password: password,
                        status: 'active',
                        plan: 'trial',
                        createdAt: serverTimestamp(),
                        settings: {
                            open: true,
                            minOrder: 0,
                            primaryColor: '#ef4444',
                            coverImage: '',
                            profileImage: ''
                        }
                    };

                    await setDoc(doc(db, collections.tenants, userCreds.user.uid), tenantData);

                    try {
                        await createAdminNotification({
                            type: 'admin_master',
                            title: `Novo Cadastro @${name}`,
                            message: `${name} cadastrou-se na plataforma`,

        async function cleanupTenantData(tenantId) {
            console.log("Limpando dados do tenant removido:", tenantId);
            try {
                const productsQuery = query(collection(db, collections.products), where("tenantId", "==", tenantId));
                const productsSnap = await getDocs(productsQuery);
                const productsBatch = writeBatch(db);
                productsSnap.docs.forEach(doc => productsBatch.delete(doc.ref));
                
                const ordersQuery = query(collection(db, collections.orders), where("tenantId", "==", tenantId));
                const ordersSnap = await getDocs(ordersQuery);
                const ordersBatch = writeBatch(db);
                ordersSnap.docs.forEach(doc => ordersBatch.delete(doc.ref));
                
                const notifsQuery = query(collection(db, collections.notifications), where("tenantId", "==", tenantId));
                const notifsSnap = await getDocs(notifsQuery);
                const notifsBatch = writeBatch(db);
                notifsSnap.docs.forEach(doc => notifsBatch.delete(doc.ref));
                
                await Promise.all([
                    productsSnap.docs.length > 0 ? productsBatch.commit() : Promise.resolve(),
                    ordersSnap.docs.length > 0 ? ordersBatch.commit() : Promise.resolve(),
                    notifsSnap.docs.length > 0 ? notifsBatch.commit() : Promise.resolve()
                ]);
                
                state.superAdminTenants = state.superAdminTenants.filter(t => t.id !== tenantId);
            } catch (err) {
                console.error("Erro ao limpar dados do tenant:", err);
            }
        }

            if (!state.isSuperAdmin) return;
            
            const tenantsPromise = new Promise((resolve) => {
                if (window.unsubSuperAdminTenants) { resolve(); return; }
                window.unsubSuperAdminTenants = onSnapshot(collection(db, collections.tenants), (snap) => {
                    state.superAdminTenants = snap.docs.map(d => ({ id: d.id, ...d.data() }));
                    if (window.location.hash.startsWith('#/superadmin') && document.getElementById('superadmin-content')) {
                        const route = window.location.hash.split('/')[2] || 'dashboard';
                        document.getElementById('superadmin-content').innerHTML = getSuperAdminContent(route);
                    }
                    resolve();
                }, (err) => { resolve(); });
            });

            const deletionsPromise = new Promise((resolve) => {
                if (window.unsubSuperAdminTenantDeletions) { resolve(); return; }
                window.unsubSuperAdminTenantDeletions = onSnapshot(collection(db, collections.tenants), (snap) => {
                    const currentIds = new Set(snap.docs.map(d => d.id));
                    const existingIds = new Set(state.superAdminTenants.map(t => t.id));
                    const removedIds = [...existingIds].filter(id => !currentIds.has(id));
                    
                    if (removedIds.length > 0) {
                        state.superAdminTenants = state.superAdminTenants.filter(t => !removedIds.includes(t.id));
                        removedIds.forEach(async (tenantId) => await cleanupTenantData(tenantId));
                        if (window.location.hash.startsWith('#/superadmin') && document.getElementById('superadmin-content')) {
                            const route = window.location.hash.split('/')[2] || 'dashboard';
                            document.getElementById('superadmin-content').innerHTML = getSuperAdminContent(route);
                        }
                    }
                    resolve();
                }, (err) => { resolve(); });
            });

            await Promise.all([tenantsPromise, deletionsPromise]);
            
            try { await loadSuperAdminNotifications(); } catch (err) { }
            await checkPlanExpirations(); 
            
            const contentDiv = document.getElementById('superadmin-content');
            if (contentDiv) {
                contentDiv.innerHTML = getSuperAdminContent(window.location.hash.split('/')[2] || 'dashboard');

        async function checkPlanExpirations() {
            if (!state.isSuperAdmin) return;
            const batch = writeBatch(db);
            let hasUpdates = false;

            for (let t of state.superAdminTenants) {
                if (!t.renewalDate || t.status === 'canceled') continue;
                
                const today = new Date(); today.setHours(0,0,0,0);
                const renewalParts = t.renewalDate.split('-');
                const renewal = new Date(renewalParts[0], renewalParts[1] - 1, renewalParts[2]); 
                
                const diffTime = renewal - today;
                const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));
                
                let notifType = null; let msg = ''; let updateFields = {};

                if (diffDays === 5 && t.lastNotif !== '5d') { notifType = '5d'; msg = `O plano de @${t.name} vai vencer em 5 dias`; }
                else if (diffDays === 3 && t.lastNotif !== '3d') { notifType = '3d'; msg = `O plano de @${t.name} vai vencer em 3 dias`; }
                else if (diffDays === 0 && t.lastNotif !== '0d') { notifType = '0d'; msg = `O plano de @${t.name} vai vencer hoje`; }
                else if (diffDays === -3 && t.lastNotif !== '-3d') { notifType = '-3d'; msg = `@${t.name} venceu a 3 dias após 5 dias será congelado`; }
                else if (diffDays <= -5 && t.status !== 'suspended') {
                    notifType = 'suspended_auto'; 
                    msg = `O plano de @${t.name} venceu há 5 dias. Foi atualizado para Suspenso.`;
                    updateFields.status = 'suspended';
                }

                if (notifType) {
                    updateFields.lastNotif = notifType;
                    const tRef = doc(db, collections.tenants, t.id);
                    batch.update(tRef, updateFields);
                    hasUpdates = true;
                    
                    t.status = updateFields.status || t.status;
                    t.lastNotif = notifType;

                    try {
                        await createAdminNotification({
                            type: 'admin_master', title: 'Aviso de Vencimento', message: msg,
                            customerName: t.name, action: 'vencimento'
                        });
                    } catch (notifErr) {}
                }
            }
            if (hasUpdates) await batch.commit();
        }

        async function loadAdminData() {

            const q = query(collection(db, collections.products), where("tenantId", "==", state.currentTenant.id));
            const snap = await getDocs(q);
            state.adminProducts = snap.docs.map(d => ({ id: d.id, ...d.data() }))
                .sort((a, b) => {
                    const orderA = a.order !== undefined ? a.order : 999999;
                    const orderB = b.order !== undefined ? b.order : 999999;
                    if (orderA !== orderB) return orderA - orderB;
                    return (a.createdAt || 0) - (b.createdAt || 0);
                });
            
            const oq = query(collection(db, collections.orders), where("tenantId", "==", state.currentTenant.id));
            const osnap = await getDocs(oq);
            state.adminOrders = osnap.docs.map(d => ({ id: d.id, ...d.data() })).sort((a,b) => (b.createdAt || 0) - (a.createdAt || 0));

            let notifsFromCollection = [];
            try {
                const nq = query(collection(db, collections.notifications), where("tenantId", "==", state.currentTenant.id));
                const nsnap = await getDocs(nq);
                notifsFromCollection = nsnap.docs.map(d => ({ id: d.id, ...d.data() }));
            } catch (err) {}

            const notifsMap = new Map();
            notifsFromCollection.forEach(n => notifsMap.set(n.id || (n.orderId + '_' + n.createdAt), n));
            state.adminOrders.forEach(o => {
                (o.history || []).forEach(h => {
                    notifsMap.set(h.id || (o.id + '_' + h.createdAt), {
                        ...h, tenantId: o.tenantId, orderId: o.id
                    });
                });
            });

            state.adminNotifications = Array.from(notifsMap.values()).sort((a,b) => (b.createdAt || 0) - (a.createdAt || 0));

        let sortableInstance = null;
        window.initAdminSortable = function() {
            const container = document.getElementById('admin-products-list');
            if (!container) return;
            if (typeof Sortable === 'undefined') { setTimeout(initAdminSortable, 150); return; }
            if (sortableInstance) { try { sortableInstance.destroy(); } catch(e) {} sortableInstance = null; }
            const cards = container.querySelectorAll('.admin-product-card');
            if (cards.length <= 1) return;

            sortableInstance = new Sortable(container, {
                animation: 200, handle: '.drag-handle', ghostClass: 'sortable-ghost',
                chosenClass: 'sortable-chosen', dragClass: 'sortable-drag', forceFallback: false,
                touchStartThreshold: 3,
                onEnd: async function(evt) {
                    if (evt.oldIndex === evt.newIndex) return;
                    const itemEls = container.querySelectorAll('.admin-product-card');
                    const newOrderedIds = Array.from(itemEls).map(el => el.getAttribute('data-id'));
                    try {
                        const batch = writeBatch(db);
                        newOrderedIds.forEach((id, index) => {
                            batch.update(doc(db, collections.products, id), { order: index });
                            const p = state.adminProducts.find(item => item.id === id);
                            if (p) p.order = index;
                        });
                        await batch.commit();
                        state.adminProducts.sort((a, b) => (a.order !== undefined ? a.order : 999) - (b.order !== undefined ? b.order : 999));
                        showToast('Ordem do cardápio salva com sucesso!');

                }
            });
        };

                    case 'entregue': return `<span class="px-2.5 py-1 bg-green-100 text-green-700 rounded-lg text-xs font-bold border border-green-200 uppercase">Entregue</span>`;

        window.saveOrderEdits = async function(e, orderId) {
            e.preventDefault();
            const order = state.adminOrders.find(o => o.id === orderId);
            if (!order) return;
            
            const newStatus = document.getElementById('modal-order-status').value;
            const updatePayload = { status: newStatus };
            
            if(order.status !== newStatus) {
                const historyEntry = {
                    id: Math.random().toString(36).substr(2, 9),
                    author: state.currentUser?.displayName || 'Restaurante',
                    customerName: order.customer?.name,
                    orderId: orderId,
                    changes: [{field: 'Status', before: order.status, after: newStatus}],
                    createdAt: Date.now()
                };
                updatePayload.history = [...(order.history || []), historyEntry];
            }
            
            try {
                await updateDoc(doc(db, collections.orders, orderId), updatePayload);
                showToast('Status do pedido atualizado!');
                closeModal();
                loadAdminData();
            } catch(err) {
                showToast('Erro ao atualizar: ' + err.message, 'error');
            }
        };

        window.loadPublicMenuData = async function(slug) {
            try {
                const q = query(collection(db, collections.tenants), where("slug", "==", slug));
                const snap = await getDocs(q);
                if (snap.empty) { state.publicTenant = null; return; }
                state.publicTenant = { id: snap.docs[0].id, ...snap.docs[0].data() };

                const pq = query(collection(db, collections.products), where("tenantId", "==", state.publicTenant.id));
                const psnap = await getDocs(pq);
                state.publicProducts = psnap.docs.map(d => ({ id: d.id, ...d.data() }))
                    .sort((a, b) => {
                        const orderA = a.order !== undefined ? a.order : 999999;
                        const orderB = b.order !== undefined ? b.order : 999999;
                        return orderA - orderB;
                    });
            } catch (e) {
                state.publicTenant = null;
            }
        };

        window.renderPublicMenu = function(container) {
            if (!state.publicTenant) {
                container.innerHTML = `<div class="flex-grow flex items-center justify-center text-gray-500 font-bold text-xl">Restaurante não encontrado.</div>`;
                return;
            }
            const t = state.publicTenant;
            const cover = t.settings?.coverImage || 'https://placehold.co/800x300/f3f4f6/a1a1aa?text=Capa';
            const profile = t.settings?.profileImage || 'https://placehold.co/150x150/f3f4f6/a1a1aa?text=Logo';
            const isOpen = t.settings?.open !== false;
            
            const productsHtml = state.publicProducts.filter(p => p.active !== false).map(p => `
                <div class="bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden flex flex-col cursor-pointer hover:shadow-md transition group" onclick="openProductDetail('${p.id}')">
                    <div class="h-32 sm:h-40 bg-gray-100 bg-cover bg-center" style="background-image: url('${p.image || 'https://placehold.co/300x300/eeeeee/999999?text=Sem+Foto'}')"></div>
                    <div class="p-3 flex flex-col flex-grow">
                        <h4 class="font-bold text-gray-800 text-sm leading-tight mb-1 group-hover:text-brand-500 transition line-clamp-2">${p.name}</h4>
                        <p class="text-[10px] text-gray-500 line-clamp-2 mb-2 flex-grow">${p.description || ''}</p>
                        <div class="font-black text-brand-600 text-sm mt-auto">${(p.price || 0).toLocaleString('pt-BR', {style: 'currency', currency: 'BRL'})}</div>
                    </div>
                </div>
            `).join('');

            container.innerHTML = `
                <div class="min-h-screen bg-gray-50 flex flex-col pb-24 fade-in">
                    <div class="w-full h-40 sm:h-56 bg-cover bg-center" style="background-image: url('${cover}')"></div>
                    <div class="max-w-4xl w-full mx-auto px-4 sm:px-6 relative -mt-12">
                        <div class="flex items-end gap-4 mb-4">
                            <div class="w-24 h-24 sm:w-32 sm:h-32 rounded-2xl bg-white p-1.5 shadow-lg shrink-0">
                                <div class="w-full h-full rounded-xl bg-cover bg-center" style="background-image: url('${profile}')"></div>
                            </div>
                            <div class="pb-2">
                                <h1 class="text-2xl sm:text-3xl font-black text-gray-900 leading-tight">${t.name}</h1>
                                <div class="flex items-center gap-2 mt-1">
                                    ${isOpen 
                                        ? `<span class="bg-green-100 text-green-700 px-2 py-0.5 rounded-md text-[10px] font-black uppercase tracking-wider flex items-center gap-1"><span class="w-1.5 h-1.5 rounded-full bg-green-500 animate-pulse"></span> Aberto</span>` 
                                        : `<span class="bg-red-100 text-red-700 px-2 py-0.5 rounded-md text-[10px] font-black uppercase tracking-wider flex items-center gap-1"><span class="w-1.5 h-1.5 rounded-full bg-red-500"></span> Fechado</span>`}
                                </div>
                            </div>
                        </div>
                        
                        <div class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-3 sm:gap-4 mt-8">
                            ${productsHtml}
                        </div>
                    </div>
                    
                    <div id="cart-floating-btn" class="fixed bottom-0 left-0 w-full p-4 bg-white border-t border-gray-100 shadow-[0_-10px_40px_rgba(0,0,0,0.05)] z-40 transition-transform transform translate-y-full">
                        <div class="max-w-4xl mx-auto flex gap-3">
                            <button onclick="openCartModal()" class="flex-1 bg-brand-500 text-white font-bold py-3.5 rounded-xl shadow-lg shadow-brand-500/30 flex items-center justify-between px-6 transition hover:bg-brand-600">
                                <span class="flex items-center gap-2"><i class="fas fa-shopping-cart"></i> <span id="cart-count">0</span> itens</span>
                                <span id="cart-total">R$ 0,00</span>
                            </button>
                        </div>
                    </div>
                </div>
            `;
            updateCartFloatingBtn();
        };

        window.openProductDetail = function(productId) {
            const p = state.publicProducts.find(x => x.id === productId);
            if(!p) return;
            const html = `
                <div class="fixed inset-0 z-50 flex items-end sm:items-center justify-center sm:p-4 overlay fade-in">
                    <div class="bg-white w-full sm:rounded-3xl shadow-2xl sm:max-w-md overflow-hidden flex flex-col max-h-[90vh] rounded-t-3xl">
                        <div class="relative h-48 sm:h-64 bg-gray-100 bg-cover bg-center" style="background-image: url('${p.image || 'https://placehold.co/400x400/eeeeee/999999?text=Sem+Foto'}')">
                            <button onclick="closeModal()" class="absolute top-4 right-4 w-8 h-8 bg-black/50 text-white rounded-full flex items-center justify-center hover:bg-black/70 transition"><i class="fas fa-times"></i></button>
                        </div>
                        <div class="p-5 overflow-y-auto flex-grow">
                            <h3 class="text-xl font-black text-gray-900 mb-2">${p.name}</h3>
                            <p class="text-sm text-gray-600 mb-4">${p.description || ''}</p>
                            <div class="font-black text-xl text-brand-600 mb-6">${(p.price || 0).toLocaleString('pt-BR', {style: 'currency', currency: 'BRL'})}</div>
                            <div>
                                <label class="block text-xs font-bold text-gray-700 mb-2">Alguma observação?</label>
                                <textarea id="item-obs" rows="2" placeholder="Ex: Tirar cebola..." class="w-full px-3.5 py-2.5 bg-gray-50 border border-gray-300 rounded-xl outline-none focus:border-brand-500 text-sm resize-none"></textarea>
                            </div>
                        </div>
                        <div class="p-4 border-t border-gray-100 bg-white">
                            <div class="flex items-center gap-3">
                                <div class="flex items-center bg-gray-100 rounded-xl p-1 shrink-0">
                                    <button onclick="changeItemQtd(-1)" class="w-10 h-10 flex items-center justify-center text-gray-600 font-bold hover:bg-white rounded-lg transition"><i class="fas fa-minus text-xs"></i></button>
                                    <span id="item-qtd" class="w-8 text-center font-black text-gray-800">1</span>
                                    <button onclick="changeItemQtd(1)" class="w-10 h-10 flex items-center justify-center text-gray-600 font-bold hover:bg-white rounded-lg transition"><i class="fas fa-plus text-xs"></i></button>
                                </div>
                                <button onclick="addToCart('${p.id}')" class="flex-grow bg-brand-500 text-white font-bold py-3.5 rounded-xl hover:bg-brand-600 transition shadow-lg shadow-brand-500/30 flex items-center justify-center gap-2">
                                    <span>Adicionar</span>
                                    <span id="item-total-btn">${(p.price || 0).toLocaleString('pt-BR', {style: 'currency', currency: 'BRL'})}</span>
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            `;
            window.currentItemPrice = p.price || 0;
            openModal(html);
        };

        window.changeItemQtd = function(delta) {
            const el = document.getElementById('item-qtd');
            let qtd = parseInt(el.innerText) + delta;
            if(qtd < 1) qtd = 1;
            el.innerText = qtd;
            document.getElementById('item-total-btn').innerText = (window.currentItemPrice * qtd).toLocaleString('pt-BR', {style: 'currency', currency: 'BRL'});
        }

        window.addToCart = function(productId) {
            const p = state.publicProducts.find(x => x.id === productId);
            const qtd = parseInt(document.getElementById('item-qtd').innerText);
            const obs = document.getElementById('item-obs').value.trim();
            state.cart.push({ id: Math.random().toString(36).substr(2, 9), productId: p.id, name: p.name, price: p.price, quantity: qtd, obs: obs });
            closeModal();
            showToast('Adicionado ao carrinho!');
            updateCartFloatingBtn();
        };

        window.updateCartFloatingBtn = function() {
            const btn = document.getElementById('cart-floating-btn');
            if(!btn) return;
            if(state.cart.length > 0) {
                const total = state.cart.reduce((sum, item) => sum + (item.price * item.quantity), 0);
                const count = state.cart.reduce((sum, item) => sum + item.quantity, 0);
                document.getElementById('cart-count').innerText = count;
                document.getElementById('cart-total').innerText = total.toLocaleString('pt-BR', {style: 'currency', currency: 'BRL'});
                btn.classList.remove('translate-y-full');
            } else {
                btn.classList.add('translate-y-full');
            }
        };

        window.openCartModal = function() {
            const isOpen = state.publicTenant?.settings?.open !== false;
            if (!isOpen) { showToast("O restaurante está fechado no momento.", "error"); return; }
            const total = state.cart.reduce((sum, item) => sum + (item.price * item.quantity), 0);
            const html = `
                <div class="fixed inset-0 z-50 flex items-end sm:items-center justify-center sm:p-4 overlay fade-in">
                    <div class="bg-white w-full sm:rounded-3xl shadow-2xl sm:max-w-md overflow-hidden flex flex-col max-h-[90vh] rounded-t-3xl h-[85vh]">
                        <div class="p-5 border-b flex justify-between items-center bg-gray-50 shrink-0">
                            <h3 class="font-black text-gray-900 text-lg flex items-center gap-2"><i class="fas fa-shopping-cart text-brand-500"></i> Seu Pedido</h3>
                            <button onclick="closeModal()" class="w-8 h-8 bg-white text-gray-400 hover:text-gray-800 rounded-full flex items-center justify-center shadow-sm">&times;</button>
                        </div>
                        <div class="p-5 overflow-y-auto flex-grow space-y-4 bg-gray-50">
                            <div class="bg-white rounded-2xl p-4 shadow-sm border border-gray-100">
                                <h4 class="font-bold text-xs text-gray-500 uppercase tracking-wider mb-3">Itens do Pedido</h4>
                                <div class="space-y-3">
                                    ${state.cart.map((item, index) => `
                                        <div class="flex justify-between items-start gap-3">
                                            <div class="flex items-start gap-2 min-w-0">
                                                <span class="font-black text-brand-600 bg-brand-50 px-1.5 py-0.5 rounded text-xs shrink-0">${item.quantity}x</span>
                                                <div class="min-w-0">
                                                    <p class="font-bold text-gray-800 text-sm leading-tight">${item.name}</p>
                                                    ${item.obs ? `<p class="text-[10px] text-amber-600 italic mt-0.5">${item.obs}</p>` : ''}
                                                    <button onclick="removeFromCart(${index})" class="text-[10px] text-red-500 font-bold hover:underline mt-1">Remover</button>
                                                </div>
                                            </div>
                                            <div class="font-black text-gray-700 text-sm shrink-0">${(item.price * item.quantity).toLocaleString('pt-BR', {style: 'currency', currency: 'BRL'})}</div>
                                        </div>
                                    `).join('')}
                                </div>
                            </div>
                            
                            ${state.cart.length > 0 ? `
                                <form id="checkout-form" class="space-y-4" onsubmit="submitOrder(event)">
                                    <div class="bg-white rounded-2xl p-4 shadow-sm border border-gray-100">
                                        <h4 class="font-bold text-xs text-gray-500 uppercase tracking-wider mb-3">Seus Dados</h4>
                                        <div class="space-y-3">
                                            <input type="text" id="c-name" required placeholder="Seu nome completo" class="w-full px-3.5 py-2.5 bg-gray-50 border border-gray-200 rounded-xl outline-none focus:border-brand-500 text-sm font-medium">
                                            <input type="tel" id="c-phone" required placeholder="Seu WhatsApp (com DDD)" class="w-full px-3.5 py-2.5 bg-gray-50 border border-gray-200 rounded-xl outline-none focus:border-brand-500 text-sm font-medium">
                                            <input type="text" id="c-address" required placeholder="Endereço de entrega completo" class="w-full px-3.5 py-2.5 bg-gray-50 border border-gray-200 rounded-xl outline-none focus:border-brand-500 text-sm font-medium">
                                            <textarea id="c-obs" rows="2" placeholder="Observações extras do pedido" class="w-full px-3.5 py-2.5 bg-gray-50 border border-gray-200 rounded-xl outline-none focus:border-brand-500 text-sm resize-none"></textarea>
                                        </div>
                                    </div>
                                    <div class="pt-2">
                                        <button type="submit" id="btn-submit-order" class="w-full bg-green-500 text-white font-black py-4 rounded-xl hover:bg-green-600 transition shadow-lg shadow-green-500/30 flex justify-between items-center px-6 text-lg">
                                            <span>Fazer Pedido</span>
                                            <span>${total.toLocaleString('pt-BR', {style: 'currency', currency: 'BRL'})}</span>
                                        </button>
                                    </div>
                                </form>
                            ` : ''}
                        </div>
                    </div>
                </div>
            `;
            openModal(html);
        };

        window.removeFromCart = function(index) {
            state.cart.splice(index, 1);
            closeModal();
            if(state.cart.length > 0) openCartModal();
            updateCartFloatingBtn();
        };

        window.submitOrder = async function(e) {
            e.preventDefault();
            if(state.cart.length === 0) return;
            const btn = document.getElementById('btn-submit-order');
            const originalContent = btn.innerHTML;
            btn.disabled = true; btn.innerHTML = '<div class="loader w-5 h-5 border-2 border-white border-t-transparent mx-auto"></div>';
            
            const total = state.cart.reduce((sum, item) => sum + (item.price * item.quantity), 0);
            const orderData = {
                tenantId: state.publicTenant.id,
                customer: {
                    name: document.getElementById('c-name').value.trim(),
                    phone: document.getElementById('c-phone').value.trim(),
                    address: document.getElementById('c-address').value.trim()
                },
                items: state.cart,
                observations: document.getElementById('c-obs').value.trim(),
                total: total,
                status: 'novo',
                createdAt: Date.now(),
                history: [{ field: 'status', before: '', after: 'novo', createdAt: Date.now() }]
            };
            
            try {
                const docRef = await addDoc(collection(db, collections.orders), orderData);
                state.cart = [];
                closeModal();
                window.location.hash = '#/status/' + docRef.id;
            } catch(err) {
                showToast("Erro ao enviar pedido.", "error");
                btn.disabled = false; btn.innerHTML = originalContent;
            }
        };

        window.unsubOrderStatus = null;

        window.renderOrderStatus = async function(container, orderId) {
            container.innerHTML = `
                <div class="min-h-screen bg-gray-50 flex flex-col fade-in">
                    <header class="bg-white p-4 shadow-sm border-b border-gray-100 flex items-center justify-between sticky top-0 z-10">
                        <h1 class="font-black text-gray-800 text-lg">Status do Pedido</h1>
                        <button onclick="window.history.back()" class="text-brand-500 font-bold text-sm">Voltar</button>
                    </header>
                    <div id="order-status-content" class="flex-grow p-4 md:p-8 max-w-2xl w-full mx-auto">
                        <div class="flex justify-center py-12"><div class="loader w-8 h-8 border-4 border-gray-200 border-t-brand-500"></div></div>
                    </div>
                </div>
            `;

            if (window.unsubOrderStatus) window.unsubOrderStatus();

            const docRef = doc(db, collections.orders, orderId);
            window.unsubOrderStatus = onSnapshot(docRef, async (snap) => {
                if (!snap.exists()) {
                    document.getElementById('order-status-content').innerHTML = `<div class="text-center py-12 text-gray-500 font-bold">Pedido não encontrado.</div>`;
                    return;
                }
                const order = { id: snap.id, ...snap.data() };
                
                let tenantPhone = ""; let tenantName = "Restaurante";
                try {
                    const tSnap = await getDoc(doc(db, collections.tenants, order.tenantId));
                    if (tSnap.exists()) { tenantPhone = tSnap.data().phone || ""; tenantName = tSnap.data().name || "Restaurante"; }
                } catch(e){}

                updateOrderStatusUI(order, tenantPhone, tenantName);
            });
        };

        function updateOrderStatusUI(order, tenantPhone, tenantName) {
            const content = document.getElementById('order-status-content');
            if(!content) return;
            
            let statusConfig = { text: "Enviado ao Restaurante: Analisando Pedido", color: "text-blue-600", bg: "bg-blue-50", icon: "fa-clock", pulse: true, wppText: "Olá, enviei meu pedido e está em análise!" };
            
            if (order.status === 'preparando' || order.status === 'aceito') {
                statusConfig = { text: "Pedido Aceito", color: "text-green-600", bg: "bg-green-50", icon: "fa-check-circle", pulse: true, wppText: "Olá, vi que meu pedido foi aceito!" };
            } else if (order.status === 'entrega') {
                statusConfig = { text: "Saiu para Entrega", color: "text-purple-600", bg: "bg-purple-50", icon: "fa-motorcycle", pulse: true, wppText: "Olá, vi que meu pedido saiu para entrega!" };
            } else if (order.status === 'entregue') {
                statusConfig = { text: "Pedido Entregue", color: "text-gray-600", bg: "bg-gray-100", icon: "fa-flag-checkered", pulse: false, wppText: "Olá, recebi o pedido." };
            } else if (order.status === 'cancelado' || order.status === 'recusado') {
                statusConfig = { text: "Pedido Recusado (Fechado ou Indisponível)", color: "text-red-600", bg: "bg-red-50", icon: "fa-times-circle", pulse: false, wppText: "Olá, vi que meu pedido foi recusado. Qual o motivo?" };
            }
            
            const itemsText = order.items.map(i => `${i.quantity}x ${i.name}`).join('%0A');
            const totalFormat = (order.total || 0).toLocaleString('pt-BR', {style: 'currency', currency: 'BRL'});
            const fullWppMessage = `Olá *${tenantName}*! Acabei de fazer um pedido.%0A%0A*Itens:*%0A${itemsText}%0A%0A*Total:* ${totalFormat}%0A*Endereço:* ${order.customer?.address || 'Não informado'}%0A%0AStatus atual: ${statusConfig.text}`;
            const wppLink = `https://wa.me/55${tenantPhone.replace(/[^0-9]/g, '')}?text=${fullWppMessage}`;

            content.innerHTML = `
                <div class="bg-white rounded-3xl p-6 md:p-8 shadow-sm border border-gray-100 text-center">
                    <div class="w-20 h-20 mx-auto rounded-full ${statusConfig.bg} ${statusConfig.color} flex items-center justify-center text-3xl mb-4 ${statusConfig.pulse ? 'animate-pulse' : ''}">
                        <i class="fas ${statusConfig.icon}"></i>
                    </div>
                    <h2 class="text-xl md:text-2xl font-black text-gray-900 mb-2">${statusConfig.text}</h2>
                    <p class="text-gray-500 text-xs md:text-sm mb-6">Status atualizado em tempo real. Não é necessário recarregar a página.</p>
                    
                    <div class="bg-gray-50 rounded-2xl p-5 text-left mb-6 border border-gray-100">
                        <h4 class="font-bold text-xs text-gray-500 uppercase tracking-wider mb-3 border-b border-gray-200 pb-2">Resumo do Pedido #${order.id.substring(0,6)}</h4>
                        <div class="space-y-2 mb-4">
                            ${order.items.map(i => `
                                <div class="flex justify-between text-sm">
                                    <span class="font-bold text-gray-800"><span class="text-brand-500">${i.quantity}x</span> ${i.name}</span>
                                    <span class="text-gray-600 font-medium">${(i.price * i.quantity).toLocaleString('pt-BR', {style: 'currency', currency: 'BRL'})}</span>
                                </div>
                            `).join('')}
                        </div>
                        <div class="flex justify-between items-center border-t border-gray-200 pt-3">
                            <span class="font-black text-gray-900">Total</span>
                            <span class="font-black text-brand-600 text-lg">${totalFormat}</span>
                        </div>
                    </div>
                    
                    ${tenantPhone ? `
                        <a href="${wppLink}" target="_blank" class="w-full bg-[#25D366] hover:bg-[#1DA851] text-white font-black py-4 rounded-xl transition shadow-lg shadow-[#25D366]/30 flex items-center justify-center gap-2 text-sm md:text-base">
                            <i class="fab fa-whatsapp text-xl"></i> Enviar detalhes do pedido no WhatsApp
                        </a>
                    ` : ''}
                </div>
            `;
        }

    </script>
</body>
</html>
